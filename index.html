<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Abiding</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#EFEAE0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Abiding">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* Manuscript palette — ink, paper, brass */
    --accent: #16233D;
    --accent-light: #E9E3D3;
    --accent-text: #0d1526;
    --gold: #B99A6C;
    --gold-light: #D2B78F;
    --gold-deep: #8C6F45;
    --gold-bg: #F5EFE0;
    --card-border: rgba(185,154,108,0.32);

    --bg: #EFEAE0;
    --surface: #FBF9F3;
    --surface2: #F4EFE3;
    --border: #E1D8C2;
    --border-strong: #CBBFA0;
    --text: #1c1b18;
    --text-muted: #6b6459;
    --text-faint: #83796a;

    --red: #9C4A2E; --red-bg: #f5e7e1;
    --amber: #a8690f; --amber-bg: #f7edda;
    --green: #4B7859; --green-bg: #e9f1ec;
    --blue: #385f87; --blue-bg: #e9eff5;
    --purple: #5f4f85; --purple-bg: #eeecf3;

    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-body: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;

    --rail-w: 82px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  html { background: #EFEAE0; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    background: var(--bg); color: var(--text);
    height: 100vh;
    height: calc(100dvh + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column;
    overflow: hidden; font-size: 14px;
  }
  h1, h2, h3 { font-family: var(--font-display); }

  /* ── Layout ─────────────────────────────── */
  .app { display: flex; flex: 1; overflow: hidden; }
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* ── Nav rail (desktop) ─────────────────── */
  .rail {
    width: var(--rail-w); flex-shrink: 0; background: var(--accent); color: #EDE7D9;
    display: flex; flex-direction: column; align-items: center; padding: 20px 0 16px; gap: 2px;
    overflow-y: auto;
  }
  .rail-mark {
    width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--gold); color: var(--gold);
    display: flex; align-items: center; justify-content: center; font-family: var(--font-display);
    font-size: 15px; font-weight: 600; margin-bottom: 20px; flex-shrink: 0;
  }
  .rail-item {
    width: 100%; padding: 12px 4px; text-align: center; cursor: pointer; position: relative;
    font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.05em; text-transform: uppercase;
    color: rgba(237,231,217,0.55); transition: color 0.15s; background: none; border: none;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .rail-item svg { width: 17px; height: 17px; opacity: 0.75; }
  .rail-item:hover { color: rgba(237,231,217,0.85); }
  .rail-item.active { color: #fff; }
  .rail-item.active svg { opacity: 1; }
  .rail-item.active::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px; background: var(--gold); }

  /* ── Content header (view title, anchored above scroll) ── */
  .content-header {
    display: flex; align-items: center; gap: 10px; flex-shrink: 0; flex-wrap: wrap;
    padding: calc(var(--safe-top) + 16px) 28px 14px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  #ch-title-wrap { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  #ch-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .content-header .spacer { flex: 1; }
  .list-title { font-family: var(--font-display); font-size: 24px; font-weight: 600; letter-spacing: -0.01em; color: var(--accent); }
  .list-subtitle { font-family: var(--font-mono); font-size: 11.5px; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; color: var(--gold-deep); }

  /* ── Content area ──────────────────────── */
  .content { flex: 1; overflow-y: auto; padding: 22px 28px; padding-bottom: calc(22px + var(--safe-bottom)); background: var(--bg); }
  .view-intro { font-size: 13px; color: var(--text-faint); max-width: 560px; margin-bottom: 20px; line-height: 1.55; }

  @keyframes contentFadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .content > * { animation: contentFadeIn 0.2s ease; }
  @media (prefers-reduced-motion: reduce) { .content > * { animation: none; } }

  .section-label { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.09em; color: var(--gold-deep); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* ── Buttons ───────────────────────────── */
  .btn { padding: 7px 14px; border-radius: 5px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid transparent; transition: all 0.1s; font-family: var(--font-body); }
  .btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
  .btn-primary:hover { background: var(--gold); color: var(--accent-text); border-color: var(--gold); }
  .btn-ghost { background: transparent; color: var(--text-muted); border-color: var(--border); }
  .btn-ghost:hover { background: transparent; color: var(--gold-deep); border-color: var(--gold); }
  .btn-danger { background: transparent; color: var(--red); border-color: var(--red); }
  .btn-danger:hover { background: var(--red-bg); }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .icon-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer; border: none; background: none; color: var(--text-faint); font-size: 15px; transition: all 0.1s; }
  .icon-btn:hover { background: var(--surface2); color: var(--text); }
  .icon-btn.danger:hover { background: var(--red-bg); color: var(--red); }
  .check { width: 16px; height: 16px; border: 1.5px solid var(--gold); border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; flex-shrink: 0; }
  .check:hover { border-color: var(--accent); }
  .check.checked { background: var(--green); border-color: var(--green); }
  .check.checked::after { content: ''; width: 8px; height: 4px; border-left: 1.5px solid white; border-bottom: 1.5px solid white; transform: rotate(-45deg) translateY(-1px); display: block; }

  .empty { text-align: center; padding: 60px 20px; color: var(--text-faint); }
  .empty-icon { margin: 0 auto 16px; width: 64px; height: 64px; background: var(--gold-bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--gold); }
  .empty-title { font-size: 15px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; }
  .empty-sub { font-size: 13px; margin-bottom: 18px; }
  .empty-cta { display: inline-block; margin-top: 4px; padding: 8px 20px; background: var(--accent); color: white; border: none; border-radius: 6px; font-size: 13px; font-weight: 500; font-family: inherit; letter-spacing: 0.04em; cursor: pointer; transition: background 0.15s, color 0.15s; }
  .empty-cta:hover { background: var(--gold); color: var(--accent); }

  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; }

  /* ── Modals ────────────────────────────── */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: var(--surface); border-radius: 14px; width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
  .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 0; }
  .modal-title { font-family: var(--font-display); font-size: 17px; font-weight: 700; color: var(--accent); }
  .modal-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }
  .modal-footer { padding: 0 20px 18px; display: flex; gap: 8px; justify-content: flex-end; }
  .field label { display: block; font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.04em; }
  .field input, .field select, .field textarea { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 16px; color: var(--text); background: var(--surface); outline: none; font-family: inherit; transition: border-color 0.15s; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 70px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* ── Technique / style cards (Breathe & Meditate) ── */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; margin-bottom: 8px; }
  .tcard {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px 16px 14px;
    cursor: pointer; transition: border-color 0.15s, transform 0.15s; text-align: left;
    display: flex; flex-direction: column; gap: 9px; font-family: inherit;
  }
  .tcard:hover { border-color: var(--gold); transform: translateY(-2px); }
  .continue-card { background: var(--accent-light); border-color: var(--card-border); }
  .tcard .tc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .tcard h3 { font-size: 18px; color: var(--accent); font-weight: 600; }
  .tcard .tc-tag {
    font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--gold-deep); background: var(--gold-bg); padding: 3px 7px; border-radius: 3px; white-space: nowrap; flex-shrink: 0;
  }
  .tcard .tc-pattern { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); }
  .tcard .tc-desc { font-size: 12.5px; color: var(--text-faint); line-height: 1.5; }
  .tcard .tc-evidence { font-size: 10.5px; color: var(--green); display: flex; align-items: center; gap: 5px; margin-top: auto; padding-top: 2px; }
  .tcard .tc-evidence.thin { color: var(--text-faint); }
  .tcard .tc-evidence.caution { color: var(--red); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

  /* ── Session log ───────────────────────── */
  .log-section { margin-top: 36px; padding-top: 22px; border-top: 1px solid var(--border); }
  .log-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .log-row .lr-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .log-row .lr-name { flex: 1; }
  .log-row .lr-time { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .log-empty { font-size: 13px; color: var(--text-faint); padding: 8px 0; }

  /* ── Session overlay (pacer) ───────────── */
  .session-overlay {
    position: fixed; inset: 0; background: var(--accent); z-index: 300;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    color: #EDE7D9; text-align: center; padding: 24px;
  }
  .session-overlay.active { display: flex; }
  .session-close {
    position: absolute; top: calc(var(--safe-top) + 18px); right: 22px; background: none; border: 1px solid rgba(237,231,217,0.3);
    color: rgba(237,231,217,0.7); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .session-close:hover { border-color: var(--gold); color: var(--gold); }
  .session-name { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
  .session-round { font-family: var(--font-mono); font-size: 11px; color: rgba(237,231,217,0.5); margin-bottom: 24px; min-height: 14px; }
  .pacer-wrap { width: 240px; height: 240px; max-width: 66vw; max-height: 66vw; display: flex; align-items: center; justify-content: center; position: relative; margin-bottom: 28px; }
  .pacer-ring { position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(185,154,108,0.35); }
  .pacer-shape {
    width: 110px; height: 110px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--gold-deep), #0d1526 75%);
    border: 1px solid var(--gold); transform: scale(0.72);
    transition: transform 4s cubic-bezier(0.45,0,0.55,1);
    box-shadow: 0 0 40px -6px rgba(185,154,108,0.4);
  }
  .phase-label { font-family: var(--font-display); font-size: 30px; font-weight: 600; color: #fff; margin-bottom: 6px; min-height: 40px; }
  .phase-sub { font-family: var(--font-mono); font-size: 13px; color: rgba(237,231,217,0.55); margin-bottom: 28px; min-height: 18px; }
  .session-controls { display: flex; gap: 12px; align-items: center; }
  .sbtn {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 10px 20px; border-radius: 4px; border: 1px solid rgba(237,231,217,0.3); background: transparent;
    color: rgba(237,231,217,0.8); cursor: pointer; transition: all 0.15s;
  }
  .sbtn:hover { border-color: var(--gold); color: var(--gold); }
  .sbtn.primary { background: var(--gold-deep); border-color: var(--gold-deep); color: #fff; }
  .sbtn.primary:hover { background: var(--gold); border-color: var(--gold); color: var(--accent); }
  .session-rating { display: none; flex-direction: column; align-items: center; }
  .session-rating.active { display: flex; }
  .session-done { display: none; flex-direction: column; align-items: center; }
  .session-done.active { display: flex; }
  .session-done .check-big { width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--green); color: var(--green); display: flex; align-items: center; justify-content: center; margin-bottom: 18px; font-size: 24px; }
  .wimhof-hold-timer { font-family: var(--font-mono); font-size: 44px; color: var(--gold); margin: 10px 0 22px; font-variant-numeric: tabular-nums; }
  .safety-note { font-size: 11.5px; color: rgba(217,122,87,0.9); max-width: 320px; margin-top: 20px; line-height: 1.5; }

  /* ── Rate picker (Resonance) ───────────── */
  .rate-picker { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; justify-content: center; }
  .rate-chip { font-family: var(--font-mono); font-size: 12px; padding: 7px 12px; border-radius: 4px; border: 1px solid rgba(237,231,217,0.3); background: transparent; color: rgba(237,231,217,0.75); cursor: pointer; }
  .rate-chip.selected { background: var(--gold-deep); border-color: var(--gold-deep); color: #fff; }

  /* ── Goals ─────────────────────────────── */
  .goals-group-label { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.09em; color: var(--gold-deep); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .goals-group-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .goal-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 6px; transition: border-color 0.15s, box-shadow 0.15s; box-shadow: 0 1px 2px rgba(22,35,61,0.06); }
  .goal-item:hover { border-color: var(--border-strong); box-shadow: 0 2px 6px rgba(22,35,61,0.08); }
  .goal-num { font-size: 13px; font-weight: 700; color: var(--gold); min-width: 20px; padding-top: 1px; flex-shrink: 0; }
  .goal-text { flex: 1; font-size: 14px; line-height: 1.5; }
  .goal-edit-btn { opacity: 0; transition: opacity 0.1s; flex-shrink: 0; }
  .goal-item:hover .goal-edit-btn { opacity: 1; }

  /* ── Rule of Life ──────────────────────── */
  .rule-category { margin-bottom: 20px; }
  .rule-category-header { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.09em; color: var(--gold-deep); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .rule-category-header::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .rule-item { display: flex; align-items: center; gap: 10px; padding: 9px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 5px; transition: border-color 0.15s, box-shadow 0.15s; box-shadow: 0 1px 2px rgba(22,35,61,0.06); }
  .rule-item:hover { border-color: var(--border-strong); box-shadow: 0 2px 6px rgba(22,35,61,0.08); }
  .rule-cadence { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; padding: 2px 6px; border-radius: 8px; background: var(--surface2); color: var(--text-faint); flex-shrink: 0; }
  .rule-cadence.daily    { background: #16233D; color: #ffffff; }
  .rule-cadence.weekly   { background: #3a6186; color: #ffffff; }
  .rule-cadence.monthly  { background: #B99A6C; color: #ffffff; }
  .rule-cadence.quarterly{ background: #d4bfa0; color: #3d2e1a; }
  .rule-cadence.annually { background: #e8ddd4; color: #4a3828; }
  .rule-text { flex: 1; font-size: 14px; line-height: 1.4; }
  .rule-edit-btn { opacity: 0; transition: opacity 0.1s; flex-shrink: 0; }
  .rule-item:hover .rule-edit-btn { opacity: 1; }

  /* ── Practice (dashboard) ──────────────── */
  .stat-row { display: flex; gap: 14px; margin-bottom: 30px; flex-wrap: wrap; }
  .stat-tile { flex: 1; min-width: 120px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
  .stat-tile .st-num { font-family: var(--font-display); font-size: 28px; font-weight: 600; color: var(--accent); }
  .stat-tile .st-label { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-faint); margin-top: 2px; }
  .heatmap { display: flex; gap: 2px; flex-wrap: wrap; }
  .hm-cell { width: 11px; height: 11px; border-radius: 2px; background: var(--surface2); }
  .hm-cell.done { background: var(--gold); opacity: 0.9; }
  .practice-legend { display: flex; gap: 16px; font-size: 11px; color: var(--text-faint); margin: 10px 0 32px; flex-wrap: wrap; }
  .practice-legend span { display: flex; align-items: center; gap: 6px; }
  .dash-category-block { margin-bottom: 28px; }
  .dash-category-header { font-family: var(--font-mono); font-size: 11.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.09em; color: var(--accent); margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
  .dash-category-avg { display: flex; align-items: center; }
  .dash-rule-row { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; margin-bottom: 8px; box-shadow: 0 1px 2px rgba(22,35,61,0.06); }
  .dash-rule-name { font-size: 13px; font-weight: 500; line-height: 1.4; }
  .dash-goal-block { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 14px; margin-bottom: 8px; box-shadow: 0 1px 2px rgba(22,35,61,0.06); }
  .dash-goal-text { font-size: 14px; font-weight: 500; color: var(--accent-text); margin-bottom: 8px; line-height: 1.4; }
  .dash-refl-entry { padding: 8px 0; border-top: 1px solid var(--border); }
  .dash-refl-text { font-size: 13px; color: var(--text-muted); line-height: 1.5; }
  .dash-refl-date { font-size: 11px; color: var(--text-faint); margin-top: 3px; }

  /* ── Reflection ────────────────────────── */
  .reflection-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; box-shadow: 0 1px 2px rgba(22,35,61,0.06); }
  .reflection-card:hover { border-color: var(--border-strong); box-shadow: 0 2px 6px rgba(22,35,61,0.08); }
  .reflection-card-date { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
  .energy-dots { display: flex; gap: 3px; align-items: center; }
  .energy-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--surface2); }
  .energy-dot.lit { background: var(--gold); }
  .reflection-card-excerpt { font-size: 13px; color: var(--text-muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .energy-selector { display: flex; gap: 8px; }
  .energy-btn { width: 40px; height: 36px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 600; color: var(--text-muted); transition: all 0.1s; }
  .energy-btn.selected { background: var(--gold); border-color: var(--gold); color: white; }

// ── Persist ──────────────────────────────────────────────────────────
let saveTimer = null;

async function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) mergeLoaded(JSON.parse(raw));
  } catch(e) {}
  render();

  try {
    const res = await fetch('/api/sync', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'load' })
    });
    const data = await res.json();
    if (data.state) {
      mergeLoaded(data.state);
      localStorage.setItem(STORE_KEY, JSON.stringify(serialize()));
      render();
    }
  } catch(e) {
    console.warn('Cloud load failed, using local data:', e);
  }
}

function serialize() { return { ...state }; }

const VALID_VIEWS = NAV_ITEMS.map(n => n.id);
function mergeLoaded(saved) {
  if (saved.breatheSessions !== undefined) state.breatheSessions = saved.breatheSessions;
  if (saved.meditateSessions !== undefined) state.meditateSessions = saved.meditateSessions;
  if (saved.goals !== undefined) state.goals = saved.goals;
  if (saved.ruleItems !== undefined) state.ruleItems = saved.ruleItems;
  if (saved.ruleChecks !== undefined) state.ruleChecks = saved.ruleChecks;
  if (saved.reflections !== undefined) state.reflections = saved.reflections;
  if (saved.prompts !== undefined) state.prompts = saved.prompts;
  if (saved.settings !== undefined) state.settings = saved.settings;
  if (saved.activeView && VALID_VIEWS.includes(saved.activeView)) state.activeView = saved.activeView;
  ensureTopLevel();
}

function ensureTopLevel() {
  if (!state.breatheSessions) state.breatheSessions = [];
  if (!state.meditateSessions) state.meditateSessions = [];
  if (!state.goals) state.goals = { personal: [], professional: [] };
  if (!state.goals.personal) state.goals.personal = [];
  if (!state.goals.professional) state.goals.professional = [];
  if (!state.ruleItems) state.ruleItems = [];
  if (!state.ruleChecks) state.ruleChecks = [];
  if (!state.reflections) state.reflections = [];
  if (!state.prompts || !state.prompts.length) state.prompts = DEFAULT_PROMPTS.map(p => ({...p}));
  if (!state.settings) state.settings = { ambientSound: 'none', haptics: true };
  if (state.settings.haptics === undefined) state.settings.haptics = true;
  if (!state.settings.ambientSound) state.settings.ambientSound = 'none';
}

function save() {
  const payload = serialize();
  localStorage.setItem(STORE_KEY, JSON.stringify(payload));
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      await fetch('/api/sync', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'save', state: payload })
      });
    } catch(e) { console.warn('Cloud save failed:', e); }
  }, 1500);
}

let current = null;
let phaseTimer = null;
let phaseTimer2 = null;

let wimhofRound = 1;
let wimhofHoldStart = 0;

function playBell() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = 528;
    osc.connect(gain); gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.18, t+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t+2.2);
    osc.start(t); osc.stop(t+2.2);
  } catch(e) {}
}

// ── Ambient sound bed (synthesized — no external assets) ──────────────
let ambientNodes = null;
function startAmbientSound(kind) {
  stopAmbientSound();
  if (!kind || kind === 'none') return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const master = audioCtx.createGain();
    master.gain.setValueAtTime(0, audioCtx.currentTime);
    master.gain.linearRampToValueAtTime(kind === 'drone' ? 0.05 : 0.035, audioCtx.currentTime + 1.5);
    master.connect(audioCtx.destination);
    const nodes = [master];

    if (kind === 'drone') {
      [110, 165, 220].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        osc.type = 'sine'; osc.frequency.value = freq;
        const g = audioCtx.createGain(); g.gain.value = i === 0 ? 1 : 0.35;
        osc.connect(g); g.connect(master); osc.start();
        nodes.push(osc);
      });
    } else if (kind === 'noise') {
      const bufferSize = 2 * audioCtx.sampleRate;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      let lastOut = 0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        lastOut = (lastOut + 0.02 * white) / 1.02;
        data[i] = lastOut * 3.5;
      }
      const src = audioCtx.createBufferSource();
      src.buffer = buffer; src.loop = true;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass'; filter.frequency.value = 900;
      src.connect(filter); filter.connect(master); src.start();
      nodes.push(src);
    }
    ambientNodes = nodes;
  } catch(e) {}
}
function stopAmbientSound() {
  if (!ambientNodes) return;
  const [master, ...sources] = ambientNodes;
  try {
    const t = audioCtx.currentTime;
    master.gain.linearRampToValueAtTime(0, t + 0.6);
    setTimeout(() => sources.forEach(n => { try { n.stop(); } catch(e){} }), 700);
  } catch(e) {}
  ambientNodes = null;
}

function startPhaseSession() {
  sessionStartTime = Date.now();
  document.getElementById('session-controls').innerHTML = '<button class="sbtn" onclick="endSession()">Stop</button>';
  document.getElementById('rate-picker-block').style.display = 'none';
  document.getElementById('duration-picker-block').style.display = 'none';
  document.getElementById('sound-picker-block').style.display = 'none';
  startAmbientSound(state.settings.ambientSound);
  if (current.def.special === 'wimhof') { runWimHofRound(); return; }
  if (current.kind === 'meditate') { runMeditateSession(); return; }
  const phases = current.def.adjustable
    ? [{label:'Inhale',secs:30/resonanceRate},{label:'Exhale',secs:30/resonanceRate}]
    : current.def.phases;
  runBreathPhase(0, phases);
}

function runBreathPhase(i, phases) {
  if (i >= phases.length) { cycleCount++; if (cycleCount >= current.def.cycles) { finishSession(); return; } i = 0; }
  const phase = phases[i];
  const shape = document.getElementById('pacer-shape');
  document.getElementById('phase-label').textContent = phase.label;
  document.getElementById('phase-sub').textContent = `cycle ${cycleCount+1} of ${current.def.cycles}`;
  shape.style.transition = `transform ${phase.secs}s cubic-bezier(0.45,0,0.55,1)`;
  tapHaptic(20);
  const l = phase.label.toLowerCase();
  if (l.includes('inhale')) shape.style.transform = 'scale(2.15)';
  else if (l.includes('exhale')) shape.style.transform = 'scale(0.5)';
  phaseTimer = setTimeout(() => runBreathPhase(i+1, phases), phase.secs*1000);
}

function runWimHofRound() {
  document.getElementById('s-round').textContent = `Round ${wimhofRound} of ${current.def.rounds}`;
  let breath = 0;
  const shape = document.getElementById('pacer-shape');
  document.getElementById('phase-sub').textContent = '';
  function powerBreath() {
    breath++;
    if (breath > 30) { startWimHofHold(); return; }
    document.getElementById('phase-label').textContent = 'Breath ' + breath;
    shape.style.transition = 'transform 1.2s ease-in-out';
    shape.style.transform = 'scale(1.9)';
    tapHaptic(15);
    phaseTimer = setTimeout(() => {
      shape.style.transform = 'scale(0.5)';
      phaseTimer = setTimeout(powerBreath, 1200);
    }, 1200);
  }
  document.getElementById('phase-label').textContent = '30 power breaths';
  phaseTimer = setTimeout(powerBreath, 900);
}
function startWimHofHold() {
  document.getElementById('pacer-block').style.display = 'none';
  document.getElementById('wimhof-hold-block').style.display = 'block';
  document.getElementById('phase-label').textContent = '';
  wimhofHoldStart = Date.now();
  document.getElementById('session-controls').innerHTML = '<button class="sbtn primary" onclick="endWimHofHold()">I need to breathe</button>';
  wimhofHoldInterval = setInterval(() => {
    const s = Math.floor((Date.now()-wimhofHoldStart)/1000);
    document.getElementById('wimhof-timer').textContent = Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  }, 200);
}
function endWimHofHold() {
  clearInterval(wimhofHoldInterval);
  document.getElementById('wimhof-hold-block').style.display = 'none';
  document.getElementById('pacer-block').style.display = '';
  document.getElementById('phase-label').textContent = 'Recovery inhale — hold';
  const shape = document.getElementById('pacer-shape');
  shape.style.transition = 'transform 2s ease-in-out'; shape.style.transform = 'scale(2.15)';
  document.getElementById('session-controls').innerHTML = '';
  let s = 15;
  document.getElementById('phase-sub').textContent = s + 's';
  const iv = setInterval(() => {
    s--; document.getElementById('phase-sub').textContent = s + 's';
    if (s<=0) {
      clearInterval(iv);
      shape.style.transition = 'transform 1s ease-in-out'; shape.style.transform = 'scale(0.72)';
      if (wimhofRound >= current.def.rounds) { finishSession(); }
      else { wimhofRound++; setTimeout(runWimHofRound, 1200); }
    }
  }, 1000);
}

function runMeditateSession() {
  playBell();
  const def = current.def;
  const totalSecs = (sessionMinutes || def.minutes) * 60;
  const shape = document.getElementById('pacer-shape');
  shape.style.transition = 'transform 4s ease-in-out';

  if (def.mode === 'stages') {
    const per = totalSecs / def.stages.length;
    let i = 0;
    function stage() {
      if (i >= def.stages.length) { finishSession(); return; }
      document.getElementById('phase-label').textContent = def.stages[i];
      document.getElementById('phase-sub').textContent = `stage ${i+1} of ${def.stages.length}`;
      shape.style.transform = shape.style.transform === 'scale(1.05)' ? 'scale(0.85)' : 'scale(1.05)';
      tapHaptic(15);
      i++;
      phaseTimer = setTimeout(stage, per*1000);
    }
    stage();
  } else {
    document.getElementById('phase-label').textContent = def.mode==='count' ? '1' : '';
    document.getElementById('phase-sub').textContent = def.mode==='count' ? 'breathing, counted' : 'sit';
    let count = 1;
    const breathLen = 5;
    function pulse() {
      shape.style.transform = shape.style.transform === 'scale(1.05)' ? 'scale(0.85)' : 'scale(1.05)';
      if (def.mode === 'count') { document.getElementById('phase-label').textContent = String(count); count = count>=10?1:count+1; }
      phaseTimer = setTimeout(pulse, breathLen*1000);
    }
    pulse();
    phaseTimer2 = setTimeout(finishSession, totalSecs*1000);
  }
}

let pendingElapsed = 0;
function finishSession() {
  clearTimeout(phaseTimer); clearTimeout(phaseTimer2); clearInterval(wimhofHoldInterval);
  stopAmbientSound();
  playBell();
  tapHaptic(40);
  pendingElapsed = Math.round((Date.now()-sessionStartTime)/1000);

function logSession(rating) {
  const entry = { id: uid(), name: current.def.name, patternId: current.id, startedAt: sessionStartTime, durationSec: pendingElapsed||60, feltRating: rating||null };

function checkActivityStreak() {
  const activityDates = new Set([
    ...state.breatheSessions.map(s=>new Date(s.startedAt).toISOString().slice(0,10)),
    ...state.meditateSessions.map(s=>new Date(s.startedAt).toISOString().slice(0,10)),
    ...state.reflections.map(r=>r.date),
    ...(state.ruleChecks||[]).filter(c=>c.completed).map(c=>c.date),
  ]);
  let streak = 0;
  const d = new Date(TODAY+'T00:00:00');
  while (activityDates.has(d.toISOString().slice(0,10))) { streak++; d.setDate(d.getDate()-1); }
  maybeCelebrateStreak(streak);
}

function endSession() {
  clearTimeout(phaseTimer); clearTimeout(phaseTimer2); clearInterval(wimhofHoldInterval);
  stopAmbientSound();
  document.getElementById('session-overlay').classList.remove('active');
  document.getElementById('session-rating').classList.remove('active');
  document.getElementById('pacer-block').style.display = '';
  document.getElementById('wimhof-hold-block').style.display = 'none';
  current = null;
}

// ── Rule of Life helpers ──────────────────────────────────────────────
function getWeekMonday(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDay();
  d.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
  return d.toISOString().slice(0, 10);
}

function getRulePeriodLabel(cadence) {
  const MONTHS = MONTH_ABBR;
  const DAYS = DAY_ABBR;
  const today = new Date(TODAY + 'T00:00:00');
  if (cadence === 'daily') return `${DAYS[today.getDay()]} ${MONTHS[today.getMonth()]} ${today.getDate()}`;
  if (cadence === 'weekly') {
    const mon = new Date(getWeekMonday(TODAY) + 'T00:00:00');
    const sat = new Date(mon); sat.setDate(mon.getDate() + 5);
    const fmt = d => `${MONTHS[d.getMonth()]} ${d.getDate()}`;
    return `${fmt(mon)} – ${fmt(sat)}`;
  }
  if (cadence === 'monthly') return `${MONTHS[today.getMonth()]} ${today.getFullYear()}`;
  if (cadence === 'quarterly') {
    const q = Math.floor(today.getMonth() / 3);
    const qStart = new Date(today.getFullYear(), q * 3, 1);
    const qEnd = new Date(today.getFullYear(), q * 3 + 3, 0);
    return `${MONTHS[qStart.getMonth()]} – ${MONTHS[qEnd.getMonth()]}`;
  }
  if (cadence === 'annually') return String(today.getFullYear());
  return '';
}

function getQuarterStart(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const qs = new Date(d.getFullYear(), Math.floor(d.getMonth() / 3) * 3, 1);
  return qs.toISOString().slice(0, 10);
}

function isRuleChecked(ruleId, cadence) {
  const checks = state.ruleChecks || [];
  const relevant = checks.filter(c => {
    if (c.ruleId !== ruleId) return false;
    if (cadence === 'daily') return c.date === TODAY;
    if (cadence === 'weekly') { const mon = getWeekMonday(TODAY); return c.date >= mon && c.date <= TODAY; }
    if (cadence === 'monthly') return c.date.startsWith(TODAY.slice(0, 7));
    if (cadence === 'quarterly') return c.date >= getQuarterStart(TODAY) && c.date <= TODAY;
    if (cadence === 'annually') return c.date.startsWith(TODAY.slice(0, 4));
    return false;
  });
  if (!relevant.length) return false;
  relevant.sort((a, b) => b.date.localeCompare(a.date));
  return relevant[0].completed !== false;
}

function toggleRuleCheck(ruleId) {

  if (!state.ruleChecks) state.ruleChecks = [];
  const nowChecked = !isRuleChecked(ruleId, rule.cadence);
  state.ruleChecks.push({ ruleId, date: TODAY, completed: nowChecked });
  save();
  if (nowChecked) checkActivityStreak();
  renderRuleOfLifeView();
}

// ── Practice/Dashboard helpers ────────────────────────────────────────
function getDashWindowStart() {
  if (dashWindow === 'year') {
    const yearStart = new Date().getFullYear() + '-01-01';
    return yearStart < FEATURE_START_DATE ? FEATURE_START_DATE : yearStart;
  }
  const d = new Date(TODAY + 'T00:00:00');
  d.setDate(d.getDate() - dashWindow + 1);
  return d.toISOString().slice(0, 10);
}

function getRuleStats(ruleId, cadence) {
  const windowStart = getDashWindowStart();
  const allChecked = (state.ruleChecks || []).filter(c => c.ruleId === ruleId && c.completed && c.date >= windowStart && c.date <= TODAY);
  let applicable = 0, completed = 0;

  if (cadence === 'daily') {
    const set = new Set(allChecked.map(c => c.date));
    const d = new Date(windowStart + 'T00:00:00'), end = new Date(TODAY + 'T00:00:00');
    while (d <= end) { applicable++; if (set.has(d.toISOString().slice(0,10))) completed++; d.setDate(d.getDate()+1); }
  } else if (cadence === 'weekly') {
    let mon = new Date(getWeekMonday(windowStart) + 'T00:00:00');
    const end = new Date(TODAY + 'T00:00:00');
    while (mon <= end) {
      const sat = new Date(mon); sat.setDate(mon.getDate()+6);
      const monS = mon.toISOString().slice(0,10), satS = sat.toISOString().slice(0,10);
      if (satS >= windowStart) { applicable++; if (allChecked.some(c => c.date >= monS && c.date <= satS)) completed++; }
      mon.setDate(mon.getDate()+7);
    }
  } else if (cadence === 'monthly') {
    const d = new Date(windowStart.slice(0,7)+'-01T00:00:00'), end = new Date(TODAY.slice(0,7)+'-01T00:00:00');
    while (d <= end) { const m = d.toISOString().slice(0,7); applicable++; if (allChecked.some(c=>c.date.startsWith(m))) completed++; d.setMonth(d.getMonth()+1); }
  } else if (cadence === 'quarterly') {
    let d = new Date(getQuarterStart(windowStart)+'T00:00:00');
    const end = new Date(TODAY+'T00:00:00');
    while (d <= end) {
      const qStart = d.toISOString().slice(0,10);
      const qEnd = new Date(d); qEnd.setMonth(qEnd.getMonth()+3); qEnd.setDate(qEnd.getDate()-1);
      const qEndStr = qEnd.toISOString().slice(0,10);
      if (qEndStr >= windowStart) { applicable++; if (allChecked.some(c=>c.date>=qStart&&c.date<=qEndStr)) completed++; }
      d.setMonth(d.getMonth()+3);
    }
  } else if (cadence === 'annually') {
    const sy = parseInt(windowStart.slice(0,4)), ey = parseInt(TODAY.slice(0,4));
    for (let y = sy; y <= ey; y++) { applicable++; if (allChecked.some(c=>c.date.startsWith(String(y)))) completed++; }
  }

  return { pct: applicable>0?Math.round(completed/applicable*100):0, completed, applicable, currentStreak: calcCurrentStreak(ruleId, cadence), longestStreak: calcLongestStreak(ruleId, cadence) };
}

function calcCurrentStreak(ruleId, cadence) {
  const allChecked = (state.ruleChecks||[]).filter(c=>c.ruleId===ruleId&&c.completed);
  if (!allChecked.length) return 0;
  let streak = 0;
  if (cadence === 'daily') {
    const set = new Set(allChecked.map(c=>c.date));
    const d = new Date(TODAY+'T00:00:00');
    while (set.has(d.toISOString().slice(0,10))) { streak++; d.setDate(d.getDate()-1); }
  } else if (cadence === 'weekly') {
    let mon = new Date(getWeekMonday(TODAY)+'T00:00:00');
    while (true) {
      const sat = new Date(mon); sat.setDate(mon.getDate()+6);
      if (!allChecked.some(c=>c.date>=mon.toISOString().slice(0,10)&&c.date<=sat.toISOString().slice(0,10))) break;
      streak++; mon.setDate(mon.getDate()-7);
    }
  } else if (cadence === 'monthly') {
    let d = new Date(TODAY.slice(0,7)+'-01T00:00:00');
    while (allChecked.some(c=>c.date.startsWith(d.toISOString().slice(0,7)))) { streak++; d.setMonth(d.getMonth()-1); }
  } else if (cadence === 'quarterly') {
    let d = new Date(getQuarterStart(TODAY)+'T00:00:00');
    while (true) {
      const qStart = d.toISOString().slice(0,10);
      const qEnd = new Date(d); qEnd.setMonth(qEnd.getMonth()+3); qEnd.setDate(qEnd.getDate()-1);
      if (!allChecked.some(c=>c.date>=qStart&&c.date<=qEnd.toISOString().slice(0,10))) break;
      streak++; d.setMonth(d.getMonth()-3);
    }
  } else if (cadence === 'annually') {
    let y = parseInt(TODAY.slice(0,4));
    while (allChecked.some(c=>c.date.startsWith(String(y)))) { streak++; y--; }
  }
  return streak;
}

function calcLongestStreak(ruleId, cadence) {
  const allChecked = (state.ruleChecks||[]).filter(c=>c.ruleId===ruleId&&c.completed);
  if (!allChecked.length) return 0;
  if (cadence !== 'daily') return calcCurrentStreak(ruleId, cadence);
  const dates = [...new Set(allChecked.map(c=>c.date))].sort();
  let best=0, cur=0, prev=null;
  for (const d of dates) {
    if (prev) { const p=new Date(prev+'T00:00:00'); p.setDate(p.getDate()+1); cur=p.toISOString().slice(0,10)===d?cur+1:1; }
    else cur=1;
    if (cur>best) best=cur;
    prev=d;
  }
  return best;
}

function getTodayPrompt() {
  const prompts = state.prompts || [];
  if (!prompts.length) return null;
  const epoch = new Date('2026-01-01T00:00:00');
  const days = Math.floor((new Date(TODAY+'T00:00:00') - epoch) / 86400000);
  return prompts[((days % prompts.length) + prompts.length) % prompts.length];
}

function renderRingHtml(pct, size) {
  size = size || 72;
  const sw = 7, r = (size - sw) / 2;
  const circ = +(2 * Math.PI * r).toFixed(1);
  const offset = +((1 - Math.min(pct, 100) / 100) * circ).toFixed(1);
  const c = size / 2;
  const fs = size >= 80 ? 18 : 14;
  return `<div style="position:relative;width:${size}px;height:${size}px;flex-shrink:0">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
      <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#E1D8C2" stroke-width="${sw}"/>
      <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#16233D" stroke-width="${sw}"
        stroke-dasharray="${circ}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
    </svg>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:${fs}px;color:var(--accent);line-height:1">${pct}%</div>
  </div>`;
}

function renderBestFit(breatheSessions, meditateSessions) {
  function topPick(sessions, lib) {
    const byPattern = {};
    sessions.forEach(s => { if (s.feltRating) (byPattern[s.patternId] = byPattern[s.patternId]||[]).push(s.feltRating); });
    let best = null;
    Object.entries(byPattern).forEach(([id, ratings]) => {
      if (ratings.length < 2) return;
      const avg = ratings.reduce((a,b)=>a+b,0)/ratings.length;
      if (!best || avg > best.avg) best = { id, avg: +avg.toFixed(1), count: ratings.length };
    });
    if (!best) return null;
    const def = lib.find(x=>x.id===best.id);
    return def ? { name: def.name, avg: best.avg, count: best.count } : null;
  }
  const breatheBest = topPick(breatheSessions, BREATH_PATTERNS);
  const meditateBest = topPick(meditateSessions, MEDITATE_STYLES);
  if (!breatheBest && !meditateBest) return '';
  return `<div style="margin:8px 0 32px">
    <div class="goals-group-label">Best fit so far</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      ${breatheBest?`<div class="stat-tile" style="flex:1;min-width:180px"><div style="font-size:13px;font-weight:600;color:var(--accent);margin-bottom:4px">${esc(breatheBest.name)}</div><div class="st-label" style="margin-top:0">BREATHE · AVG ${breatheBest.avg}/5 OVER ${breatheBest.count} SESSIONS</div></div>`:''}
      ${meditateBest?`<div class="stat-tile" style="flex:1;min-width:180px"><div style="font-size:13px;font-weight:600;color:var(--accent);margin-bottom:4px">${esc(meditateBest.name)}</div><div class="st-label" style="margin-top:0">MEDITATE · AVG ${meditateBest.avg}/5 OVER ${meditateBest.count} SESSIONS</div></div>`:''}
    </div>
  </div>`;
}

function toggleHaptics() {
  state.settings.haptics = document.getElementById('haptics-toggle').checked;
  save();
  if (state.settings.haptics) tapHaptic(30);
}

async function checkBackup() {
  const el = document.getElementById('backup-status');
  el.textContent = 'Checking…';
  try {
    const res = await fetch('/api/sync', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ action: 'peek_backup' })
    });
    const d = await res.json();
    const b = d.backup;
    const m = d.main;
    const mainSummary = m
      ? `Current: ${m.ruleItemsCount} rule items, ${m.reflectionsCount} reflections, ${m.goalsPersonal + m.goalsProfessional} goals`
      : 'Current: empty';
    if (!b) {
      el.innerHTML = `${mainSummary}<br><span style="color:var(--text-faint)">No backup found in cloud storage.</span>`;
    } else {
      const backupSummary = `Backup: ${b.ruleItemsCount} rule items, ${b.reflectionsCount} reflections, ${b.goalsPersonal + b.goalsProfessional} goals, ${b.ruleChecksCount} check-ins`;
      el.innerHTML = `${mainSummary}<br><span style="color:${b.ruleItemsCount > 0 || b.reflectionsCount > 0 ? '#16233D' : 'var(--text-faint)'}">${backupSummary}</span>`;
      if (b.ruleItemsCount > 0 || b.reflectionsCount > 0 || b.goalsPersonal > 0) {
        document.getElementById('restore-btn').style.display = '';
      }
    }
  } catch(e) {
    el.textContent = 'Error checking backup: ' + e.message;
  }
}

async function restoreBackup() {
  if (!confirm('Restore the backup? This will replace your current cloud data with the backup. Your current state will be saved as a pre-restore backup.')) return;
  const el = document.getElementById('backup-status');
  el.textContent = 'Restoring…';
  try {
    const res = await fetch('/api/sync', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ action: 'restore_backup' })
    });
    const d = await res.json();
    if (d.ok) {
      el.textContent = 'Restored! Reloading data…';
      document.getElementById('restore-btn').style.display = 'none';
      await load();
    } else {
      el.textContent = 'Restore failed: ' + (d.error || 'unknown error');
    }
  } catch(e) {
    el.textContent = 'Error restoring: ' + e.message;
  }
}

// ── Goal CRUD ─────────────────────────────────────────────────────────
function openNewGoalModal(group) {
  editingGoalId = null; editingGoalGroup = group||'personal';
  document.getElementById('goal-modal-title').textContent = 'New goal';
  document.getElementById('gm-group').value = editingGoalGroup;
  document.getElementById('gm-text').value = '';
  document.getElementById('gm-delete-btn').style.display = 'none';
  document.getElementById('goal-modal').style.display = 'flex';
  document.getElementById('gm-text').focus();
}

function openEditGoalModal(group, id) {
  editingGoalId = id; editingGoalGroup = group;
  const g = (state.goals[group]||[]).find(x=>x.id===id); if (!g) return;
  document.getElementById('goal-modal-title').textContent = 'Edit goal';
  document.getElementById('gm-group').value = group;
  document.getElementById('gm-text').value = g.text;
  document.getElementById('gm-delete-btn').style.display = 'block';
  document.getElementById('goal-modal').style.display = 'flex';
  document.getElementById('gm-text').focus();
}

function closeGoalModal() { document.getElementById('goal-modal').style.display = 'none'; }

function saveGoal() {
  const text = document.getElementById('gm-text').value.trim(); if (!text) return;
  const group = document.getElementById('gm-group').value;
  if (!state.goals) state.goals = {personal:[],professional:[]};
  if (!state.goals[group]) state.goals[group] = [];
  if (editingGoalId) {
    if (group !== editingGoalGroup) {
      state.goals[editingGoalGroup] = (state.goals[editingGoalGroup]||[]).filter(g=>g.id!==editingGoalId);
      state.goals[group].push({id:editingGoalId, text});
    } else {
      const g = state.goals[group].find(x=>x.id===editingGoalId);
      if (g) g.text = text;
    }
  } else {
    state.goals[group].push({id:uid(), text});
  }
  closeGoalModal(); save(); renderGoalsView();
}

function deleteGoalFromModal() {
  if (!confirm('Delete this goal?')) return;
  state.goals[editingGoalGroup] = (state.goals[editingGoalGroup]||[]).filter(g=>g.id!==editingGoalId);
  closeGoalModal(); save(); renderGoalsView();
}

// ── Rule CRUD ─────────────────────────────────────────────────────────
function openNewRuleModal() {
  editingRuleId = null;
  document.getElementById('rule-modal-title').textContent = 'New commitment';
  document.getElementById('rm-text').value = '';
  document.getElementById('rm-category').value = '';
  document.getElementById('rm-cadence').value = 'daily';
  document.getElementById('rm-period').value = '';
  document.getElementById('rm-delete-btn').style.display = 'none';
  document.getElementById('rule-modal').style.display = 'flex';
  document.getElementById('rm-text').focus();
}

function openEditRuleModal(id) {
  editingRuleId = id;
  const r = (state.ruleItems||[]).find(x=>x.id===id); if (!r) return;
  document.getElementById('rule-modal-title').textContent = 'Edit commitment';
  document.getElementById('rm-text').value = r.text;
  document.getElementById('rm-category').value = r.category||'';
  document.getElementById('rm-cadence').value = r.cadence;
  document.getElementById('rm-period').value = r.customPeriod||'';
  document.getElementById('rm-delete-btn').style.display = 'block';
  document.getElementById('rule-modal').style.display = 'flex';
  document.getElementById('rm-text').focus();
}

function closeRuleModal() { document.getElementById('rule-modal').style.display = 'none'; }

function saveRule() {
  const text = document.getElementById('rm-text').value.trim(); if (!text) return;
  const category = document.getElementById('rm-category').value.trim();
  const cadence = document.getElementById('rm-cadence').value;
  const customPeriod = document.getElementById('rm-period').value.trim() || null;
  if (!state.ruleItems) state.ruleItems = [];
  if (editingRuleId) {
    const r = state.ruleItems.find(x=>x.id===editingRuleId);
    if (r) { r.text=text; r.category=category; r.cadence=cadence; r.customPeriod=customPeriod; }
  } else {
    state.ruleItems.push({id:uid(), category, cadence, text, customPeriod});
  }
  closeRuleModal(); save(); renderRuleOfLifeView();
}

function deleteRuleFromModal() {
  if (!confirm('Delete this commitment? All history will also be removed.')) return;
  state.ruleItems = (state.ruleItems||[]).filter(r=>r.id!==editingRuleId);
  state.ruleChecks = (state.ruleChecks||[]).filter(c=>c.ruleId!==editingRuleId);
  closeRuleModal(); save(); renderRuleOfLifeView();
}

// ── Reflection CRUD ───────────────────────────────────────────────────
function pickEnergy(val) {
  pickedEnergy = val;
  document.querySelectorAll('.energy-btn').forEach((b,i)=>b.classList.toggle('selected',i+1===val));
}

function openNewReflectionModal(date) {
  editingReflectionId = null; pickedEnergy = 0;
  const d = date||TODAY;
  document.getElementById('rfm-title').textContent = d===TODAY?"Today's reflection":'New reflection';
  document.getElementById('rfm-date').value = d;
  document.getElementById('rfm-went-well').value = '';
  document.getElementById('rfm-tomorrow').value = '';
  document.getElementById('rfm-free').value = '';
  document.getElementById('rfm-delete-btn').style.display = 'none';
  document.querySelectorAll('.energy-btn').forEach(b=>b.classList.remove('selected'));
  const prompt = d===TODAY ? getTodayPrompt() : null;
  const banner = document.getElementById('rfm-prompt-banner');
  if (prompt) {
    banner.style.display = 'block';
    banner.innerHTML = `<div class="prompt-banner"><div class="prompt-banner-label">Today's prompt</div><div class="prompt-banner-text">${esc(prompt.text)}</div></div>`;
  } else { banner.style.display = 'none'; }
  document.getElementById('reflection-modal').style.display = 'flex';
  document.getElementById('rfm-went-well').focus();
}

function openEditReflectionModal(id) {
  editingReflectionId = id;
  const r = (state.reflections||[]).find(x=>x.id===id); if (!r) return;
  pickedEnergy = r.energy||0;
  document.getElementById('rfm-title').textContent = 'Edit reflection';
  document.getElementById('rfm-date').value = r.date;
  document.getElementById('rfm-went-well').value = r.wentWell||'';
  document.getElementById('rfm-tomorrow').value = r.tomorrow||'';
  document.getElementById('rfm-free').value = r.freeText||'';
  document.getElementById('rfm-delete-btn').style.display = 'block';
  document.querySelectorAll('.energy-btn').forEach((b,i)=>b.classList.toggle('selected',i+1===pickedEnergy));
  document.getElementById('rfm-prompt-banner').style.display = 'none';
  document.getElementById('reflection-modal').style.display = 'flex';
}

function closeReflectionModal() { document.getElementById('reflection-modal').style.display = 'none'; }

function saveReflection() {
  const date = document.getElementById('rfm-date').value; if (!date) return;
  const wentWell = document.getElementById('rfm-went-well').value.trim();
  const tomorrow = document.getElementById('rfm-tomorrow').value.trim();
  const freeText = document.getElementById('rfm-free').value.trim();
  if (!wentWell&&!tomorrow&&!freeText&&!pickedEnergy) return;
  if (!state.reflections) state.reflections = [];
  if (editingReflectionId) {
    const idx = state.reflections.findIndex(r=>r.id===editingReflectionId);
    if (idx>=0) state.reflections[idx] = {...state.reflections[idx], date, energy:pickedEnergy||null, wentWell, tomorrow, freeText};
  } else {
    const prompt = date===TODAY ? getTodayPrompt() : null;
    state.reflections.push({id:uid(), date, energy:pickedEnergy||null, wentWell, tomorrow, freeText, goalId:prompt?.goalId||null});
  }
  closeReflectionModal(); save(); checkActivityStreak(); renderReflectionView();
}

function deleteReflectionFromModal() {
  if (!confirm('Delete this reflection?')) return;
  state.reflections = (state.reflections||[]).filter(r=>r.id!==editingReflectionId);
  closeReflectionModal(); save(); renderReflectionView();
}

// ── Prompt CRUD ───────────────────────────────────────────────────────
function openNewPromptModal() {
  editingPromptId = null;
  document.getElementById('pm-title').textContent = 'New prompt';
  document.getElementById('pm-text').value = '';
  document.getElementById('pm-delete-btn').style.display = 'none';
  populatePromptGoalSelect(null);
  document.getElementById('prompt-modal').style.display = 'flex';
  document.getElementById('pm-text').focus();
}

function openEditPromptModal(id) {
  editingPromptId = id;
  const p = (state.prompts||[]).find(x=>x.id===id); if (!p) return;
  document.getElementById('pm-title').textContent = 'Edit prompt';
  document.getElementById('pm-text').value = p.text;
  document.getElementById('pm-delete-btn').style.display = 'block';
  populatePromptGoalSelect(p.goalId);
  document.getElementById('prompt-modal').style.display = 'flex';
  document.getElementById('pm-text').focus();
}

function populatePromptGoalSelect(selectedId) {
  const g = state.goals||{};
  const all = [...(g.personal||[]).map(x=>({id:x.id,label:'Personal: '+x.text.slice(0,50)})),...(g.professional||[]).map(x=>({id:x.id,label:'Professional: '+x.text.slice(0,50)}))];
  document.getElementById('pm-goal').innerHTML = `<option value="">None</option>`+all.map(x=>`<option value="${x.id}"${selectedId===x.id?' selected':''}>${esc(x.label)}</option>`).join('');
}

function closePromptModal() { document.getElementById('prompt-modal').style.display = 'none'; }

function savePrompt() {
  const text = document.getElementById('pm-text').value.trim(); if (!text) return;
  const goalId = document.getElementById('pm-goal').value||null;
  if (!state.prompts) state.prompts = [];
  if (editingPromptId) {
    const p = state.prompts.find(x=>x.id===editingPromptId);
    if (p) { p.text=text; p.goalId=goalId; }
  } else {
    state.prompts.push({id:uid(), text, goalId});
  }
  closePromptModal(); save(); renderReflectionView();
}

function deletePromptFromModal() {
  if (!confirm('Delete this prompt?')) return;
  state.prompts = (state.prompts||[]).filter(p=>p.id!==editingPromptId);
  closePromptModal(); save(); renderReflectionView();
}

// ── Keyboard shortcuts ───────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.getElementById('session-overlay').classList.contains('active') ? endSession() : null;
    closeGoalModal(); closeRuleModal(); closeReflectionModal(); closePromptModal();
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
    e.preventDefault();
    if (document.getElementById('goal-modal').style.display !== 'none') { saveGoal(); return; }
    if (document.getElementById('rule-modal').style.display !== 'none') { saveRule(); return; }
    if (document.getElementById('reflection-modal').style.display !== 'none') { saveReflection(); return; }
    if (document.getElementById('prompt-modal').style.display !== 'none') { savePrompt(); return; }
  }
});

// Scroll focused input above keyboard on iOS PWA
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => {
    const el = document.activeElement;
    if (el && (el.tagName === 'INPUT' || el.tagName === 'SELECT' || el.tagName === 'TEXTAREA')) {
      setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 50);
    }
  });
}

load();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').then(reg => {
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState !== 'visible') return;
        reg.update();
        const modalOpen = [...document.querySelectorAll('.modal')].some(m => m.style.display === 'flex');
        const sessionOpen = document.getElementById('session-overlay').classList.contains('active');
        if (!modalOpen && !sessionOpen) load();
      });
    }).catch(err => {
      console.warn('SW registration failed:', err);
    });

    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
  });
}
</script>
