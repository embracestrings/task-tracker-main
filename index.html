<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Task Tracker</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#16233D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracker">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* Manuscript palette — deepened brand: ink, paper, brass */
    --accent: #16233D;        /* Ink — primary (was Deep Blue #16335B) */
    --accent-light: #E9E3D3;  /* Warm paper tint for active backgrounds */
    --accent-text: #0d1526;   /* Darker ink */
    --gold: #B99A6C;          /* Brass — secondary accent */
    --gold-light: #D2B78F;    /* Brass lighter */
    --gold-deep: #8C6F45;     /* Brass ink — text on light-brass backgrounds */
    --gold-bg: #F5EFE0;       /* Light brass for badge backgrounds */
    --card-border: rgba(185,154,108,0.32); /* Brass hairline for cards */

    /* Surface & text — warm manuscript paper, not flat cream */
    --bg: #EFEAE0;
    --surface: #FBF9F3;
    --surface2: #F4EFE3;
    --border: #E1D8C2;
    --border-strong: #CBBFA0;
    --text: #1c1b18;
    --text-muted: #6b6459;
    --text-faint: #83796a;    /* darkened for WCAG AA on paper bg */

    /* Status colors */
    --red: #9C4A2E; --red-bg: #f5e7e1;
    --amber: #a8690f; --amber-bg: #f7edda;
    --green: #4B7859; --green-bg: #e9f1ec;
    --blue: #385f87; --blue-bg: #e9eff5;
    --purple: #5f4f85; --purple-bg: #eeecf3;

    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-body: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;

    --sidebar-w: 220px;
    --header-h: 56px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  html { background: #EFEAE0; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    background: var(--bg); color: var(--text);
    height: 100vh;
    height: calc(100dvh + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column;
    overflow: hidden; font-size: 14px;
  }

  /* ── Layout ─────────────────────────────── */
  .app { display: flex; flex: 1; overflow: hidden; }
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* ── Header ─────────────────────────────── */
  header {
    background: var(--accent);
    padding: calc(var(--safe-top) + 10px) 20px 10px;
    min-height: calc(var(--header-h) + var(--safe-top));
    display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    box-shadow: 0 2px 12px rgba(0,0,0,0.22);
    position: relative; z-index: 10;
  }
  .app-name {
    font-family: var(--font-display);
    font-size: 17px; font-weight: 600; letter-spacing: 0.01em;
    color: white;
  }
  .app-name span { color: var(--gold); }
  header .spacer { flex: 1; }
  .header-search {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px; padding: 5px 10px; width: 200px; transition: all 0.15s;
  }
  .header-search:focus-within { background: rgba(255,255,255,0.22); border-color: var(--gold); }
  .header-search input { border: none; outline: none; background: transparent; font-size: 13px; color: white; width: 100%; }
  .header-search input::placeholder { color: rgba(255,255,255,0.45); }

  /* ── Sidebar ─────────────────────────────── */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--accent);
    background-image: repeating-linear-gradient(180deg, rgba(255,255,255,0.028) 0px, rgba(255,255,255,0.028) 1px, transparent 1px, transparent 27px);
    display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden;
  }

  /* Zone 2 — scrollable middle */
  .sidebar-scroll { flex: 1; overflow-y: auto; }

  /* Zone 3 — pinned Reflect section */
  .sidebar-bottom { flex-shrink: 0; border-top: 1px solid rgba(255,255,255,0.14); background: rgba(0,0,0,0.14); }
  .sidebar-bottom .sidebar-section { border-top: none; padding-bottom: 8px; }
  .sidebar-bottom .sidebar-section-label { color: var(--gold); }

  /* Zone 1 — collapsed workspace header */
  .ws-header {
    display: flex; align-items: center; gap: 9px; padding: 11px 14px;
    cursor: pointer; user-select: none;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    background: rgba(0,0,0,0.1);
    flex-shrink: 0;
  }
  .ws-header:hover { background: rgba(255,255,255,0.06); }
  .ws-header-name { font-size: 13px; font-weight: 600; color: white; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ws-header-chev { color: rgba(255,255,255,0.5); flex-shrink: 0; display: flex; align-items: center; }
  .ws-dropdown { background: rgba(0,0,0,0.12); border-bottom: 1px solid rgba(255,255,255,0.09); }

  /* Workspace switcher items */
  .workspace-item-wrap { display: flex; align-items: center; position: relative; }
  .workspace-item {
    display: flex; align-items: center; gap: 8px; padding: 7px 14px;
    cursor: pointer; border: none; background: none; width: 100%; text-align: left;
    font-size: 13px; color: rgba(255,255,255,0.65); position: relative;
    transition: background 0.1s; flex: 1; padding-right: 32px;
  }
  .workspace-item:hover { background: rgba(255,255,255,0.08); color: white; }
  .workspace-item.active { color: white; font-weight: 600; background: rgba(255,255,255,0.12); }
  .workspace-item.active::before { content: ''; position: absolute; left: 0; top: 3px; bottom: 3px; width: 3px; border-radius: 0 2px 2px 0; background: var(--gold); }
  .workspace-dot { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
  .workspace-edit-btn {
    position: absolute; right: 6px;
    opacity: 0; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
    border-radius: 4px; border: none; background: none; color: rgba(255,255,255,0.6);
    font-size: 12px; cursor: pointer; flex-shrink: 0; transition: opacity 0.1s, background 0.1s;
  }
  .workspace-item-wrap:hover .workspace-edit-btn { opacity: 1; }
  .workspace-edit-btn:hover { background: rgba(255,255,255,0.15); color: white; }
  .sidebar-add-workspace { display: flex; align-items: center; gap: 6px; padding: 6px 14px; font-size: 12px; color: rgba(255,255,255,0.4); cursor: pointer; border: none; background: none; width: 100%; }
  .sidebar-add-workspace:hover { color: var(--gold); }

  /* Sidebar sections */
  .sidebar-section { padding: 10px 0 4px; border-top: 1px solid rgba(255,255,255,0.07); }
  .sidebar-section-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: rgba(255,255,255,0.38); padding: 0 14px 5px; }
  .list-item {
    display: flex; align-items: center; gap: 8px; padding: 7px 14px;
    cursor: pointer; border: none; background: none; width: 100%; text-align: left;
    font-size: 13px; color: rgba(255,255,255,0.65); position: relative; transition: background 0.1s;
  }
  .list-item:hover { background: rgba(255,255,255,0.08); color: white; }
  .list-item.active { background: rgba(255,255,255,0.14); color: white; font-weight: 500; }
  .list-item.active::before { content: ''; position: absolute; left: 0; top: 4px; bottom: 4px; width: 3px; background: var(--gold); border-radius: 0 2px 2px 0; }
  .list-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .list-count { margin-left: auto; font-size: 10.5px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.12); padding: 1px 6px; border-radius: 3px; min-width: 24px; text-align: right; box-sizing: border-box; flex-shrink: 0; }
  .list-item.active .list-count { background: var(--gold); color: var(--accent-text); }
  .sidebar-add-list { display: flex; align-items: center; gap: 6px; padding: 6px 14px; font-size: 12px; color: rgba(255,255,255,0.4); cursor: pointer; border: none; background: none; width: 100%; }
  .sidebar-add-list:hover { color: var(--gold); }
  .list-item-edit {
    opacity: 0; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
    border-radius: 4px; border: none; background: none; color: rgba(255,255,255,0.55);
    font-size: 12px; cursor: pointer; flex-shrink: 0; transition: opacity 0.1s, background 0.1s;
  }
  .list-item-wrap:hover .list-item-edit { opacity: 1; }
  .list-item-edit:hover { background: rgba(255,255,255,0.15); }
  .list-name-input { background: transparent; border: none; border-bottom: 1.5px solid var(--gold); outline: none; font-size: 13px; font-weight: 500; color: white; font-family: inherit; width: 100%; padding: 0; }
  .list-title-input { background: transparent; border: none; border-bottom: 1.5px solid var(--accent); outline: none; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; color: var(--text); font-family: var(--font-display); min-width: 80px; }

  /* ── Content area ──────────────────────── */
  .content { flex: 1; overflow-y: auto; padding: 20px 24px; padding-bottom: calc(20px + var(--safe-bottom)); background: var(--bg); }
  .list-header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .list-title { font-family: var(--font-display); font-size: 26px; font-weight: 600; letter-spacing: -0.01em; cursor: default; color: var(--accent); }
  .list-title-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .list-subtitle { font-family: var(--font-mono); font-size: 11.5px; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; color: var(--gold-deep); }
  .list-header .spacer { flex: 1; }

  /* ── Week strip (This Week day-carousel) ─── */
  .week-strip { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 16px; margin-bottom: 4px; }
  .day-chip { flex-shrink: 0; width: 46px; padding: 7px 0; border-radius: 4px; text-align: center; cursor: pointer; border: 1px solid transparent; background: var(--surface); transition: background 0.12s, border-color 0.12s; }
  .day-chip:hover { border-color: var(--card-border); }
  .day-chip .dc-d { font-family: var(--font-mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); }
  .day-chip .dc-n { font-family: var(--font-mono); font-size: 14px; font-weight: 500; color: var(--text); margin-top: 2px; }
  .day-chip .dc-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--gold); margin: 3px auto 0; opacity: 0; }
  .day-chip.has-tasks .dc-dot { opacity: 1; }
  .day-chip.today { background: var(--accent); border-color: var(--accent); }
  .day-chip.today .dc-d, .day-chip.today .dc-n { color: white; }
  .day-chip.today .dc-n { color: var(--gold-light); }
  .day-chip.today .dc-dot { background: white; }

  /* ── Toolbar & filters ─────────────────── */
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-btn { padding: 5px 12px; border-radius: 16px; font-size: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); cursor: pointer; transition: all 0.1s; }
  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
  .toolbar-sep { width: 1px; height: 20px; background: var(--border); margin: 0 2px; }

  /* ── Inline add ────────────────────────── */
  .inline-add { background: var(--surface); border: 1px dashed var(--card-border); border-radius: 4px; padding: 10px 14px; margin-bottom: 16px; cursor: text; transition: border-color 0.15s, border-style 0.15s; }
  .inline-add.expanded { border: 1px solid var(--accent); cursor: default; }
  .inline-add-collapsed { display: flex; align-items: center; gap: 8px; }
  .inline-add-fields { display: none; flex-direction: column; gap: 10px; margin-top: 10px; }
  .inline-add.expanded .inline-add-fields { display: flex; }
  .inline-add-name { width: 100%; border: none; outline: none; font-size: 16px; background: transparent; color: var(--text); font-family: inherit; }
  .inline-add-name::placeholder { color: var(--text-faint); }
  .inline-add-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .inline-field { display: flex; flex-direction: column; gap: 3px; min-width: 0; overflow: hidden; }
  .inline-field label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); }
  .inline-field input, .inline-field select, .inline-field textarea { border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 16px; color: var(--text); background: var(--surface); outline: none; font-family: inherit; transition: border-color 0.15s; width: 100%; min-width: 0; }
  .inline-field input:focus, .inline-field select:focus, .inline-field textarea:focus { border-color: var(--accent); }
  .inline-field textarea { resize: vertical; min-height: 52px; }
  .inline-add-footer { display: flex; justify-content: flex-end; gap: 8px; padding-top: 2px; }

  /* ── Buttons ───────────────────────────── */
  .btn { padding: 7px 14px; border-radius: 5px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid transparent; transition: all 0.1s; font-family: var(--font-body); }
  .btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
  .btn-primary:hover { background: var(--gold); color: var(--accent-text); border-color: var(--gold); }
  .btn-ghost { background: transparent; color: var(--text-muted); border-color: var(--border); }
  .btn-ghost:hover { background: transparent; color: var(--gold-deep); border-color: var(--gold); }
  .btn-danger { background: transparent; color: var(--red); border-color: var(--red); }
  .btn-danger:hover { background: var(--red-bg); }
  .btn-sm { padding: 4px 10px; font-size: 12px; }

  /* ── Task cards ────────────────────────── */
  .tasks-section { margin-bottom: 24px; }
  .section-label { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.09em; color: var(--gold-deep); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .overdue-label { color: var(--red); }
  .overdue-label::after { background: var(--red-bg); }
  .task-card { background: transparent; border: none; border-bottom: 1px solid var(--border); border-radius: 0; margin-bottom: 0; transition: background 0.12s ease; overflow: hidden; }
  .task-card:hover { background: var(--accent-light); }
  .task-card.done { opacity: 0.55; }
  .task-card.drag-over { background: var(--gold-bg); box-shadow: inset 0 0 0 1px var(--gold); }
  .task-card.dragging { opacity: 0.4; }
  .task-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 4px; }
  .drag-handle { color: var(--text-faint); cursor: grab; font-size: 14px; padding-top: 2px; flex-shrink: 0; opacity: 0; transition: opacity 0.1s; }
  .task-card:hover .drag-handle { opacity: 1; }
  .check-wrap { padding-top: 1px; flex-shrink: 0; }
  .check { width: 16px; height: 16px; border: 1.5px solid var(--gold); border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; flex-shrink: 0; }
  .check:hover { border-color: var(--accent); }
  .check.checked { background: var(--green); border-color: var(--green); }
  .check.checked::after { content: ''; width: 8px; height: 4px; border-left: 1.5px solid white; border-bottom: 1.5px solid white; transform: rotate(-45deg) translateY(-1px); display: block; }
  .task-body { flex: 1; min-width: 0; }
  .task-name { font-size: 13.5px; font-weight: 400; line-height: 1.4; margin-bottom: 5px; word-break: break-word; }
  .task-name.done { text-decoration: line-through; color: var(--text-faint); text-decoration-color: var(--text-faint); }
  .task-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .badge { font-size: 10.5px; padding: 2px 7px; border-radius: 3px; font-weight: 500; white-space: nowrap; font-family: var(--font-mono); font-variant-numeric: tabular-nums; border: 1px solid transparent; }
  .badge-high { background: var(--red-bg); color: var(--red); }
  .badge-medium { background: var(--amber-bg); color: var(--amber); }
  .badge-low { background: var(--green-bg); color: var(--green); }
  .badge-status { background: var(--surface2); color: var(--text-muted); }
  .badge-status.inprog { background: var(--blue-bg); color: var(--blue); }
  .badge-cat { background: var(--gold-bg); color: var(--gold-deep); border-color: var(--card-border); font-family: var(--font-body); }
  .badge-due { background: var(--surface2); color: var(--text-muted); border-color: var(--border); }
  .badge-due.overdue { background: var(--red-bg); color: var(--red); border-color: rgba(156,74,46,0.35); }
  .badge-dodate { background: var(--gold-bg); color: var(--gold-deep); border-color: var(--card-border); }
  .badge-recurring { background: var(--green-bg); color: var(--green); font-family: var(--font-body); }
  .badge-list { background: var(--surface2); color: var(--text-muted); font-family: var(--font-body); }
  .task-right { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .icon-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer; border: none; background: none; color: var(--text-faint); font-size: 15px; transition: all 0.1s; }
  .icon-btn:hover { background: var(--surface2); color: var(--text); }
  .icon-btn.danger:hover { background: var(--red-bg); color: var(--red); }

  .subtasks { border-top: 1px solid var(--border); padding: 6px 14px 10px 41px; display: flex; flex-direction: column; gap: 4px; }
  .subtask-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .subtask-name { font-size: 13px; flex: 1; color: var(--text); }
  .subtask-name.done { text-decoration: line-through; color: var(--text-muted); }
  .subtask-add-wrap { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; flex: 1; margin-top: 4px; }
  .subtask-add-wrap input { flex: 1; font-size: 16px; border: none; outline: none; background: transparent; color: var(--text); }
  .subtask-add-wrap input::placeholder { color: var(--text-faint); }
  .progress-bar { height: 3px; background: var(--surface2); border-radius: 2px; margin: 4px 0 0; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s; }
  .task-note { font-size: 12px; color: var(--text-muted); margin-top: 4px; line-height: 1.5; font-style: italic; }

  .empty { text-align: center; padding: 60px 20px; color: var(--text-faint); }
  .empty-icon { margin: 0 auto 16px; width: 64px; height: 64px; background: var(--gold-bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--gold); }
  .empty-title { font-size: 15px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; }
  .empty-sub { font-size: 13px; margin-bottom: 18px; }
  .empty-cta { display: inline-block; margin-top: 4px; padding: 8px 20px; background: var(--accent); color: white; border: none; border-radius: 6px; font-size: 13px; font-weight: 500; font-family: inherit; letter-spacing: 0.04em; cursor: pointer; transition: background 0.15s, color 0.15s; }
  .empty-cta:hover { background: var(--gold); color: var(--accent); }

  /* Focus rings */
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; }
  .search-group { margin-bottom: 20px; }
  .search-group-label { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.09em; color: var(--gold-deep); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .search-group-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* ── Modals ────────────────────────────── */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: var(--surface); border-radius: 14px; width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
  .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 0; }
  .modal-title { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 17px; font-weight: 700; color: var(--accent); }
  .modal-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }
  .modal-footer { padding: 0 20px 18px; display: flex; gap: 8px; justify-content: flex-end; }
  .field label { display: block; font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.04em; }
  .field input, .field select, .field textarea { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 16px; color: var(--text); background: var(--surface); outline: none; font-family: inherit; transition: border-color 0.15s; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 70px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .color-picker { display: flex; gap: 8px; flex-wrap: wrap; }
  .color-dot { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.1s; }
  .color-dot:hover { transform: scale(1.15); }
  .color-dot.selected { border-color: var(--text); }

  /* Gmail */
  .gmail-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }
  .gmail-item input[type=checkbox] { margin-top: 3px; flex-shrink: 0; accent-color: var(--accent); width: 15px; height: 15px; }
  .gmail-item-body { flex: 1; }
  .gmail-item-subject { font-size: 13px; font-weight: 500; margin-bottom: 3px; }
  .gmail-item-preview { font-size: 12px; color: var(--text-muted); }
  .gmail-status { font-size: 13px; color: var(--text-muted); text-align: center; padding: 16px; }

  /* Ideas */
  .idea-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; margin-bottom: 8px; display: flex; gap: 10px; align-items: flex-start; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; box-shadow: 0 1px 2px rgba(22,35,61,0.06); }
  .idea-card:hover { border-color: var(--border-strong); box-shadow: 0 2px 6px rgba(22,35,61,0.08); }
  .idea-text { flex: 1; font-size: 14px; line-height: 1.5; word-break: break-word; }
  .idea-date { font-size: 11px; color: var(--text-faint); margin-top: 4px; }
  .idea-add { display: flex; gap: 8px; margin-bottom: 16px; }
  .idea-add textarea { flex: 1; border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; font-size: 16px; font-family: inherit; color: var(--text); background: var(--surface); outline: none; resize: none; min-height: 60px; transition: border-color 0.15s; }
  .idea-add textarea:focus { border-color: var(--accent); }
  .idea-add-btn { align-self: flex-end; }
  .idea-modal-text { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 16px; font-family: inherit; color: var(--text); background: var(--surface); outline: none; resize: vertical; min-height: 100px; transition: border-color 0.15s; }
  .idea-modal-text:focus { border-color: var(--accent); }

  /* Sidebar overlay */
  .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 99; }
  .sidebar-overlay.visible { display: block; }

  /* ── Bottom nav & FAB (mobile only) ──────── */
  .bottom-nav { display: none; }
  .fab { display: none; }

  /* ── Mobile ────────────────────────────── */
  @media (max-width: 640px) {
    header { padding: calc(var(--safe-top) + 8px) 12px 8px; gap: 8px; }
    .app-name { font-size: 15px; }
    .header-search { flex: 1; min-width: 0; width: auto; }

    /* Sidebar becomes a bottom sheet, reached via the bottom nav — not a side drawer */
    .sidebar {
      position: fixed; left: 0; right: 0; bottom: 0; top: auto; z-index: 100;
      width: auto; max-height: 78vh;
      border-radius: 16px 16px 0 0;
      transform: translateY(100%); transition: transform 0.25s ease;
      box-shadow: 0 -8px 32px rgba(0,0,0,0.35);
      padding-top: 0;
    }
    .sidebar.open { transform: translateY(0); }
    .sidebar::before {
      content: ''; display: block; width: 36px; height: 4px; border-radius: 2px;
      background: rgba(255,255,255,0.25); margin: 10px auto 2px; flex-shrink: 0;
    }

    .content { padding: 14px 14px calc(14px + var(--safe-bottom) + 78px); }
    .list-header { margin-bottom: 12px; }
    .list-title { font-size: 19px; }
    .toolbar { gap: 6px; margin-bottom: 12px; }
    .filter-btn { padding: 4px 10px; font-size: 11px; }

    .task-row { padding: 10px; gap: 8px; }
    .drag-handle { display: none; }
    .task-name { font-size: 13px; }
    .badge { font-size: 10px; padding: 2px 6px; }
    .task-right { gap: 2px; }
    .icon-btn { width: 44px; height: 44px; font-size: 15px; }
    .list-item { min-height: 44px; }
    .check { width: 22px; height: 22px; }

    .inline-add { display: none; }

    .list-item-edit { opacity: 1; }
    .workspace-edit-btn { opacity: 1; }

    .modal-bg { padding: 0; align-items: flex-end; }
    .modal { border-radius: 16px 16px 0 0; max-height: 90vh; max-width: 100%; }

    /* ── Bottom nav: View · Add · List ──────── */
    .bottom-nav {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: end;
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 90;
      background: var(--accent);
      background-image: repeating-linear-gradient(180deg, rgba(255,255,255,0.028) 0px, rgba(255,255,255,0.028) 1px, transparent 1px, transparent 27px);
      padding: 8px 4px calc(6px + var(--safe-bottom));
      box-shadow: 0 -2px 14px rgba(0,0,0,0.22);
    }
    .bn-item {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
      background: none; border: none; cursor: pointer; padding: 6px 2px; min-height: 44px;
    }
    .bn-stem { width: 2px; height: 14px; border-radius: 1px; background: rgba(255,255,255,0.3); transition: all 0.15s; }
    .bn-label { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.05em; text-transform: uppercase; color: rgba(255,255,255,0.55); transition: color 0.15s; }
    .bn-item.active .bn-stem { background: var(--gold); height: 18px; }
    .bn-item.active .bn-label { color: var(--gold-light); }

    /* Circular add button, centered and elevated above the bar */
    .fab {
      display: flex; align-items: center; justify-content: center;
      width: 54px; height: 54px; border-radius: 50%; border: 4px solid var(--accent);
      background: var(--gold-deep); color: white; font-size: 28px; font-weight: 300; line-height: 1;
      box-shadow: 0 10px 22px -6px rgba(140,111,69,0.55);
      cursor: pointer; transform: translateY(-20px); margin: 0 6px;
    }
    .fab:active { transform: translateY(-20px) scale(0.94); }
  }

  /* ── Goals ────────────────────────────────── */
  .goals-group-label { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.09em; color: var(--gold-deep); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .goals-group-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .goal-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 6px; transition: border-color 0.15s, box-shadow 0.15s; box-shadow: 0 1px 2px rgba(22,35,61,0.06); }
  .goal-item:hover { border-color: var(--border-strong); box-shadow: 0 2px 6px rgba(22,35,61,0.08); }
  .goal-num { font-size: 13px; font-weight: 700; color: var(--gold); min-width: 20px; padding-top: 1px; flex-shrink: 0; }
  .goal-text { flex: 1; font-size: 14px; line-height: 1.5; }
  .goal-edit-btn { opacity: 0; transition: opacity 0.1s; flex-shrink: 0; }
  .goal-item:hover .goal-edit-btn { opacity: 1; }

  /* ── Rule of Life ─────────────────────────── */
  .rule-category { margin-bottom: 20px; }
  .rule-category-header { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.09em; color: var(--gold-deep); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .rule-category-header::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .rule-item { display: flex; align-items: center; gap: 10px; padding: 9px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 5px; transition: border-color 0.15s, box-shadow 0.15s; box-shadow: 0 1px 2px rgba(22,35,61,0.06); }
  .rule-item:hover { border-color: var(--border-strong); box-shadow: 0 2px 6px rgba(22,35,61,0.08); }
  .rule-cadence { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; padding: 2px 6px; border-radius: 8px; background: var(--surface2); color: var(--text-faint); flex-shrink: 0; }
  .rule-cadence.daily    { background: #16233D; color: #ffffff; }
  .rule-cadence.weekly   { background: #3a6186; color: #ffffff; }
  .rule-cadence.monthly  { background: #BA9E78; color: #ffffff; }
  .rule-cadence.quarterly{ background: #d4bfa0; color: #3d2e1a; }
  .rule-cadence.annually { background: #e8ddd4; color: #4a3828; }
  .rule-text { flex: 1; font-size: 14px; line-height: 1.4; }
  .rule-edit-btn { opacity: 0; transition: opacity 0.1s; flex-shrink: 0; }
  .rule-item:hover .rule-edit-btn { opacity: 1; }

  /* ── Dashboard ────────────────────────────── */
  .dash-window-tabs { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
  .dash-tab { padding: 5px 14px; border-radius: 16px; font-size: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); cursor: pointer; transition: all 0.1s; }
  .dash-tab.active { background: var(--accent); color: white; border-color: var(--accent); }
  .dash-category-block { margin-bottom: 28px; }
  .dash-category-header { font-family: var(--font-mono); font-size: 11.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.09em; color: var(--accent); margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
  .dash-category-avg { display: flex; align-items: center; }
  .dash-rule-row { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; margin-bottom: 8px; box-shadow: 0 1px 2px rgba(22,35,61,0.06); }
  .dash-rule-name { font-size: 13px; font-weight: 500; line-height: 1.4; }
  .heatmap { display: flex; gap: 2px; flex-wrap: wrap; }
  .hm-cell { width: 11px; height: 11px; border-radius: 2px; background: var(--surface2); }
  .hm-cell.done { background: var(--gold); opacity: 0.9; }
  .dash-goal-block { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 14px; margin-bottom: 8px; box-shadow: 0 1px 2px rgba(22,35,61,0.06); }
  .dash-goal-text { font-size: 14px; font-weight: 500; color: var(--accent-text); margin-bottom: 8px; line-height: 1.4; }
  .dash-refl-entry { padding: 8px 0; border-top: 1px solid var(--border); }
  .dash-refl-text { font-size: 13px; color: var(--text-muted); line-height: 1.5; }
  .dash-refl-date { font-size: 11px; color: var(--text-faint); margin-top: 3px; }

  /* ── Reflection ───────────────────────────── */
  .reflection-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; box-shadow: 0 1px 2px rgba(22,35,61,0.06); }
  .reflection-card:hover { border-color: var(--border-strong); box-shadow: 0 2px 6px rgba(22,35,61,0.08); }
  .reflection-card-date { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
  .energy-dots { display: flex; gap: 3px; align-items: center; }
  .energy-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--surface2); }
  .energy-dot.lit { background: var(--gold); }
  .reflection-card-excerpt { font-size: 13px; color: var(--text-muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .energy-selector { display: flex; gap: 8px; }
  .energy-btn { width: 40px; height: 36px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 600; color: var(--text-muted); transition: all 0.1s; }
  .energy-btn.selected { background: var(--gold); border-color: var(--gold); color: white; }
  .prompt-banner { background: var(--accent-light); border: 1px solid rgba(22,35,61,0.15); border-radius: 6px; padding: 12px 14px; margin-bottom: 4px; }
  .prompt-banner-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); margin-bottom: 4px; }
  .prompt-banner-text { font-size: 14px; color: var(--accent-text); line-height: 1.5; font-style: italic; }
  .prompt-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; }
  .prompt-item-text { flex: 1; font-size: 13px; line-height: 1.5; color: var(--text); }
  .prompt-item-goal { font-size: 11px; color: var(--text-faint); margin-top: 3px; }
  .prompt-edit-btn { opacity: 0; transition: opacity 0.1s; flex-shrink: 0; }
  .prompt-item:hover .prompt-edit-btn { opacity: 1; }
  .prompts-toggle { font-size: 12px; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 12px 0 8px; border-top: 1px solid var(--border); margin-top: 20px; user-select: none; }
  .prompts-toggle:hover { color: var(--text); }

  @media (max-width: 640px) {
    .goal-edit-btn { opacity: 1; }
    .rule-edit-btn { opacity: 1; }
    .prompt-edit-btn { opacity: 1; }
  }
</style>
</head>
<body>
<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>
<header>
  <span class="app-name">My <span>Tracker</span></span>
  <div class="spacer"></div>
  <div class="header-search" style="flex:1;max-width:360px">
    <span style="color:rgba(255,255,255,0.5);display:flex;align-items:center"><svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="5.5" cy="5.5" r="4"/><line x1="8.5" y1="8.5" x2="12" y2="12"/></svg></span>
    <input id="global-search" placeholder="Search tasks…" oninput="handleSearch(this.value)" />
  </div>
</header>

<div class="app">
  <aside class="sidebar">
    <!-- Zone 1: collapsible workspace dropdown -->
    <div id="workspace-switcher"></div>

    <!-- Zone 2: scrollable Views / Lists / Ideas -->
    <div class="sidebar-scroll">
      <div class="sidebar-section" id="sidebar-views-section">
        <div class="sidebar-section-label">Views</div>
        <button class="list-item" id="today-btn" onclick="setActiveList('__today__')">
          <span style="width:8px;height:8px;border-radius:50%;background:var(--gold);flex-shrink:0;display:inline-block"></span>
          <span>Today</span>
          <span class="list-count" id="today-count" style="display:none"></span>
        </button>
        <button class="list-item" id="thisweek-btn" onclick="setActiveList('__thisweek__')">
          <span style="width:8px;height:8px;border-radius:50%;background:var(--gold);flex-shrink:0;display:inline-block"></span>
          <span>This Week</span>
          <span class="list-count" id="thisweek-count" style="display:none"></span>
        </button>
      </div>
      <div class="sidebar-section" id="sidebar-lists-section">
        <div class="sidebar-section-label">Lists</div>
        <div id="list-nav"></div>
        <button class="sidebar-add-list" onclick="openNewListModal()">＋ New list</button>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-label">Ideas</div>
        <div id="idea-nav"></div>
        <button class="sidebar-add-list" onclick="openNewIdeaModal()">＋ New idea space</button>
      </div>
    </div>

    <!-- Zone 3: pinned Reflect section -->
    <div class="sidebar-bottom" id="sidebar-reflect-section">
      <div class="sidebar-section">
        <div class="sidebar-section-label">Reflect</div>
        <button class="list-item" id="goals-btn" onclick="setActiveList('__goals__')">
          <span style="width:8px;height:8px;border-radius:50%;background:var(--gold);flex-shrink:0;display:inline-block"></span>
          <span>Goals</span>
        </button>
        <button class="list-item" id="ruleoflife-btn" onclick="setActiveList('__ruleoflife__')">
          <span style="width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;display:inline-block"></span>
          <span>Rule of Life</span>
        </button>
        <button class="list-item" id="reflection-btn" onclick="setActiveList('__reflection__')">
          <span style="width:8px;height:8px;border-radius:50%;background:var(--purple);flex-shrink:0;display:inline-block"></span>
          <span>Daily Reflection</span>
        </button>
        <button class="list-item" id="dashboard-btn" onclick="setActiveList('__dashboard__')">
          <span style="width:8px;height:8px;border-radius:50%;background:var(--blue);flex-shrink:0;display:inline-block"></span>
          <span>Dashboard</span>
        </button>
      </div>
    </div>
  </aside>
  <main class="main">
    <div class="content" id="content"></div>
  </main>
</div>

<nav class="bottom-nav" id="bottom-nav">
  <button class="bn-item" id="bn-view" onclick="openMobileMenu('sidebar-views-section')">
    <span class="bn-stem"></span><span class="bn-label">View</span>
  </button>
  <button class="fab" id="fab-add" onclick="openNewTaskModal()" title="Add task" aria-label="Add task">+</button>
  <button class="bn-item" id="bn-list" onclick="openMobileMenu('sidebar-lists-section')">
    <span class="bn-stem"></span><span class="bn-label">List</span>
  </button>
</nav>

<!-- Task Edit Modal -->
<div class="modal-bg" id="task-modal" style="display:none" onclick="if(event.target===this)closeTaskModal()">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="task-modal-title">Edit task</span>
      <button class="icon-btn" onclick="closeTaskModal()"><svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="1" y1="1" x2="10" y2="10"/><line x1="10" y1="1" x2="1" y2="10"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="field"><label>Task name</label><input id="tm-name" placeholder="What needs to be done?" /></div>
      <div class="field-row">
        <div class="field"><label>Deadline date</label><input type="date" id="tm-deadline-date" /></div>
        <div class="field"><label>Deadline time</label><input type="time" id="tm-deadline-time" /></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Do date</label><input type="date" id="tm-do-date" /></div>
        <div class="field"><label>Do time</label><input type="time" id="tm-do-time" /></div>
      </div>
      <div class="field"><label>Recurrence</label><select id="tm-recurrence"><option value="">None</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select></div>
      <div class="field"><label>Move to list</label><select id="tm-list"></select></div>
      <div class="field"><label>Notes</label><textarea id="tm-notes" placeholder="Any extra context…"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeTaskModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveTask()">Save task</button>
    </div>
  </div>
</div>

<!-- List Modal -->
<div class="modal-bg" id="list-modal" style="display:none" onclick="if(event.target===this)closeListModal()">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="list-modal-title">New list</span>
      <button class="icon-btn" onclick="closeListModal()"><svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="1" y1="1" x2="10" y2="10"/><line x1="10" y1="1" x2="1" y2="10"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="field"><label>List name</label><input id="lm-name" placeholder="e.g. Work, Personal, Q3 Goals…" /></div>
      <div class="field"><label>Color</label><div class="color-picker" id="lm-colors"></div></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" id="lm-delete-btn" onclick="deleteListFromModal()" style="margin-right:auto;display:none">Delete list</button>
      <button class="btn btn-ghost" onclick="closeListModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveList()">Save list</button>
    </div>
  </div>
</div>

<!-- Workspace Modal -->
<div class="modal-bg" id="workspace-modal" style="display:none" onclick="if(event.target===this)closeWorkspaceModal()">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="workspace-modal-title">New workspace</span>
      <button class="icon-btn" onclick="closeWorkspaceModal()"><svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="1" y1="1" x2="10" y2="10"/><line x1="10" y1="1" x2="1" y2="10"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="field"><label>Workspace name</label><input id="wm-name" placeholder="e.g. Client, Side project…" /></div>
      <div class="field"><label>Color</label><div class="color-picker" id="wm-colors"></div></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" id="wm-delete-btn" onclick="deleteWorkspaceFromModal()" style="margin-right:auto;display:none">Delete workspace</button>
      <button class="btn btn-ghost" onclick="closeWorkspaceModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveWorkspace()">Save</button>
    </div>
  </div>
</div>

<!-- Gmail Sync Modal -->
<div class="modal-bg" id="gmail-modal" style="display:none" onclick="if(event.target===this)closeGmailModal()">
  <div class="modal" style="max-width:560px">
    <div class="modal-header">
      <span class="modal-title">Sync from Gmail</span>
      <button class="icon-btn" onclick="closeGmailModal()"><svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="1" y1="1" x2="10" y2="10"/><line x1="10" y1="1" x2="1" y2="10"/></svg></button>
    </div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--text-muted)">Emails with <strong>[task]</strong> in the subject will be parsed into tasks. Select which ones to import.</p>
      <div id="gmail-list"><div class="gmail-status">Loading emails…</div></div>

};

const WORKSPACE_DEFS = [
  { id: 'velocitytx',  name: 'VelocityTX',       color: '#16335B' },
  { id: 'embrace',     name: 'Embrace',            color: '#BA9E78' },
  { id: 'personal',    name: 'Personal',           color: '#7a746c' },
  { id: 'acu',         name: 'ACU Angel Network',  color: '#5b3fa8' },
];

function makeDefaultWorkspace(wid) {
  const def = WORKSPACE_DEFS.find(w => w.id === wid) || { name: wid, color: LIST_COLORS[0] };
  const isMain = wid === 'velocitytx';
  return {
    name: def.name,
    color: def.color,
    lists: [{ id: 'tasks', name: 'Active tasks', color: def.color }],
    ideas: isMain
      ? [{ id: 'goals', name: 'Long-term goals', color: '#1a5fa8' },
         { id: 'think', name: 'Things to think about', color: '#7a746c' }]
      : [],
    tasks: [],
    notes: [],
    manualOrders: {},
    completedCollapsed: {},
    activeList: 'tasks',
  };
}

let state = {
  activeWorkspace: 'velocitytx',
  workspaceOrder: ['velocitytx', 'embrace', 'personal', 'acu'],
  workspaces: {
    velocitytx: makeDefaultWorkspace('velocitytx'),
    embrace:    makeDefaultWorkspace('embrace'),
    personal:   makeDefaultWorkspace('personal'),
    acu:        makeDefaultWorkspace('acu'),
  },
  goals: { personal: [], professional: [] },
  ruleItems: [],
  ruleChecks: [],
  reflections: [],
  prompts: DEFAULT_PROMPTS.map(p => ({...p})),
};

function ws() { return state.workspaces[state.activeWorkspace]; }

let workspaceSwitcherOpen = false;
let editingTaskId = null;
let editingListId = null;
let editingWorkspaceId = null;
let expandedTasks = new Set();
let pickedColor = LIST_COLORS[0];
let pickedWorkspaceColor = LIST_COLORS[0];
let searchQuery = '';
let dragSrcId = null;
let pendingEmails = [];
let calendarConnected = {};  // { workspaceId: true/false }
const SYNC_WORKSPACES = ['embrace', 'personal', 'acu'];

// ── Persist ──────────────────────────────────────────────────────────
let saveTimer = null;

async function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      mergeLoaded(JSON.parse(raw));
    } else {
      const oldRaw = localStorage.getItem('tracker_v3');
      if (oldRaw) mergeLoaded(JSON.parse(oldRaw));
    }
  } catch(e) {}
  render();

  try {
    const res = await fetch('/api/sync', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'load' })
    });
    const data = await res.json();
    if (data.state) {
      mergeLoaded(data.state);
      localStorage.setItem(STORE_KEY, JSON.stringify(serialize()));
      render();
    }
  } catch(e) {
    console.warn('Cloud load failed, using local data:', e);
  }

  // Check Google Calendar connection status for all sync workspaces (non-blocking)
  fetch('/api/calendar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'status_all', workspaceIds: SYNC_WORKSPACES })
  }).then(r => r.json()).then(d => {
    if (d.connected) calendarConnected = d.connected;
  }).catch(() => {});
}

function serialize() {
  return { ...state, _expanded: [...expandedTasks] };
}

function mergeLoaded(saved) {
  // Old flat format migration
  if (saved.lists && !saved.workspaces) {
    const ideas = saved.ideas || [];
    let lists = saved.lists || [];
    ['goals','think'].forEach(id => {
      const inLists = lists.find(l => l.id === id);
      const inIdeas = ideas.find(l => l.id === id);
      if (inLists && !inIdeas) { ideas.push(inLists); lists = lists.filter(l => l.id !== id); }
    });
    if (lists.length === 0) lists.push({ id: 'tasks', name: 'Active tasks', color: '#16335B' });
    const allIds = [...lists.map(l=>l.id), ...ideas.map(l=>l.id), '__today__'];
    const activeList = allIds.includes(saved.activeList) ? saved.activeList : lists[0]?.id || 'tasks';
    state.workspaces.velocitytx = {
      name: 'VelocityTX', color: '#16335B',
      lists, ideas,
      tasks: saved.tasks || [],
      notes: saved.notes || [],
      manualOrders: saved.manualOrders || {},
      completedCollapsed: saved.completedCollapsed || {},
      activeList,
    };
    state.activeWorkspace = 'velocitytx';
    expandedTasks = new Set(saved._expanded || []);
    ensureWorkspaces();
    return;
  }

  if (saved.workspaces) {
    state.activeWorkspace = saved.activeWorkspace || 'velocitytx';
    state.workspaceOrder = saved.workspaceOrder || Object.keys(saved.workspaces);
    Object.keys(saved.workspaces).forEach(id => {
      state.workspaces[id] = saved.workspaces[id];
    });
    expandedTasks = new Set(saved._expanded || []);
  }

  if (saved.goals !== undefined) state.goals = saved.goals;
  if (saved.ruleItems !== undefined) state.ruleItems = saved.ruleItems;
  if (saved.ruleChecks !== undefined) state.ruleChecks = saved.ruleChecks;
  if (saved.reflections !== undefined) state.reflections = saved.reflections;
  if (saved.prompts !== undefined) state.prompts = saved.prompts;

  ensureWorkspaces();
  ensureTopLevel();
}

function ensureWorkspaces() {
  // Seed any missing predefined workspaces
  WORKSPACE_DEFS.forEach(w => {
    if (!state.workspaces[w.id]) state.workspaces[w.id] = makeDefaultWorkspace(w.id);
  });
  // Ensure workspaceOrder exists and covers all workspaces
  if (!state.workspaceOrder) state.workspaceOrder = Object.keys(state.workspaces);
  WORKSPACE_DEFS.forEach(w => {
    if (!state.workspaceOrder.includes(w.id)) state.workspaceOrder.push(w.id);
  });

  Object.keys(state.workspaces).forEach(id => {
    const w = state.workspaces[id];
    if (!w.name) { const def = WORKSPACE_DEFS.find(d => d.id === id); w.name = def?.name || id; }
    if (!w.color) { const def = WORKSPACE_DEFS.find(d => d.id === id); w.color = def?.color || LIST_COLORS[0]; }
    if (!w.lists) w.lists = [];
    if (!w.ideas) w.ideas = [];
    if (!w.tasks) w.tasks = [];
    if (!w.notes) w.notes = [];
    if (!w.manualOrders) w.manualOrders = {};
    if (!w.completedCollapsed) w.completedCollapsed = {};
    if (w.lists.length === 0) w.lists.push({ id: 'tasks', name: 'Active tasks', color: w.color });
    const allIds = [...w.lists.map(l=>l.id), ...w.ideas.map(l=>l.id), '__today__', '__thisweek__', '__goals__', '__ruleoflife__', '__reflection__', '__dashboard__'];
    if (!allIds.includes(w.activeList)) w.activeList = w.lists[0]?.id || '';
  });

  if (!state.workspaces[state.activeWorkspace]) state.activeWorkspace = state.workspaceOrder[0];
}

function save() {
  const payload = serialize();
  localStorage.setItem(STORE_KEY, JSON.stringify(payload));
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      await fetch('/api/sync', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'save', state: payload })
      });
    } catch(e) { console.warn('Cloud save failed:', e); }
  }, 1500);
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function fmtDateTime(date, time) {
  if (!date) return '';
  const dt = new Date(date + 'T00:00:00');
  const datePart = dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  if (!time) return datePart;
  const [h, m] = time.split(':');
  const hour = parseInt(h);
  return `${datePart} ${hour%12||12}:${m}${hour>=12?'pm':'am'}`;
}

function isOverdue(deadlineDate, status) {
  if (!deadlineDate || status === 'Done') return false;
  return new Date(deadlineDate + 'T00:00:00') < new Date(TODAY + 'T00:00:00');
}

function isToday(date) { return date === TODAY; }

const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDateMono(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return `${DAY_NAMES[d.getDay()].toUpperCase()} · ${MONTH_NAMES[d.getMonth()].toUpperCase()} ${d.getDate()}`;
}

function getThisWeekDates() {
  const today = new Date(TODAY + 'T00:00:00');
  const dates = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() + i);
    dates.push(d.toISOString().slice(0, 10));
  }
  return dates; // [today, today+1, ..., today+6] — rolling 7-day window
}

function isThisWeek(date) {
  if (!date) return false;
  const dates = getThisWeekDates();
  return dates.includes(date);
}
function getList(id) { return ws().lists.find(l => l.id === id); }
function getIdea(id) { return (ws().ideas||[]).find(l => l.id === id); }
function isIdeaSpace(id) { return !!(ws().ideas||[]).find(l => l.id === id); }
function getListTasks(listId) { return ws().tasks.filter(t => t.listId === listId && !t.parentId); }
function getIdeaNotes(spaceId) { return (ws().notes||[]).filter(n => n.spaceId === spaceId); }
function getSubtasks(parentId) { return ws().tasks.filter(t => t.parentId === parentId); }

function advanceDate(date, recurrence) {
  if (!date) return '';
  const d = new Date(date + 'T00:00:00');
  if (recurrence === 'daily') d.setDate(d.getDate() + 1);
  else if (recurrence === 'weekly') d.setDate(d.getDate() + 7);
  else if (recurrence === 'monthly') d.setMonth(d.getMonth() + 1);
  return d.toISOString().slice(0,10);
}

function earliestDate(t) {
  const dates = [t.doDate, t.deadlineDate].filter(Boolean);
  if (!dates.length) return null;
  return dates.reduce((min, d) => d < min ? d : min);
}

function sortedTasks(tasks, listId) {
  const order = ws().manualOrders[listId];
  if (order && order.length) {
    const map = new Map(tasks.map(t => [t.id, t]));
    const sorted = order.map(id => map.get(id)).filter(Boolean);
    tasks.forEach(t => { if (!order.includes(t.id)) sorted.push(t); });
    return sorted;
  }
  return [...tasks].sort((a, b) => {
    if (a.status === 'Done' && b.status !== 'Done') return 1;
    if (b.status === 'Done' && a.status !== 'Done') return -1;
    const da = earliestDate(a), db = earliestDate(b);
    if (da && db) return new Date(da) - new Date(db);
    if (da) return -1; if (db) return 1;
    return 0;
  });
}

function renderThisWeekView() {
  const dates = getThisWeekDates();
  const weekStart = dates[0];
  const overdue = ws().tasks.filter(t => !t.parentId && t.doDate && t.doDate < weekStart && t.status !== 'Done');
  const overdueCollapsed = ws().completedCollapsed['__thisweek__overdue'] === true;

  function fmtDay(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const label = dateStr === TODAY ? 'Today' : DAY_NAMES[d.getDay()];
    return `${label} · ${MONTH_NAMES[d.getMonth()]} ${d.getDate()}`;
  }

  const dayCounts = {};
  dates.forEach(d => { dayCounts[d] = ws().tasks.filter(t => !t.parentId && t.doDate === d && t.status !== 'Done').length; });

  const strip = dates.map(dateStr => {
    const d = new Date(dateStr + 'T00:00:00');
    const isT = dateStr === TODAY;
    return `<div class="day-chip${isT ? ' today' : ''}${dayCounts[dateStr] > 0 ? ' has-tasks' : ''}" onclick="document.getElementById('day-${dateStr}').scrollIntoView({behavior:'smooth',block:'start'})">
      <div class="dc-d">${DAY_NAMES[d.getDay()]}</div>
      <div class="dc-n">${d.getDate()}</div>
      <div class="dc-dot"></div>
    </div>`;
  }).join('');

  const sections = dates.map(dateStr => {
    const dayTasks = ws().tasks.filter(t => !t.parentId && t.doDate === dateStr);
    const active = dayTasks.filter(t => t.status !== 'Done');
    const done = dayTasks.filter(t => t.status === 'Done');
    const doneCollapsed = ws().completedCollapsed['__thisweek__' + dateStr] !== false;

    if (dayTasks.length === 0) return `
      <div class="tasks-section" id="day-${dateStr}">
        <div class="section-label" style="cursor:default">${fmtDay(dateStr)}</div>
        <div style="font-size:13px;color:var(--text-faint);padding:6px 0 10px">Nothing scheduled</div>
      </div>`;

    return `
      <div class="tasks-section" id="day-${dateStr}">
        <div class="section-label" style="cursor:default">${fmtDay(dateStr)}</div>
        ${active.map(t => renderSingleTaskCard(t, null, getList(t.listId))).join('')}
        ${done.length > 0 ? `
          <div class="section-label" style="font-size:10px;margin-top:4px" onclick="toggleDoneCollapsed('__thisweek__${dateStr}')">
            ${doneCollapsed ? ICONS.chevRight : ICONS.chevDown} Completed (${done.length})
          </div>
          ${doneCollapsed ? '' : done.map(t => renderSingleTaskCard(t, null, getList(t.listId))).join('')}
        ` : ''}
      </div>`;
  }).join('');

  const totalActive = dates.reduce((n, d) => n + dayCounts[d], 0);

  const overdueSection = overdue.length > 0 ? `
    <div class="tasks-section">
      <div class="section-label overdue-label" onclick="toggleDoneCollapsed('__thisweek__overdue')">${overdueCollapsed?ICONS.chevRight:ICONS.chevDown} Overdue (${overdue.length})</div>
      ${overdueCollapsed ? '' : overdue.map(t => renderSingleTaskCard(t, null, getList(t.listId))).join('')}
    </div>` : '';

  const rangeLabel = `${MONTH_NAMES[new Date(dates[0]+'T00:00:00').getMonth()].toUpperCase()} ${new Date(dates[0]+'T00:00:00').getDate()} – ${MONTH_NAMES[new Date(dates[6]+'T00:00:00').getMonth()].toUpperCase()} ${new Date(dates[6]+'T00:00:00').getDate()}`;

  document.getElementById('content').innerHTML = `
    <div class="list-header">
      <span class="list-title">This Week</span>
      <span class="list-subtitle">${rangeLabel}${overdue.length > 0 ? ` · ${overdue.length} OVERDUE` : ''}</span>
      <div class="spacer"></div>
      ${totalActive > 0 ? `<span style="font-size:13px;color:var(--text-muted)">${totalActive} task${totalActive !== 1 ? 's' : ''}</span>` : ''}
    </div>
    <div class="week-strip">${strip}</div>
    ${renderInlineAdd()}
    <div id="task-sections">
      ${overdueSection}
      ${totalActive === 0 && overdue.length === 0 && dates.every(d => ws().tasks.filter(t => !t.parentId && t.doDate === d).length === 0)
        ? `<div class="empty"><div class="empty-icon">${ICONS.emptyCalendar}</div><div class="empty-title">Nothing scheduled this week</div><div class="empty-sub">Tasks with a Do Date this week appear here</div></div>`
        : sections}
    </div>
  `;
}

async function openGmailModal() {
  document.getElementById('gmail-modal').style.display = 'flex';
  document.getElementById('gmail-list').innerHTML = '<div class="gmail-status">Searching for emails with [task] in subject…</div>';
  document.getElementById('gmail-import-btn').style.display = 'none';
  document.getElementById('gmail-import-count').textContent = '';
  pendingEmails = [];

  try {
    const response = await fetch('/api/outlook', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'fetch' })
    });
    if (response.status === 401) {
      const data = await response.json();
      if (data.error === 'NOT_AUTHED') {
        document.getElementById('gmail-list').innerHTML = `
          <div class="gmail-status">
            <p style="margin-bottom:12px">You need to connect your Gmail account first.</p>
            <button class="btn btn-primary" onclick="connectGmail()">Connect Gmail</button>
          </div>`;
        return;
      }
    }
    const data = await response.json();
    if (data.error) throw new Error(data.error);
    const emails = data.emails || [];
    if (!emails.length) {
      document.getElementById('gmail-list').innerHTML = '<div class="gmail-status">No emails found with [task] in the subject.</div>';
      return;
    }
    pendingEmails = emails;
    document.getElementById('gmail-list').innerHTML = emails.map((e, i) => `
      <div class="gmail-item">
        <input type="checkbox" id="email-${i}" checked onchange="updateImportCount()">
        <div class="gmail-item-body">
          <div class="gmail-item-subject">${esc(e.subject)}</div>
          <div class="gmail-item-preview">${esc(e.from)} · ${esc(e.date)}</div>
          <div class="gmail-item-preview" style="margin-top:3px">${esc((e.body||'').slice(0,120))}…</div>
        </div>
      </div>`).join('');
    document.getElementById('gmail-import-btn').style.display = '';
    updateImportCount();
  } catch(err) {
    document.getElementById('gmail-list').innerHTML = `<div class="gmail-status">Error: ${esc(String(err))}.</div>`;
  }
}

function updateImportCount() {
  const checked = pendingEmails.filter((_,i) => document.getElementById('email-'+i)?.checked).length;
  document.getElementById('gmail-import-count').textContent = `${checked} email${checked!==1?'s':''} selected`;
}

async function importSelectedEmails() {
  const selected = pendingEmails.filter((_,i) => document.getElementById('email-'+i)?.checked);
  if (!selected.length) return;
  document.getElementById('gmail-import-btn').textContent = 'Importing…';
  document.getElementById('gmail-import-btn').disabled = true;
  for (const email of selected) {
    try {
      const parseRes = await fetch('/api/outlook', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'parse', email, listIds: ws().lists.map(l => l.id) })
      });
      const parseData = await parseRes.json();
      if (parseData.error) throw new Error(parseData.error);
      const parsed = parseData.task;
      ws().tasks.push({ id: uid(), name: parsed.name || email.subject.replace(/\[task\]/gi,'').trim(),
        listId: ws().lists.find(l => l.id === parsed.listId) ? parsed.listId : ws().lists[0].id,
        status: 'To do', priority: ['High','Medium','Low'].includes(parsed.priority) ? parsed.priority : 'Medium',
        category: parsed.category || '', deadlineDate: parsed.deadlineDate || '', deadlineTime: '',
        doDate: parsed.doDate || '', doTime: '', recurrence: '', notes: parsed.notes || '',
        parentId: null, importedFromEmail: email.id });
    } catch(e) {
      ws().tasks.push({ id: uid(), name: email.subject.replace(/\[task\]/gi,'').trim(),
        listId: ws().lists[0].id, status: 'To do', priority: 'Medium',
        category: '', deadlineDate: '', deadlineTime: '', doDate: '', doTime: '',
        recurrence: '', notes: email.body || '', parentId: null });
    }
  }
  save(); closeGmailModal(); render();
}

function renderIdeaView() {

function renderTaskCards(tasks, listId) {

function renderSingleTaskCard(t, listId, sourceList) {
  const subs = getSubtasks(t.id);
  const doneSubs = subs.filter(s => s.status === 'Done').length;
  const expanded = expandedTasks.has(t.id);
  const over = isOverdue(t.deadlineDate, t.status);
  const progressPct = subs.length > 0 ? Math.round((doneSubs / subs.length) * 100) : 0;
  const list = sourceList || getList(t.listId);

  return `<div class="task-card${t.status==='Done'?' done':''}" id="tc-${t.id}"
    style="border-left: 4px solid ${list?.color || 'var(--gold)'}"
    draggable="true" ondragstart="dragStart(event,'${t.id}')" ondragover="dragOver(event,'${t.id}')" ondrop="dragDrop(event,'${t.id}','${listId||t.listId}')" ondragleave="dragLeave(event)" ondragend="dragEnd(event)">
    <div class="task-row" onclick="openTaskModal('${t.id}')" style="cursor:pointer">
      <span class="drag-handle" title="Drag to reorder">${ICONS.drag}</span>
      <div class="check-wrap" onclick="event.stopPropagation()"><div class="check${t.status==='Done'?' checked':''}" onclick="toggleDone('${t.id}')"></div></div>
      <div class="task-body">
        <div class="task-name${t.status==='Done'?' done':''}">${esc(t.name)}</div>
        ${t.notes ? `<div class="task-note">${esc(t.notes)}</div>` : ''}
        <div class="task-meta" style="margin-top:5px">
          ${t.deadlineDate ? `<span class="badge badge-due${over?' overdue':''}" style="display:inline-flex;align-items:center;gap:3px">${ICONS.clock} ${fmtDateTime(t.deadlineDate, t.deadlineTime)}${over?' · overdue':''}</span>` : ''}
          ${t.doDate ? `<span class="badge badge-dodate" style="display:inline-flex;align-items:center;gap:3px">${ICONS.calSmall} ${fmtDateTime(t.doDate, t.doTime)}</span>` : ''}
          ${t.recurrence ? `<span class="badge badge-recurring" style="display:inline-flex;align-items:center;gap:3px">${ICONS.repeat} ${t.recurrence}</span>` : ''}
          ${(ws().activeList === '__today__' || searchQuery) && list ? `<span class="badge badge-list">${esc(list.name)}</span>` : ''}
          ${subs.length > 0 ? `<span class="badge badge-status">${doneSubs}/${subs.length} subtasks</span>` : ''}
        </div>
        ${subs.length > 0 ? `<div class="progress-bar"><div class="progress-fill" style="width:${progressPct}%"></div></div>` : ''}
      </div>
      <div class="task-right" onclick="event.stopPropagation()">
        <button class="icon-btn" aria-label="${expanded ? 'Collapse' : 'Expand'}" onclick="toggleExpand('${t.id}')">${expanded ? ICONS.chevUp : ICONS.chevDown}</button>
        <button class="icon-btn" aria-label="Edit task" onclick="openTaskModal('${t.id}')">${ICONS.edit}</button>
        <button class="icon-btn danger" aria-label="Delete task" onclick="deleteTask('${t.id}')">${ICONS.trash}</button>
      </div>
    </div>
    ${expanded ? renderSubtasks(t.id, subs) : ''}
  </div>`;
}

function renderSubtasks(parentId, subs) {
  return `<div class="subtasks">
    ${subs.map(s => `<div class="subtask-row">
      <div class="check${s.status==='Done'?' checked':''}" onclick="toggleDone('${s.id}')" style="width:15px;height:15px;border-radius:4px;flex-shrink:0"></div>
      <span class="subtask-name${s.status==='Done'?' done':''}">${esc(s.name)}</span>
      <button class="icon-btn danger" style="width:22px;height:22px;font-size:12px" onclick="deleteTask('${s.id}')"><svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="1" y1="1" x2="10" y2="10"/><line x1="10" y1="1" x2="1" y2="10"/></svg></button>
    </div>`).join('')}
    <div class="subtask-add-wrap">
      <div style="color:var(--text-faint);font-size:13px">+</div>
      <input placeholder="Add subtask…" onkeydown="handleSubtaskAdd(event,'${parentId}')" />

  </div>`;
}

// ── Drag & Drop ──────────────────────────────────────────────────────
function initDrag() {}
function dragStart(e, id) {
  dragSrcId = id; e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => { const el = document.getElementById('tc-'+id); if(el) el.classList.add('dragging'); }, 0);
}
function dragOver(e, id) {
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  if (id === dragSrcId) return;
  document.querySelectorAll('.task-card.drag-over').forEach(el => el.classList.remove('drag-over'));
  const el = document.getElementById('tc-'+id); if(el) el.classList.add('drag-over');
}
function dragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
function dragDrop(e, targetId, listId) {
  e.preventDefault();
  if (!dragSrcId || dragSrcId === targetId) return;
  const cards = [...document.querySelectorAll('#task-sections .task-card')].map(el => el.id.replace('tc-',''));
  const srcIdx = cards.indexOf(dragSrcId), tgtIdx = cards.indexOf(targetId);
  if (srcIdx < 0 || tgtIdx < 0) return;
  cards.splice(srcIdx, 1); cards.splice(tgtIdx, 0, dragSrcId);
  ws().manualOrders[listId] = cards;
  save(); render();
}
function dragEnd(e) {
  document.querySelectorAll('.task-card').forEach(el => el.classList.remove('dragging','drag-over'));
  dragSrcId = null;
}
function resetOrder(listId) { delete ws().manualOrders[listId]; save(); render(); }

// ── Workspace switching ──────────────────────────────────────────────
function switchWorkspace(id) {
  workspaceSwitcherOpen = false;
  if (state.activeWorkspace === id) { renderWorkspaceSwitcher(); return; }
  state.activeWorkspace = id;
  searchQuery = '';
  const searchEl = document.getElementById('global-search'); if (searchEl) searchEl.value = '';

}

// ── Actions ──────────────────────────────────────────────────────────
function setActiveList(id) {
  ws().activeList = id;
  searchQuery = ''; document.getElementById('global-search').value = '';
  closeSidebar(); save(); render();
}
function toggleSidebar() {
  document.querySelector('.sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('visible');
}
function closeSidebar() {
  document.querySelector('.sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('visible');
}

function toggleDoneCollapsed(listId) {
  const cur = ws().completedCollapsed[listId];
  ws().completedCollapsed[listId] = (cur === false) ? true : false;
  save(); render();
}

function toggleDone(id) {
  const t = ws().tasks.find(x => x.id === id); if (!t) return;
  const wasDone = t.status === 'Done';
  t.status = wasDone ? 'To do' : 'Done';
  if (!wasDone) {
    t.completedAt = new Date().toISOString();
    if (t.recurrence && !t.parentId) {
      ws().tasks.push({ ...t, id: uid(), status: 'To do', completedAt: null,
        doDate: advanceDate(t.doDate, t.recurrence),
        deadlineDate: advanceDate(t.deadlineDate, t.recurrence) });
    }
  } else { t.completedAt = null; }
  save(); render();
}

function toggleExpand(id) {
  if (expandedTasks.has(id)) expandedTasks.delete(id); else expandedTasks.add(id);
  save(); render();
}

function deleteTask(id) {
  const task = ws().tasks.find(t => t.id === id);
  if (task?.calendarEventId) autoRemoveTask(task);
  ws().tasks = ws().tasks.filter(t => t.id !== id && t.parentId !== id);
  Object.keys(ws().manualOrders).forEach(listId => {
    ws().manualOrders[listId] = ws().manualOrders[listId].filter(tid => tid !== id);
  });
  save(); render();
}

function handleSubtaskAdd(e, parentId) {
  if (e.key !== 'Enter') return;
  const val = e.target.value.trim(); if (!val) return;
  const parent = ws().tasks.find(t => t.id === parentId);
  ws().tasks.push({ id: uid(), name: val, listId: parent.listId, status: 'To do', priority: 'Medium',
    category: '', deadlineDate: '', deadlineTime: '', doDate: '', doTime: '', recurrence: '', notes: '', parentId });
  expandedTasks.add(parentId); save(); render();
}

function saveTask() {
  const name = document.getElementById('tm-name').value.trim(); if (!name) return;
  const fields = {
    name,
    deadlineDate: document.getElementById('tm-deadline-date').value,
    deadlineTime: document.getElementById('tm-deadline-time').value,
    doDate: document.getElementById('tm-do-date').value,
    doTime: document.getElementById('tm-do-time').value,
    recurrence: document.getElementById('tm-recurrence').value,
    notes: document.getElementById('tm-notes').value.trim(),
    listId: document.getElementById('tm-list').value,
  };
  if (editingTaskId === null) {
    const newTask = { id: uid(), status: 'To do', priority: 'Medium', category: '', parentId: null, ...fields };
    ws().tasks.push(newTask);
    closeTaskModal(); save(); render();
    autoSyncTask(newTask);
    return;
  }
  const i = ws().tasks.findIndex(t => t.id === editingTaskId); if (i < 0) return;
  const updatedTask = { ...ws().tasks[i], ...fields };
  ws().tasks[i] = updatedTask;
  closeTaskModal(); save(); render();
  autoSyncTask(updatedTask);
}

// ── List Modal ───────────────────────────────────────────────────────
function renderColorPicker() {
  document.getElementById('lm-colors').innerHTML = LIST_COLORS.map(c =>
    `<div class="color-dot${pickedColor===c?' selected':''}" style="background:${c}" onclick="pickColor('${c}')"></div>`).join('');
}
function pickColor(c) { pickedColor = c; renderColorPicker(); }
function openNewListModal() {
  editingListId = null; pickedColor = LIST_COLORS[0];
  document.getElementById('list-modal-title').textContent = 'New list';
  document.getElementById('lm-name').value = '';
  document.getElementById('lm-delete-btn').style.display = 'none';
  renderColorPicker(); document.getElementById('list-modal').style.display = 'flex';
  setTimeout(() => document.getElementById('lm-name').focus(), 50);
}
function openEditListModal(id) {
  editingListId = id; const l = getList(id); pickedColor = l.color;
  document.getElementById('list-modal-title').textContent = 'Edit list';
  document.getElementById('lm-name').value = l.name;
  document.getElementById('lm-delete-btn').style.display = 'block';
  renderColorPicker(); document.getElementById('list-modal').style.display = 'flex';
  setTimeout(() => document.getElementById('lm-name').focus(), 50);
}
function deleteListFromModal() { closeListModal(); deleteList(editingListId); }
function closeListModal() { document.getElementById('list-modal').style.display = 'none'; }
function saveList() {
  const name = document.getElementById('lm-name').value.trim(); if (!name) return;
  if (editingListId) { const l = getList(editingListId); l.name = name; l.color = pickedColor; }
  else { ws().lists.push({ id: uid(), name, color: pickedColor }); }
  closeListModal(); save(); render();
}
function deleteList(id) {
  const list = getList(id);
  const taskCount = ws().tasks.filter(t => t.listId === id).length;
  if (!confirm(taskCount > 0 ? `Delete "${list.name}"? This will permanently delete ${taskCount} task${taskCount>1?'s':''}.` : `Delete "${list.name}"?`)) return;
  ws().tasks = ws().tasks.filter(t => t.listId !== id);
  ws().lists = ws().lists.filter(l => l.id !== id);
  delete ws().manualOrders[id];
  if (ws().activeList === id) ws().activeList = ws().lists[0]?.id || '';
  save(); render();
}

// ── Inline name editing ──────────────────────────────────────────────
let titleClickCount = 0, titleClickTimer = null;
function handleTitleClick(e, listId) {
  titleClickCount++;
  clearTimeout(titleClickTimer);
  titleClickTimer = setTimeout(() => {
    if (titleClickCount >= 3) startInlineTitleEdit(listId);
    titleClickCount = 0;
  }, 300);
}
let sidebarClicks = {}, sidebarTimers = {};
function handleSidebarListClick(e, listId) {
  sidebarClicks[listId] = (sidebarClicks[listId] || 0) + 1;
  clearTimeout(sidebarTimers[listId]);
  sidebarTimers[listId] = setTimeout(() => {
    const count = sidebarClicks[listId]; sidebarClicks[listId] = 0;
    if (count >= 3) startInlineSidebarEdit(listId); else setActiveList(listId);
  }, 300);
}
function startInlineTitleEdit(id) {
  const item = getList(id) || getIdea(id); if (!item) return;
  const display = document.getElementById('list-title-display'); if (!display) return;
  const input = document.createElement('input'); input.className = 'list-title-input'; input.value = item.name;
  display.replaceWith(input); input.focus(); input.select();
  const commit = () => { const v = input.value.trim(); if (v) { item.name = v; save(); } render(); };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => { if (e.key==='Enter') input.blur(); if (e.key==='Escape') { input.value=item.name; input.blur(); } });
}
function startInlineSidebarEdit(listId) {
  const list = getList(listId); const span = document.getElementById(`sidebar-list-name-${listId}`); if (!span) return;
  const input = document.createElement('input'); input.className = 'list-name-input'; input.value = list.name;
  span.replaceWith(input); input.focus(); input.select();
  const commit = () => {
    const v = input.value.trim(); if (v) { list.name = v; save(); }
    renderSidebar();
    const d = document.getElementById('list-title-display'); if (d) d.textContent = list.name;
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => { if (e.key==='Enter') input.blur(); if (e.key==='Escape') { input.value=list.name; input.blur(); } });
}

// ── Keyboard shortcuts ───────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeTaskModal(); closeListModal(); closeGmailModal(); collapseInlineAdd(); closeIdeaModal(); closeIdeaSpaceModal(); closeWorkspaceModal(); closeGoalModal(); closeRuleModal(); closeReflectionModal(); closePromptModal(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); expandInlineAdd(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
    e.preventDefault();
    if (document.getElementById('task-modal').style.display !== 'none') { saveTask(); return; }
    if (document.getElementById('list-modal').style.display !== 'none') { saveList(); return; }
    if (document.getElementById('workspace-modal').style.display !== 'none') { saveWorkspace(); return; }
    if (document.getElementById('idea-modal').style.display !== 'none') { saveIdea(); return; }
    if (document.getElementById('idea-space-modal').style.display !== 'none') { saveIdeaSpace(); return; }
    const el = document.getElementById('inline-add');
    if (el && el.classList.contains('expanded')) { submitInlineAdd(); return; }
  }
});

document.addEventListener('click', e => {
  const ctx = document.getElementById('ctx-menu');
  if (ctx) ctx.style.display = 'none';
  // Collapse inline-add when clicking outside it
  const ia = document.getElementById('inline-add');
  if (ia && ia.classList.contains('expanded') && !ia.contains(e.target)) {
    collapseInlineAdd();
  }
});
