// ── Rule of Life helpers ──────────────────────────────────────────────
function getWeekMonday(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDay();
  d.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
  return d.toISOString().slice(0, 10);
}

function getRulePeriodLabel(cadence) {
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const today = new Date(TODAY + 'T00:00:00');
  if (cadence === 'daily') {
    return `${DAYS[today.getDay()]} ${MONTHS[today.getMonth()]} ${today.getDate()}`;
  }
  if (cadence === 'weekly') {
    const mon = new Date(getWeekMonday(TODAY) + 'T00:00:00');
    const sat = new Date(mon); sat.setDate(mon.getDate() + 5);
    const fmt = d => `${MONTHS[d.getMonth()]} ${d.getDate()}`;
    return `${fmt(mon)} – ${fmt(sat)}`;
  }
  if (cadence === 'monthly') {
    return `${MONTHS[today.getMonth()]} ${today.getFullYear()}`;
  }
  if (cadence === 'quarterly') {
    const q = Math.floor(today.getMonth() / 3);
    const qStart = new Date(today.getFullYear(), q * 3, 1);
    const qEnd = new Date(today.getFullYear(), q * 3 + 3, 0);
    return `${MONTHS[qStart.getMonth()]} – ${MONTHS[qEnd.getMonth()]}`;
  }
  if (cadence === 'annually') return String(today.getFullYear());
  return '';
}

function getQuarterStart(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const qs = new Date(d.getFullYear(), Math.floor(d.getMonth() / 3) * 3, 1);
  return qs.toISOString().slice(0, 10);
}

function isRuleChecked(ruleId, cadence) {
  const checks = state.ruleChecks || [];
  const relevant = checks.filter(c => {
    if (c.ruleId !== ruleId) return false;
    if (cadence === 'daily') return c.date === TODAY;
    if (cadence === 'weekly') { const mon = getWeekMonday(TODAY); return c.date >= mon && c.date <= TODAY; }
    if (cadence === 'monthly') return c.date.startsWith(TODAY.slice(0, 7));
    if (cadence === 'quarterly') return c.date >= getQuarterStart(TODAY) && c.date <= TODAY;
    if (cadence === 'annually') return c.date.startsWith(TODAY.slice(0, 4));
    return false;
  });
  if (!relevant.length) return false;
  relevant.sort((a, b) => b.date.localeCompare(a.date));
  return relevant[0].completed !== false;
}

function toggleRuleCheck(ruleId) {
  const rule = (state.ruleItems || []).find(r => r.id === ruleId);
  if (!rule) return;
  if (!state.ruleChecks) state.ruleChecks = [];
  state.ruleChecks.push({ ruleId, date: TODAY, completed: !isRuleChecked(ruleId, rule.cadence) });
  save();
  renderRuleOfLifeView();
}

// ── Dashboard helpers ─────────────────────────────────────────────────
let dashWindow = 'year';

function getDashWindowStart() {
  if (dashWindow === 'year') {
    const yearStart = new Date().getFullYear() + '-01-01';
    return yearStart < FEATURE_START_DATE ? FEATURE_START_DATE : yearStart;
  }
  const d = new Date(TODAY + 'T00:00:00');
  d.setDate(d.getDate() - dashWindow + 1);
  return d.toISOString().slice(0, 10);
}

function getRuleStats(ruleId, cadence) {
  const windowStart = getDashWindowStart();
  const allChecked = (state.ruleChecks || []).filter(c => c.ruleId === ruleId && c.completed && c.date >= windowStart && c.date <= TODAY);
  let applicable = 0, completed = 0;

  if (cadence === 'daily') {
    const set = new Set(allChecked.map(c => c.date));
    const d = new Date(windowStart + 'T00:00:00'), end = new Date(TODAY + 'T00:00:00');
    while (d <= end) { applicable++; if (set.has(d.toISOString().slice(0,10))) completed++; d.setDate(d.getDate()+1); }
  } else if (cadence === 'weekly') {
    let mon = new Date(getWeekMonday(windowStart) + 'T00:00:00');
    const end = new Date(TODAY + 'T00:00:00');
    while (mon <= end) {
      const sat = new Date(mon); sat.setDate(mon.getDate()+6);
      const monS = mon.toISOString().slice(0,10), satS = sat.toISOString().slice(0,10);
      if (satS >= windowStart) { applicable++; if (allChecked.some(c => c.date >= monS && c.date <= satS)) completed++; }
      mon.setDate(mon.getDate()+7);
    }
  } else if (cadence === 'monthly') {
    const d = new Date(windowStart.slice(0,7)+'-01T00:00:00'), end = new Date(TODAY.slice(0,7)+'-01T00:00:00');
    while (d <= end) { const m = d.toISOString().slice(0,7); applicable++; if (allChecked.some(c=>c.date.startsWith(m))) completed++; d.setMonth(d.getMonth()+1); }
  } else if (cadence === 'quarterly') {
    let d = new Date(getQuarterStart(windowStart)+'T00:00:00');
    const end = new Date(TODAY+'T00:00:00');
    while (d <= end) {
      const qStart = d.toISOString().slice(0,10);
      const qEnd = new Date(d); qEnd.setMonth(qEnd.getMonth()+3); qEnd.setDate(qEnd.getDate()-1);
      const qEndStr = qEnd.toISOString().slice(0,10);
      if (qEndStr >= windowStart) { applicable++; if (allChecked.some(c=>c.date>=qStart&&c.date<=qEndStr)) completed++; }
      d.setMonth(d.getMonth()+3);
    }
  } else if (cadence === 'annually') {
    const sy = parseInt(windowStart.slice(0,4)), ey = parseInt(TODAY.slice(0,4));
    for (let y = sy; y <= ey; y++) { applicable++; if (allChecked.some(c=>c.date.startsWith(String(y)))) completed++; }
  }

  return { pct: applicable>0?Math.round(completed/applicable*100):0, completed, applicable, currentStreak: calcCurrentStreak(ruleId, cadence), longestStreak: calcLongestStreak(ruleId, cadence) };
}

function calcCurrentStreak(ruleId, cadence) {
  const allChecked = (state.ruleChecks||[]).filter(c=>c.ruleId===ruleId&&c.completed);
  if (!allChecked.length) return 0;
  let streak = 0;
  if (cadence === 'daily') {
    const set = new Set(allChecked.map(c=>c.date));
    const d = new Date(TODAY+'T00:00:00');
    while (set.has(d.toISOString().slice(0,10))) { streak++; d.setDate(d.getDate()-1); }
  } else if (cadence === 'weekly') {
    let mon = new Date(getWeekMonday(TODAY)+'T00:00:00');
    while (true) {
      const sat = new Date(mon); sat.setDate(mon.getDate()+6);
      if (!allChecked.some(c=>c.date>=mon.toISOString().slice(0,10)&&c.date<=sat.toISOString().slice(0,10))) break;
      streak++; mon.setDate(mon.getDate()-7);
    }
  } else if (cadence === 'monthly') {
    let d = new Date(TODAY.slice(0,7)+'-01T00:00:00');
    while (allChecked.some(c=>c.date.startsWith(d.toISOString().slice(0,7)))) { streak++; d.setMonth(d.getMonth()-1); }
  } else if (cadence === 'quarterly') {
    let d = new Date(getQuarterStart(TODAY)+'T00:00:00');
    while (true) {
      const qStart = d.toISOString().slice(0,10);
      const qEnd = new Date(d); qEnd.setMonth(qEnd.getMonth()+3); qEnd.setDate(qEnd.getDate()-1);
      if (!allChecked.some(c=>c.date>=qStart&&c.date<=qEnd.toISOString().slice(0,10))) break;
      streak++; d.setMonth(d.getMonth()-3);
    }
  } else if (cadence === 'annually') {
    let y = parseInt(TODAY.slice(0,4));
    while (allChecked.some(c=>c.date.startsWith(String(y)))) { streak++; y--; }
  }
  return streak;
}

function calcLongestStreak(ruleId, cadence) {
  const allChecked = (state.ruleChecks||[]).filter(c=>c.ruleId===ruleId&&c.completed);
  if (!allChecked.length) return 0;
  if (cadence !== 'daily') return calcCurrentStreak(ruleId, cadence);
  const dates = [...new Set(allChecked.map(c=>c.date))].sort();
  let best=0, cur=0, prev=null;
  for (const d of dates) {
    if (prev) { const p=new Date(prev+'T00:00:00'); p.setDate(p.getDate()+1); cur=p.toISOString().slice(0,10)===d?cur+1:1; }
    else cur=1;
    if (cur>best) best=cur;
    prev=d;
  }
  return best;
}

function renderHeatmapHtml(ruleId, cadence) {
  const windowStart = getDashWindowStart();
  const allChecked = (state.ruleChecks||[]).filter(c=>c.ruleId===ruleId&&c.completed);
  const days=[], d=new Date(windowStart+'T00:00:00'), end=new Date(TODAY+'T00:00:00');
  while (d<=end) { days.push(d.toISOString().slice(0,10)); d.setDate(d.getDate()+1); }
  return '<div class="heatmap">'+days.map(ds => {
    let done=false;
    if (cadence==='daily') done=allChecked.some(c=>c.date===ds);
    else if (cadence==='weekly') { const mon=getWeekMonday(ds); const sat=new Date(mon+'T00:00:00'); sat.setDate(sat.getDate()+6); done=allChecked.some(c=>c.date>=mon&&c.date<=sat.toISOString().slice(0,10)); }
    else if (cadence==='monthly') done=allChecked.some(c=>c.date.startsWith(ds.slice(0,7)));
    else if (cadence==='quarterly') { const qs=getQuarterStart(ds); const qe=new Date(qs+'T00:00:00'); qe.setMonth(qe.getMonth()+3); qe.setDate(qe.getDate()-1); done=allChecked.some(c=>c.date>=qs&&c.date<=qe.toISOString().slice(0,10)); }
    else if (cadence==='annually') done=allChecked.some(c=>c.date.startsWith(ds.slice(0,4)));
    return `<div class="hm-cell${done?' done':''}" title="${ds}"></div>`;
  }).join('')+'</div>';
}

// ── Prompt helper ─────────────────────────────────────────────────────
function getTodayPrompt() {
  const prompts = state.prompts || [];
  if (!prompts.length) return null;
  const epoch = new Date('2026-01-01T00:00:00');
  const days = Math.floor((new Date(TODAY+'T00:00:00') - epoch) / 86400000);
  return prompts[((days % prompts.length) + prompts.length) % prompts.length];
}

// ── Render: Rule of Life ──────────────────────────────────────────────
let ruleShowAll = true;

function renderRuleOfLifeView() {
  const items = state.ruleItems || [];
  const CADENCE_ORDER = ['daily','weekly','monthly','annually'];
  const displayed = ruleShowAll ? items : items.filter(r => !isRuleChecked(r.id, r.cadence));
  const categories = [...new Set(items.map(r => r.category||'Other'))].sort();

  const sections = categories.map(cat => {
    const catItems = displayed.filter(r=>(r.category||'Other')===cat)
      .sort((a,b)=>CADENCE_ORDER.indexOf(a.cadence)-CADENCE_ORDER.indexOf(b.cadence));
    if (!catItems.length) return '';
    return `<div class="rule-category">
      <div class="rule-category-header">${esc(cat)}</div>
      ${catItems.map(r => {
        const checked = isRuleChecked(r.id, r.cadence);
        const periodLabel = r.customPeriod || getRulePeriodLabel(r.cadence);
        return `<div class="rule-item">
          <div class="check${checked?' checked':''}" onclick="toggleRuleCheck('${r.id}')" style="flex-shrink:0"></div>
          <div style="display:flex;flex-direction:column;gap:3px;flex-shrink:0;align-items:flex-start">
            <span class="rule-cadence ${r.cadence}">${r.cadence}</span>
            <span style="font-size:10px;color:var(--text-faint);white-space:nowrap;padding:0 2px">${esc(periodLabel)}</span>
          </div>
          <span class="rule-text" style="${checked?'text-decoration:line-through;color:var(--text-muted)':''}">${esc(r.text)}</span>
          <button class="icon-btn rule-edit-btn" onclick="openEditRuleModal('${r.id}')">${ICONS.edit}</button>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');

  document.getElementById('content').innerHTML = `
    <div class="list-header">
      <span class="list-title">Rule of Life</span>
      <div class="spacer"></div>
      <button class="btn btn-ghost btn-sm" onclick="toggleRuleShowAll()" style="margin-right:6px">${ruleShowAll?'Due only':'Show all'}</button>
      <button class="btn btn-ghost btn-sm" onclick="openNewRuleModal()">＋ Add</button>
    </div>
    ${items.length===0?`<div class="empty"><div class="empty-icon">${ICONS.emptyCross}</div><div class="empty-title">No commitments yet</div><div class="empty-sub">Add your first Rule of Life item</div><button class="empty-cta" onclick="openNewRuleModal()">+ Add commitment</button></div>`:
      (sections||`<div style="font-size:13px;color:var(--text-faint);text-align:center;padding:32px 0">All done for now 🎉</div>`)}
  `;
}

function toggleRuleShowAll() { ruleShowAll = !ruleShowAll; renderRuleOfLifeView(); }

// ── Render: Reflection ────────────────────────────────────────────────
let showPromptsSection = false;
const MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAY_ABBR = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function renderReflectionView() {
  const reflections = (state.reflections||[]).sort((a,b)=>b.date.localeCompare(a.date));
  const todayEntry = reflections.find(r=>r.date===TODAY);

  function fmtReflDate(d) {
    const dt = new Date(d+'T00:00:00');
    if (d===TODAY) return 'Today';
    return `${DAY_ABBR[dt.getDay()]} ${MONTH_ABBR[dt.getMonth()]} ${dt.getDate()}, ${dt.getFullYear()}`;
  }

  document.getElementById('content').innerHTML = `
    <div class="list-header">
      <span class="list-title">Daily Reflection</span>
      <div class="spacer"></div>
      ${!todayEntry?`<button class="btn btn-primary btn-sm" onclick="openNewReflectionModal()">+ Today</button>`:''}
      <button class="btn btn-ghost btn-sm" onclick="openNewReflectionModal()" style="margin-left:6px">+ Entry</button>
    </div>
    ${reflections.length===0?`<div class="empty"><div class="empty-icon">${ICONS.emptyBook}</div><div class="empty-title">No reflections yet</div><div class="empty-sub">Record your first daily reflection above</div></div>`:
      reflections.map(r=>{
        const dots=r.energy?Array.from({length:5},(_,i)=>`<div class="energy-dot${i<r.energy?' lit':''}"></div>`).join(''):'';
        const excerpt=r.wentWell||r.freeText||'';
        return `<div class="reflection-card" onclick="openEditReflectionModal('${r.id}')">
          <div class="reflection-card-date">
            <span>${esc(fmtReflDate(r.date))}</span>
            ${r.energy?`<div class="energy-dots">${dots}</div>`:''}
          </div>
          ${r.wentWell?`<div style="font-size:13px;font-weight:500;margin-bottom:3px">${esc(r.wentWell)}</div>`:''}
          ${excerpt?`<div class="reflection-card-excerpt">${esc(excerpt)}</div>`:''}
        </div>`;
      }).join('')}
    <div class="prompts-toggle" onclick="togglePromptsSection()">
      ${showPromptsSection?ICONS.chevDown:ICONS.chevRight} Reflection prompts (${(state.prompts||[]).length})
    </div>
    ${showPromptsSection?renderPromptsManagement():''}
  `;
}

function togglePromptsSection() { showPromptsSection = !showPromptsSection; renderReflectionView(); }

function renderPromptsManagement() {
  const prompts = state.prompts||[];
  const goals = state.goals||{};
  const allGoals = [...(goals.personal||[]).map(g=>({...g,group:'Personal'})),...(goals.professional||[]).map(g=>({...g,group:'Professional'}))];
  const goalMap = Object.fromEntries(allGoals.map(g=>[g.id,g]));
  return `<div>
    ${prompts.map(p=>`<div class="prompt-item">
      <div style="flex:1">
        <div class="prompt-item-text">${esc(p.text)}</div>
        ${p.goalId&&goalMap[p.goalId]?`<div class="prompt-item-goal">→ ${esc(goalMap[p.goalId].text.slice(0,60))}</div>`:''}
      </div>
      <button class="icon-btn prompt-edit-btn" onclick="openEditPromptModal('${p.id}')">${ICONS.edit}</button>
    </div>`).join('')}
    <button class="btn btn-ghost btn-sm" onclick="openNewPromptModal()" style="margin-top:6px">＋ Add prompt</button>
  </div>`;
}

// ── Render: Progress ring ─────────────────────────────────────────────
function renderRingHtml(pct, size) {
  size = size || 72;
  const sw = 7, r = (size - sw) / 2;
  const circ = +(2 * Math.PI * r).toFixed(1);
  const offset = +((1 - Math.min(pct, 100) / 100) * circ).toFixed(1);
  const c = size / 2;
  const fs = size >= 80 ? 18 : 14;
  return `<div style="position:relative;width:${size}px;height:${size}px;flex-shrink:0">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
      <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#E1D8C2" stroke-width="${sw}"/>
      <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#16233D" stroke-width="${sw}"
        stroke-dasharray="${circ}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
    </svg>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Lora',Georgia,serif;font-weight:700;font-size:${fs}px;color:var(--accent);line-height:1">${pct}%</div>
  </div>`;
}

function renderDashboardView() {
  const items = state.ruleItems||[];
  const goals = state.goals||{personal:[],professional:[]};
  const reflections = state.reflections||[];
  const CADENCE_ORDER = ['daily','weekly','monthly','annually'];
  const categories = [...new Set(items.map(r=>r.category||'Other'))].sort();

  const ruleSections = categories.length===0

        const catStats = catItems.map(r=>getRuleStats(r.id,r.cadence));
        const catAvg = catStats.length?Math.round(catStats.reduce((s,x)=>s+x.pct,0)/catStats.length):0;
        return `<div class="dash-category-block">
          <div class="dash-category-header">

          </div>
          ${catItems.map((r,i)=>{
            const s=catStats[i];
            return `<div class="dash-rule-row">
              <div style="display:flex;align-items:center;gap:14px">
                ${renderRingHtml(s.pct)}
                <div style="flex:1;min-width:0">
                  <div class="dash-rule-name" style="margin-bottom:5px">${esc(r.text)}</div>

                  </div>

            </div>`;
          }).join('')}

      }).join('');

  const allGoals = [...(goals.personal||[]).map(g=>({...g,group:'Personal'})),...(goals.professional||[]).map(g=>({...g,group:'Professional'}))];
  const goalsSec = allGoals.length===0?'':
    `<div style="margin-top:32px">
      <div class="goals-group-label" style="color:var(--accent);font-size:12px">Goals &amp; Reflections</div>
      ${allGoals.map(g=>{
        const linked = reflections.filter(r=>r.goalId===g.id).sort((a,b)=>b.date.localeCompare(a.date));
        return `<div class="dash-goal-block">
          <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin-bottom:4px">${g.group}</div>
          <div class="dash-goal-text">${esc(g.text)}</div>
          ${linked.length===0?`<div style="font-size:12px;color:var(--text-faint)">No linked reflections yet</div>`:
            linked.slice(0,5).map(r=>`<div class="dash-refl-entry">
              <div class="dash-refl-text">${esc(r.freeText||r.wentWell||'')}</div>
              <div class="dash-refl-date">${new Date(r.date+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</div>
            </div>`).join('')}
          ${linked.length>5?`<div style="font-size:12px;color:var(--text-muted);margin-top:6px">+ ${linked.length-5} more</div>`:''}

  document.getElementById('content').innerHTML = `

      <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin-bottom:12px">Data Recovery</div>
      <div id="backup-status" style="font-size:13px;color:var(--text-muted);margin-bottom:10px">Check if a cloud backup is available to restore.</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn" onclick="checkBackup()" style="font-size:12px">Check backup</button>
        <button class="btn btn-danger" id="restore-btn" onclick="restoreBackup()" style="font-size:12px;display:none">Restore backup</button>
      </div>
    </div>
  `;
}

async function checkBackup() {
  const el = document.getElementById('backup-status');
  el.textContent = 'Checking…';
  try {
    const res = await fetch('/api/sync', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ action: 'peek_backup' })
    });
    const d = await res.json();
    const b = d.backup;
    const m = d.main;
    const mainSummary = m
      ? `Current: ${m.ruleItemsCount} rule items, ${m.reflectionsCount} reflections, ${m.goalsPersonal + m.goalsProfessional} goals`
      : 'Current: empty';
    if (!b) {
      el.innerHTML = `${mainSummary}<br><span style="color:var(--text-faint)">No backup found in cloud storage.</span>`;
    } else {
      const backupSummary = `Backup: ${b.ruleItemsCount} rule items, ${b.reflectionsCount} reflections, ${b.goalsPersonal + b.goalsProfessional} goals, ${b.ruleChecksCount} check-ins`;
      el.innerHTML = `${mainSummary}<br><span style="color:${b.ruleItemsCount > 0 || b.reflectionsCount > 0 ? '#16233D' : 'var(--text-faint)'}">${backupSummary}</span>`;
      if (b.ruleItemsCount > 0 || b.reflectionsCount > 0 || b.goalsPersonal > 0) {
        document.getElementById('restore-btn').style.display = '';
      }
    }
  } catch(e) {
    el.textContent = 'Error checking backup: ' + e.message;
  }
}

async function restoreBackup() {
  if (!confirm('Restore the backup? This will replace your current cloud data with the backup. Your current state will be saved as a pre-restore backup.')) return;
  const el = document.getElementById('backup-status');
  el.textContent = 'Restoring…';
  try {
    const res = await fetch('/api/sync', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ action: 'restore_backup' })
    });
    const d = await res.json();
    if (d.ok) {
      el.textContent = 'Restored! Reloading data…';
      document.getElementById('restore-btn').style.display = 'none';
      await load();
    } else {
      el.textContent = 'Restore failed: ' + (d.error || 'unknown error');
    }
  } catch(e) {
    el.textContent = 'Error restoring: ' + e.message;
  }
}

// ── Calendar auto-sync helpers ────────────────────────────────────────
async function autoSyncTask(task) {
  const wsId = state.activeWorkspace;
  if (!SYNC_WORKSPACES.includes(wsId)) return;
  if (!calendarConnected[wsId]) return;
  if (!task.doDate && !task.deadlineDate) return;
  if (task.status === 'Done') return;
  try {
    const res = await fetch('/api/calendar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'sync', workspaceId: wsId, tasks: [task] })
    });
    const data = await res.json();
    if (data.tasks && data.tasks[0]) {
      const updated = data.tasks[0];
      const idx = ws().tasks.findIndex(t => t.id === updated.id);
      if (idx >= 0) { ws().tasks[idx] = updated; save(); }
    }
  } catch(e) { showCalendarToast('⚠️ Calendar sync failed — check connection.'); }
}

async function autoRemoveTask(task) {
  if (!task.calendarEventId) return;
  const wsId = state.activeWorkspace;
  if (!calendarConnected[wsId]) return;
  try {
    await fetch('/api/calendar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'delete', workspaceId: wsId, eventId: task.calendarEventId })
    });
  } catch(e) {}
}

// ── Google Calendar Sync ─────────────────────────────────────────────
async function handleCalendarSync() {
  const wsId = state.activeWorkspace;
  if (!calendarConnected[wsId]) {
    await connectGoogleCalendar(wsId);
  } else {
    await runCalendarSync(wsId);
  }
}

async function connectGoogleCalendar(wsId) {
  const btn = document.getElementById('cal-sync-btn');
  if (btn) { btn.textContent = 'Connecting…'; btn.disabled = true; }

  try {
    const res = await fetch('/api/calendar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'auth_url', workspaceId: wsId, origin: window.location.origin })
    });
    const { url } = await res.json();
    const popup = window.open(url, 'google_calendar_auth', 'width=500,height=620');
    if (!popup) { alert('Please allow popups for this site, then try again.'); return; }

    window.addEventListener('message', async (e) => {
      if (typeof e.data === 'string' && e.data.startsWith('calendar_authed:')) {
        const connectedWsId = e.data.split(':')[1];
        popup && popup.close();
        calendarConnected[connectedWsId] = true;
        await runCalendarSync(connectedWsId);
      } else if (e.data === 'calendar_auth_error') {
        popup && popup.close();
        alert('Google Calendar connection failed. Please try again.');
        if (btn) { btn.innerHTML = ICONS.calendar + ' Connect Calendar'; btn.disabled = false; }
      }
    }, { once: true });
  } catch(e) {
    alert('Could not reach the server. Try again.');
    if (btn) { btn.disabled = false; }
  }
}

async function runCalendarSync(wsId) {
  const btn = document.getElementById('cal-sync-btn');
  if (btn) { btn.innerHTML = ICONS.calendar + ' Syncing…'; btn.disabled = true; }

  const tasks = state.workspaces[wsId].tasks.filter(t =>
    !t.parentId && t.status !== 'Done' && (t.doDate || t.deadlineDate)
  );

  if (tasks.length === 0) {
    showCalendarToast('No tasks with dates to sync.');
    if (btn) { btn.innerHTML = ICONS.calendar + ' Sync Calendar'; btn.disabled = false; }
    return;
  }

  try {
    const res = await fetch('/api/calendar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'sync', workspaceId: wsId, tasks })
    });

    if (res.status === 401) {
      calendarConnected[wsId] = false;
      if (btn) { btn.innerHTML = ICONS.calendar + ' Connect Calendar'; btn.disabled = false; }
      alert('Calendar session expired. Please reconnect.');
      return;
    }

    const data = await res.json();

    if (data.tasks) {
      data.tasks.forEach(updated => {
        const idx = state.workspaces[wsId].tasks.findIndex(t => t.id === updated.id);
        if (idx >= 0) state.workspaces[wsId].tasks[idx] = updated;
      });
      save();
    }

    const msg = [
      data.created > 0 ? `${data.created} created` : '',
      data.updated > 0 ? `${data.updated} updated` : '',
      data.errors > 0 ? `${data.errors} failed` : '',
    ].filter(Boolean).join(', ');
    showCalendarToast(`Calendar synced: ${msg || 'nothing to do'}`);
  } catch(e) {
    showCalendarToast('Sync failed — check your connection.');
  } finally {
    if (btn) { btn.innerHTML = ICONS.calendar + ' Sync Calendar'; btn.disabled = false; }
  }
}

function showCalendarToast(msg) {
  let toast = document.getElementById('cal-toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'cal-toast';
    toast.style.cssText = 'position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#16233D;color:white;padding:10px 18px;border-radius:24px;font-size:13px;font-weight:500;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,0.25);pointer-events:none;transition:opacity 0.3s;font-family:var(--font-body)';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.opacity = '1';
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => { toast.style.opacity = '0'; }, 3500);
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').then(reg => {
      // When app comes to foreground: check for new code AND refresh data from cloud
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState !== 'visible') return;
        reg.update();
        // Skip data refresh if user has a modal open or is typing a new task
        const modalOpen = [...document.querySelectorAll('.modal')].some(m => m.style.display === 'flex');
        const inlineOpen = document.getElementById('inline-add')?.classList.contains('expanded');
        if (!modalOpen && !inlineOpen) load();
      });
    }).catch(err => {
      console.warn('SW registration failed:', err);
    });

    // When a new service worker takes control, reload once to get fresh code
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
  });
}
</script>
</body>
</html>
