<style>
  body { background: var(--paper); min-height: 100%; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 20px 120px; }
  header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 18px 4px 22px; border-bottom: 1px solid var(--line); }

    .card { padding: 16px; }
    .pgrid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .pc .row { grid-template-columns: 1fr; }
  }

  .trips-nav { display: flex; flex-direction: column; gap: 8px; }
  .trips-nav button.t { text-align: left; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line-soft); background: rgba(255,255,255,0.45); cursor: pointer; display: grid; grid-template-columns: 4px 1fr; gap: 12px; }
  .trips-nav button.t i { border-radius: 3px; background: var(--c); }
  .trips-nav button.t b { display: block; font: 500 19px/1.15 var(--font-display); }
  .trips-nav button.t span { font: 500 9.5px var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); }
  .trips-nav button.t.on { background: var(--surface); border-color: var(--gold); box-shadow: 0 8px 24px -14px rgba(22,35,61,0.4); }

  input[type=text], input[type=date], input[type=search], select, textarea {

  }

  .swatches button.on { box-shadow: 0 0 0 2px var(--ink); }

  .editor { display: flex; flex-direction: column-reverse; gap: 18px; }

  .pickbar { position: absolute; left: 12px; right: 12px; top: 12px; z-index: 2; background: var(--ink); color: var(--paper); border-radius: 12px; padding: 10px 14px; font-size: 13px; display: none; justify-content: space-between; align-items: center; gap: 10px; }

  .day { border: 1px solid var(--line-soft); border-radius: 16px; padding: 14px; margin-bottom: 12px; background: rgba(255,255,255,0.5); }
  .day-head { display: grid; grid-template-columns: 50px 170px 170px 1fr auto; gap: 10px; align-items: end; }

  @media (max-width: 760px) { .day-head { grid-template-columns: 1fr 1fr; } }
  .day-n { font: 500 30px/1 var(--font-display); }
  .stop { display: grid; grid-template-columns: 26px 110px 1fr 1fr 120px auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px dashed var(--line-soft); }
  .stop .loc { font: 500 9.5px var(--font-mono); letter-spacing: 0.08em; color: var(--ink-soft); }
  .stop .loc.missing { color: #9A4E3E; }
  .stop-more { grid-column: 2 / -1; display: grid; grid-template-columns: 1fr 1fr 1.6fr auto; gap: 8px; }
  @media (max-width: 760px) {
    /* phone: name on top, then type, location search, coordinates + actions, then details */
    .stop { grid-template-columns: 26px 1fr 1fr; row-gap: 8px; padding: 12px 0; }
    .stop > .dot { grid-column: 1; grid-row: 1; }
    .stop > [data-sk="name"] { grid-column: 2 / 4; grid-row: 1; }
    .stop > [data-sk="kind"] { grid-column: 2; grid-row: 2; }
    .stop > .search-pop { grid-column: 3; grid-row: 2; }
    .stop > .loc { grid-column: 2; grid-row: 3; }
    .stop > .acts { grid-column: 3; grid-row: 3; justify-content: flex-end; }
    .stop-more { grid-column: 2 / 4; grid-row: 4; grid-template-columns: 1fr 1fr; grid-auto-flow: dense; }
    .stop-more > [data-sk="area"], .stop-more > [data-sk="note"] { grid-column: 1 / -1; }
    .stop-more > div { grid-column: 2; flex-wrap: wrap; }
    .stop-more select { flex: 1; }
  }
  .stop .dot { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 600 13px var(--font-display); background: var(--surface); border: 1.5px solid var(--ink); }
  .stop .dot.stay { background: var(--ink); color: var(--paper); }
  .stop .dot.none { border-style: dashed; border-color: var(--ink-faint); color: var(--ink-faint); }
  .acts { display: flex; gap: 4px; }
  .ib { width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--line-soft); background: #fff; display: grid; place-items: center; cursor: pointer; font-size: 14px; color: var(--ink-soft); }
  .ib:hover { color: var(--ink); border-color: var(--line); }
  .ib.on { background: var(--ink); color: var(--paper); }
  .search-pop { position: relative; }
  .results { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 4px); background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .results button { display: block; width: 100%; text-align: left; padding: 10px 12px; border: 0; background: #fff; cursor: pointer; border-bottom: 1px solid var(--line-soft); font-size: 14px; }
  .results button small { display: block; color: var(--ink-soft); font-size: 12px; }
  .results button:hover { background: var(--paper-2); }

  .savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); background: rgba(250,247,240,0.9); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--line); display: flex; justify-content: center; gap: 12px; align-items: center; transform: translateY(110%); transition: transform 0.35s var(--ease-out); }
  .savebar.on { transform: none; }
  .savebar .msg { font-size: 14px; color: var(--ink-soft); }

  .drop.over { background: rgba(185,154,108,0.12); border-color: var(--ink); }
  .drop b { display: block; font: 500 28px var(--font-display); margin-bottom: 6px; }

  .queue { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
  .qrow { display: grid; grid-template-columns: 1fr 160px auto; gap: 12px; align-items: center; font-size: 13px; padding: 8px 12px; border-radius: 10px; background: rgba(255,255,255,0.6); }
  .qrow .bar { height: 4px; border-radius: 3px; background: var(--line-soft); overflow: hidden; }
  .qrow .bar i { display: block; height: 100%; background: var(--ink); width: 0; transition: width 0.3s; }
  .qrow .st { font: 500 9.5px var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); }
  .qrow.err .st { color: #9A3E3E; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin: 22px 0 12px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button { border: 0; background: transparent; padding: 8px 14px; font: 500 10px var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; color: var(--ink-soft); }
  .seg button.on { background: var(--ink); color: var(--paper); }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .pc { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
  .pc.sel { outline: 2px solid var(--ink); }
  .pc .im { position: relative; aspect-ratio: 4/3; background: #E3DACA; }
  .pc .im img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pc .im .tag { position: absolute; left: 8px; top: 8px; font: 500 9px var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; padding: 4px 8px; border-radius: 6px; background: rgba(250,247,240,0.92); }
  .pc .im .tag.warn { background: #9A4E3E; color: #fff; }
  .pc .im .ck { position: absolute; right: 8px; top: 8px; width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; background: rgba(22,35,61,0.35); cursor: pointer; display: grid; place-items: center; color: #fff; font-size: 13px; }
  .pc.sel .im .ck { background: var(--ink); }

  .pc .row { display: grid; grid-template-columns: 1fr 1.4fr; gap: 6px; }
  .pc .acts { justify-content: space-between; align-items: center; }
  .pc .fn { font: 400 11px var(--font-mono); color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bulk { position: sticky; top: 8px; z-index: 30; display: none; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 14px; background: var(--ink); color: var(--paper); margin-bottom: 12px; flex-wrap: wrap; }
  .bulk.on { display: flex; }
  .bulk select { width: auto; font-size: 13px; padding: 6px 8px; }
  .bulk .btn { height: 32px; background: transparent; color: var(--paper); border-color: rgba(239,234,224,0.35); }
  .toast { position: fixed; left: 50%; top: 18px; transform: translate(-50%, calc(-100% - 40px)); z-index: 100; background: var(--ink); color: var(--paper); padding: 12px 18px; border-radius: 12px; font-size: 14px; box-shadow: var(--shadow); transition: transform 0.35s var(--ease-out); }
  .toast.on { transform: translate(-50%, 0); }
  .ro-note { padding: 12px 16px; border-radius: 12px; background: rgba(185,154,108,0.14); color: var(--ink-2); font-size: 14px; margin-bottom: 14px; }
  body.read-only #pane input, body.read-only #pane select, body.read-only #pane textarea { pointer-events: none; background: transparent; }
  body.read-only #pane .acts, body.read-only #pane .drop, body.read-only #pane [data-addstop], body.read-only #pane #add-day,
  body.read-only #pane .ck, body.read-only #pane #sel-all, body.read-only #pane .add-ph, body.read-only #pane .chips button:not(.on), body.read-only #pane .who-pick button:not(.on), body.read-only .savebar { display: none !important; }
  .who-pick { display: flex; flex-wrap: wrap; gap: 8px; }
  .wp { display: inline-flex; align-items: center; gap: 8px; padding: 5px 14px 5px 5px; border-radius: 999px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 14px; color: var(--ink-soft); }
  .wp.on { border-color: var(--ink); background: var(--ink); color: var(--paper); }
  .wp:disabled { opacity: 0.45; cursor: default; }
  .me-btn { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,0.6); cursor: pointer; font: 500 13px var(--font-body); color: var(--ink); }
  .me-btn[hidden] { display: none; }
  .profile-top { display: flex; gap: 20px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .profile-photo { display: flex; flex-direction: column; align-items: center; gap: 8px; border: 0; background: none; cursor: pointer; font: 500 10px var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); }
  .people-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .pl { display: flex; gap: 10px; align-items: center; }
  .pl b { display: block; font: 500 18px var(--font-display); }
  .pl span { font-size: 12px; color: var(--ink-soft); }
  .empty { padding: 26px; text-align: center; color: var(--ink-soft); border: 1px dashed var(--line); border-radius: 16px; }
  details summary { cursor: pointer; font: 500 10.5px var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); }
  .mk { width: 22px; height: 22px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--ink); display: grid; place-items: center; font: 600 12px var(--font-display); cursor: grab; box-shadow: 0 4px 10px -4px rgba(0,0,0,0.4); }
  .mk.stay { background: var(--ink); color: var(--paper); }
  .mk.home { background: var(--gold); border-color: #fff; color: #fff; }
  /* ── Steps ─────────────────────────────────────────────────────────────── */
  .tabs.steps button { display: inline-flex; align-items: center; gap: 8px; }
  .tabs.steps i { font-style: normal; width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; border: 1px solid currentColor; font-size: 10px; letter-spacing: 0; }
  .tabs.steps button.on i { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .next-row { display: flex; justify-content: flex-end; align-items: center; gap: 16px; margin: 18px 0 8px; }
  .linkbtn { margin-right: auto; border: 0; background: none; padding: 6px 0; cursor: pointer; font: 500 13px var(--font-body); color: #9A3E3E; text-decoration: underline; text-underline-offset: 3px; }

  /* ── Itinerary days and stops ─────────────────────────────────────────── */
  .day { display: flex; flex-direction: column; gap: 10px; padding: 18px; }
  .day-top { display: flex; align-items: baseline; gap: 12px; }
  .day-top b { font: 500 26px/1 var(--font-display); }
  .day-top span { font: 500 10px var(--font-mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold-deep); }
  .day-title { font-size: 16px !important; font-weight: 500 !important; }
  .stops { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .stop2 { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 14px; background: #fff; border: 1px solid var(--line-soft); }
  .s-top { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center; }
  .s-n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 600 13px var(--font-display); border: 1.5px solid var(--ink); }

  @media (max-width: 640px) {
    .opt { grid-template-columns: 1fr; gap: 4px; }
    .chips { flex-wrap: wrap !important; overflow: visible; border-radius: 16px; }
    .chips button { padding: 6px 10px; font-size: 12.5px; }
  }
  .chips { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 3px; border-radius: 999px; background: var(--paper-2); border: 1px solid var(--line-soft); }
  .chips button { border: 0; background: none; padding: 6px 11px; border-radius: 999px; cursor: pointer; font: 500 12.5px var(--font-body); color: var(--ink-soft); }
  .chips button.on { background: var(--ink); color: var(--paper); }

  /* ── Photos by day and stop ───────────────────────────────────────────── */

  .pday-h b { font: 500 22px var(--font-display); }

  .pstop { padding: 10px 12px; border-radius: 14px; margin-bottom: 8px; background: rgba(255,255,255,0.5); border: 1px solid transparent; transition: border-color 0.2s, background 0.2s; }
  .pstop.over { border-color: var(--ink); background: rgba(185,154,108,0.12); }
  .pstop.other .pstop-h b { font-size: 15px; color: var(--ink-soft); }
  .pstop-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .pstop-h b { display: block; font: 500 18px var(--font-display); }
  .pstop-h span { font-size: 12px; color: var(--ink-soft); }
  .add-ph { flex: 0 0 auto; }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; margin-top: 10px; }
  .th { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; cursor: pointer; background: #E3DACA; }
  .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .th.hid img { opacity: 0.35; }
  .th.sel { outline: 3px solid var(--ink); outline-offset: -3px; }
  .th .ck { position: absolute; right: 5px; top: 5px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; background: rgba(22,35,61,0.35); color: #fff; font-size: 11px; cursor: pointer; display: grid; place-items: center; padding: 0; }
  .th.sel .ck { background: var(--ink); }

  .th .cov { position: absolute; left: 5px; bottom: 5px; font: 500 8.5px var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; background: rgba(250,247,240,0.92); padding: 3px 6px; border-radius: 5px; }
  .pmodal { position: fixed; inset: 0; z-index: 80; background: rgba(15,24,40,0.55); display: grid; place-items: center; padding: 16px; }
  .pm-card { position: relative; width: min(820px, 100%); max-height: 92vh; overflow: auto; background: var(--surface); border-radius: 20px; display: grid; grid-template-columns: 1.1fr 1fr; box-shadow: var(--shadow); }
  .pm-img { background: #0F1828; display: grid; place-items: center; min-height: 260px; }
  .pm-img img { max-width: 100%; max-height: 70vh; display: block; }
  .pm-body { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .pm-acts { display: flex; flex-wrap: wrap; gap: 6px; }
  .pm-x { position: absolute; right: 10px; top: 10px; z-index: 2; }
  .fn { font: 400 11px var(--font-mono); color: var(--ink-faint); }
  @media (max-width: 640px) {
    header.top { flex-direction: column; align-items: flex-start; gap: 10px; }
    header.top > div:last-child { width: 100%; justify-content: space-between; }
    .pm-card { grid-template-columns: 1fr; }
    .pm-img img { max-height: 40vh; }
    .tabs.steps button { margin-right: 4px; }
  }
  /* Home-screen app on a phone: stay clear of the status bar / Dynamic Island. */
  @media (max-width: 760px) and (display-mode: standalone), (max-width: 760px) and (display-mode: fullscreen) {
    .wrap { padding-top: max(60px, calc(env(safe-area-inset-top) + 6px)); }
  }
  @media (max-width: 760px) { html.standalone .wrap { padding-top: max(60px, calc(env(safe-area-inset-top) + 6px)); } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><div class="kicker" id="fam"></div><h1>Travel Map admin</h1></div>
    <div style="display:flex;gap:16px;align-items:center"><a href="/" id="view-link">View on the map →</a><button class="me-btn" id="me-btn" hidden></button></div>
  </header>
  <div class="layout">
    <aside>
      <div class="trips-nav" id="trips-nav"></div>
      <button class="btn" style="margin-top:12px;width:100%" id="new-trip">+ New journey</button>
      <button class="btn ghost" style="margin-top:8px;width:100%" id="profile-btn">Your profile</button>
    </aside>
    <main id="main"><div class="empty">Loading…</div></main>
  </div>
</div>
<div class="savebar" id="savebar"><span class="msg" id="save-msg">Unsaved changes</span><button class="btn ghost" id="discard">Discard</button><button class="btn dark" id="save">Save journey</button></div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="image/*,.heic,.heif" multiple hidden>

<script>if (navigator.standalone) document.documentElement.classList.add("standalone");</script>
<script src="/trips/vendor/maplibre-gl-5.24.1.js"></script>
<script src="/trips/vendor/exifr-lite-7.1.3.js"></script>
<script src="/trips/atlas.js"></script>
<script>
(() => {
  const A = window.Atlas;
  const { esc } = A;
  const $ = (id) => document.getElementById(id);
  const KINDS = [["visit", "Visit"], ["activity", "Activity"], ["food", "Food"], ["stay", "Overnight"], ["airport", "Airport"], ["home", "Home"]];
  const TRAVEL = [["drive", "Drove here"], ["fly", "Flew here"], ["skip", "Side trip (no line)"], ["start", "Start here (no line)"]];
  const travelOf = (s) => s.travel || (s.route === false ? "skip" : "drive");
  const uid = () => Math.random().toString(36).slice(2, 10);
  const clone = (o) => JSON.parse(JSON.stringify(o));

  let trips = [];
  let cur = null;        // trip being edited (working copy)
  let saved = null;      // last saved JSON of cur
  let tab = "photos";
  let photoFilter = "all";
  let selected = new Set();
  let emap = null, emarkers = [], picking = null;

  function toast(msg, ms = 2600) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("on");
    clearTimeout(t._h);
    t._h = setTimeout(() => t.classList.remove("on"), ms);
  }

  // ─── Load / select ─────────────────────────────────────────────────────────
  const params = new URLSearchParams(location.search);
  let focusDay = params.get("day") ? Number(params.get("day")) : null;
  let focusPhoto = params.get("photo");
  if (["photos", "itinerary", "details"].includes(params.get("tab"))) tab = params.get("tab");

  async function load(selectId) {
    const j = await A.api("data");
    A.setPeople(j.people, j.me);
    renderMe();
    trips = j.trips.sort((a, b) => (b.startDate || "").localeCompare(a.startDate || ""));
    renderNav();
    if (!selectId && !cur && params.get("new")) return newTrip();
    const t = trips.find((x) => x.id === (selectId || (cur && cur.id) || params.get("trip"))) || trips[0];
    if (t) select(t.id);
    else newTrip();
  }

  // After a deep link, bring the requested day or photo into view once.
  function revealFocus() {
    let el = null;
    if (focusDay != null && tab === "itinerary") el = document.querySelector(`.day[data-day="${focusDay}"]`);
    if (focusPhoto && tab === "photos") el = document.querySelector(`[data-p="${CSS.escape(focusPhoto)}"]`);
    if (!el) return;
    focusDay = null; focusPhoto = null;
    setTimeout(() => {
      el.scrollIntoView({ behavior: "smooth", block: "center" });
      el.animate([{ boxShadow: "0 0 0 3px rgba(185,154,108,0.9)" }, { boxShadow: "0 0 0 3px rgba(185,154,108,0)" }], { duration: 2200, easing: "ease-out" });
    }, 300);
  }

  function renderNav() {
    $("trips-nav").innerHTML = trips.map((t) => `<button class="t ${cur && cur.id === t.id ? "on" : ""}" data-id="${esc(t.id)}" style="--c:${t.color}"><i></i><div><b>${esc(t.title)}</b><span>${esc(A.dateRange(t.startDate, t.endDate))} · ${(t.photos || []).length} photos</span></div></button>`).join("");
    $("trips-nav").querySelectorAll("[data-id]").forEach((b) => b.onclick = () => { if (dirty() && !confirm("Discard unsaved changes?")) return; select(b.dataset.id); });
  }

  function select(id) {
    const t = trips.find((x) => x.id === id);
    cur = clone(t);
    saved = JSON.stringify(strip(cur));
    selected.clear();
    renderNav();
    render();
  }

  function newTrip() {
    const y = new Date().getFullYear();
    cur = {
      id: `trip-${uid()}`, title: "New journey", subtitle: "", startDate: A.ymd(new Date()), endDate: A.ymd(new Date(Date.now() + 3 * 864e5)),
      color: A.ROUTE_COLORS[trips.length % A.ROUTE_COLORS.length], states: [], groups: [], family: false,
      travelers: A.people.me && !A.people.me.family ? [A.people.me.id] : [], people: A.people.me && !A.people.me.family ? [A.people.me.name] : [],
      origin: { name: "Home", area: "Boerne, TX", lat: 29.7947, lng: -98.732 },
      days: [], stops: [], photos: [], route: { segments: [] }, _new: true,
    };
    saved = "";
    tab = "details";
    renderNav();
    render();
  }

  const blankStop = (s) => !s.name && !A.hasXY(s) && !s.note;
  const strip = (t) => { const { photos, route, updatedAt, _new, canEdit, ...rest } = t; return { ...rest, stops: (rest.stops || []).filter((x) => !blankStop(x)) }; };
  const dirty = () => cur && JSON.stringify(strip(cur)) !== saved;
  let onProfile = false;
  function markDirty() {
    $("savebar").classList.toggle("on", !onProfile && dirty());
    $("save-msg").textContent = "Unsaved changes";
  }

  // ─── Main render ───────────────────────────────────────────────────────────
  function render() {
    onProfile = false;
    const t = cur;
    const np = (t.photos || []).length;
    const ro = t.canEdit === false;
    document.body.classList.toggle("read-only", ro);
    $("main").innerHTML = `
      ${ro ? `<div class="ro-note">You can look, but only ${esc(A.namesOf(A.travelersOf(t)) || "the people on this trip")} can change this journey.</div>` : ""}
      <div class="tabs steps">
        <button data-tab="details" class="${tab === "details" ? "on" : ""}"><i>1</i>Details</button>
        <button data-tab="itinerary" class="${tab === "itinerary" ? "on" : ""}"><i>2</i>Itinerary</button>
        <button data-tab="photos" class="${tab === "photos" ? "on" : ""}"><i>3</i>Photos${np ? ` · ${np}` : ""}</button>
      </div>
      <div id="pane"></div>`;
    $("main").querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => { tab = b.dataset.tab; render(); });
    if (tab === "photos") renderPhotos();
    else if (tab === "itinerary") renderItinerary();
    else renderDetails();
    markDirty();
    $("view-link").href = cur && !cur._new ? `${A.home}?trip=${encodeURIComponent(cur.id)}` : A.home;
    revealFocus();
  }

  // ─── Details tab ───────────────────────────────────────────────────────────
  function renderDetails() {
    const t = cur;
    $("pane").innerHTML = `
      <div class="card"><h3>Journey</h3>
        <div class="fields">
          <label class="f s8"><span>Title</span><input type="text" data-k="title" value="${esc(t.title)}"></label>
          <label class="f s4"><span>Hidden from the map</span><select data-k="hidden"><option value="">No</option><option value="1" ${t.hidden ? "selected" : ""}>Yes, hide it</option></select></label>
          <label class="f s3"><span>Starts</span><input type="date" data-k="startDate" value="${esc(t.startDate)}"></label>
          <label class="f s3"><span>Ends</span><input type="date" data-k="endDate" value="${esc(t.endDate)}"></label>
          <label class="f s6"><span>Route color</span><div class="swatches">${A.ROUTE_COLORS.map((c) => `<button type="button" style="--c:${c}" data-color="${c}" class="${t.color === c ? "on" : ""}"></button>`).join("")}</div></label>
          <div class="f s12"><span>Who went</span>
            <div class="who-pick">
              <button type="button" class="wp ${t.family ? "on" : ""}" data-family>${A.familyBadge(30)}<span>The whole family</span></button>
              ${A.people.list.map((p) => `<button type="button" class="wp ${!t.family && (t.travelers || []).includes(p.id) ? "on" : ""}" data-person="${esc(p.id)}" ${t.family ? "disabled" : ""}>${A.avatar(p, 30)}<span>${esc(p.name)}</span></button>`).join("")}
            </div>
          </div>
        </div>
      </div>
      <div class="card"><h3>Starting point</h3>
        <p class="hint">Where the first day's drive begins. The route starts here.</p>
        <div class="fields">
          <label class="f s4"><span>Name</span><input type="text" data-o="name" value="${esc(t.origin ? t.origin.name : "")}"></label>
          <label class="f s4"><span>Town</span><input type="text" data-o="area" value="${esc(t.origin ? t.origin.area : "")}"></label>
          <div class="f s4"><span>Location</span><div class="search-pop"><input type="search" placeholder="Search a place…" data-search="origin"></div></div>
        </div>
      </div>
      <div class="card"><h3>Splitting up <span class="kicker" style="font-size:9.5px">Optional</span></h3>
        <p class="hint">If the family splits for part of a trip, add a group for each party. Stops assigned to a group draw as their own colored branch.</p>
        <div id="groups">${(t.groups || []).map((g, i) => `
          <div class="fields" style="margin-bottom:10px">
            <label class="f s4"><span>Group name</span><input type="text" data-g="${i}" data-gk="name" value="${esc(g.name)}"></label>
            <label class="f s4"><span>People</span><input type="text" data-g="${i}" data-gk="people" value="${esc((g.people || []).join(", "))}"></label>
            <div class="f s3"><span>Color</span><div class="swatches">${A.ROUTE_COLORS.map((c) => `<button type="button" style="--c:${c}" data-gc="${i}" data-color="${c}" class="${g.color === c ? "on" : ""}"></button>`).join("")}</div></div>
            <div class="f s1" style="justify-content:end"><button class="ib" data-gdel="${i}" title="Remove">✕</button></div>
          </div>`).join("")}</div>
        <button class="btn sm" id="add-group">+ Add group</button>
      </div>
      <div class="next-row">${t._new ? "" : `<button class="linkbtn" id="del-trip">Delete this journey</button>`}<button class="btn dark" id="next-1">Next: Itinerary →</button></div>`;
    const P = $("pane");
    P.querySelectorAll("[data-k]").forEach((el) => el.oninput = el.onchange = () => {
      const k = el.dataset.k;
      if (k === "people" || k === "states" || k === "countries") t[k] = el.value.split(",").map((s) => s.trim()).filter(Boolean).map((s) => (k === "states" ? s.toUpperCase() : s));
      else if (k === "hidden") t.hidden = !!el.value;
      else t[k] = el.value;
      if (k === "startDate" || k === "endDate") syncDays(t);
      markDirty();
    });
    $("next-1").onclick = () => { tab = "itinerary"; render(); scrollTo(0, 0); };
    P.querySelectorAll("[data-person]").forEach((b) => b.onclick = () => {
      const id = b.dataset.person;
      t.travelers = (t.travelers || []).includes(id) ? t.travelers.filter((x) => x !== id) : [...(t.travelers || []), id];
      t.people = t.travelers.map((x) => (A.people.byId.get(x) || {}).name).filter(Boolean);
      renderDetails(); markDirty();
    });
    P.querySelector("[data-family]").onclick = () => {
      t.family = !t.family;
      if (t.family) { t.travelers = A.people.list.map((p) => p.id); t.people = A.people.list.map((p) => p.name); }
      renderDetails(); markDirty();
    };
    P.querySelectorAll("[data-o]").forEach((el) => el.oninput = () => { t.origin = t.origin || {}; t.origin[el.dataset.o] = el.value; markDirty(); });
    P.querySelectorAll("[data-color]:not([data-gc])").forEach((b) => b.onclick = () => { t.color = b.dataset.color; renderDetails(); markDirty(); });
    P.querySelectorAll("[data-gc]").forEach((b) => b.onclick = () => { t.groups[b.dataset.gc].color = b.dataset.color; renderDetails(); markDirty(); });
    P.querySelectorAll("[data-g]").forEach((el) => el.oninput = () => {
      const g = t.groups[el.dataset.g];
      if (el.dataset.gk === "people") g.people = el.value.split(",").map((s) => s.trim()).filter(Boolean);
      else g.name = el.value;
      markDirty();
    });
    P.querySelectorAll("[data-gdel]").forEach((b) => b.onclick = () => { const g = t.groups.splice(b.dataset.gdel, 1)[0]; t.stops.forEach((s) => { if (s.group === g.id) s.group = null; }); renderDetails(); markDirty(); });
    $("add-group").onclick = () => { t.groups.push({ id: `g${uid()}`, name: "", people: [], color: A.ROUTE_COLORS[(t.groups.length + 3) % A.ROUTE_COLORS.length] }); renderDetails(); markDirty(); };
    wireSearch(P.querySelector('[data-search="origin"]'), (r) => { t.origin = { name: t.origin?.name || r.name, area: r.area, lat: r.lat, lng: r.lng }; renderDetails(); markDirty(); toast(`Starting point set to ${r.name}`); });
    if ($("del-trip")) $("del-trip").onclick = async () => {
      if (prompt(`This deletes "${t.title}" and all ${(t.photos || []).length} of its photos. Type DELETE to confirm.`) !== "DELETE") return;
      await A.api("deleteTrip", { method: "POST", body: { id: t.id } });
      cur = null;
      toast("Journey deleted");
      load();
    };
  }

  // ─── Itinerary tab ─────────────────────────────────────────────────────────
  // One card per day, made from the journey's dates. Each day has a title, what happened,
  // and its stops; every day always shows at least one (blank) stop to fill in.
  const STOP_KINDS = [["visit", "Stopped", "Visited during the day"], ["stay", "Stayed the night", "Where you slept"]];
  const HOW = [["drive", "Drove", "Draws the road route from the previous stop"], ["fly", "Flew", "Draws a dashed flight line from the previous stop"], ["boat", "Boat", "Draws a dashed line across the water"], ["skip", "Other", "Walked or anything else: the place is pinned with no line"]];
  const newStop = (day) => ({ id: uid(), day, name: "", area: "", lat: null, lng: null, kind: "visit", note: "", time: "", group: null, travel: "drive" });

  function syncDays(t) {
    if (!t.startDate || !t.endDate || t.endDate < t.startDate) return;
    const dates = [];
    for (let d = A.parseDate(t.startDate); A.ymd(d) <= t.endDate; d = new Date(d.getTime() + 864e5 + 3600e3)) {
      d = A.parseDate(A.ymd(d));
      dates.push(A.ymd(d));
    }
    const covers = (day, ds) => ds >= day.date && ds <= (day.dateEnd || day.date);
    const hasContent = (day) => day.title || day.summary || t.stops.some((x) => x.day === day.n && !blankStop(x));
    // drop empty days that fall outside the dates; keep any day you've written something in
    const gone = new Set(t.days.filter((d) => (d.date < t.startDate || d.date > t.endDate) && !hasContent(d)).map((d) => d.n));
    t.days = t.days.filter((d) => !gone.has(d.n));
    t.stops = t.stops.filter((x) => !gone.has(x.day));
    for (const ds of dates) if (!t.days.some((d) => covers(d, ds))) t.days.push({ n: -1, date: ds, title: "", summary: "" });
    t.days.sort((a, b) => a.date.localeCompare(b.date));
    const remap = new Map();
    t.days.forEach((d, i) => { if (d.n !== -1) remap.set(d.n, i + 1); d.n = i + 1; });
    t.stops.forEach((x) => { if (remap.has(x.day)) x.day = remap.get(x.day); });
    reorderStops();
  }

  function renderItinerary() {
    const t = cur;
    syncDays(t);
    for (const d of t.days) if (!t.stops.some((x) => x.day === d.n)) t.stops.push(newStop(d.n));
    reorderStops();
    const days = [...t.days].sort((a, b) => a.n - b.n);
    const seg = (key, list, val, label) => `<div class="opt"><span class="opt-l">${label}</span><div class="chips" data-opt="${key}">${list.map(([k, l, h]) => `<button type="button" data-v="${esc(k)}" title="${esc(h || l)}" class="${val === k ? "on" : ""}">${esc(l)}</button>`).join("")}</div></div>`;
    const kindChip = (s) => (s.kind === "stay" ? "stay" : "visit");
    const howChip = (s) => { const h = travelOf(s); return h === "start" ? "skip" : h; };
    $("pane").innerHTML = `
      <div class="editor">
        <div>
          ${days.length ? "" : `<div class="empty">Set the start and end dates in step 1 and the days will appear here.</div>`}
          ${days.map((d) => {
            const stops = t.stops.filter((x) => x.day === d.n);
            let num = 0;
            return `<div class="day" data-day="${d.n}">
              <div class="day-top"><b>Day ${d.n}</b><span>${esc(A.dayLong(d))}</span></div>
              <input type="text" class="day-title" data-dk="title" value="${esc(d.title)}" placeholder="Day title, e.g. Shark Teeth & Barrier Islands">
              <textarea data-dk="summary" rows="2" placeholder="What happened">${esc(d.summary)}</textarea>
              <div class="stops">
              ${stops.map((x) => {
                const k = kindChip(x);
                const n = x.kind === "home" ? "⌂" : x.kind === "airport" ? "✈" : ++num;
                const has = A.hasXY(x);
                return `<div class="stop2" data-stop="${esc(x.id)}">
                  <div class="s-top">
                    <span class="s-n ${x.kind === "home" || x.kind === "airport" ? x.kind : k}">${n}</span>
                    <input type="text" data-sk="name" value="${esc(x.name)}" placeholder="Place name">
                    <div class="acts"><button class="ib" data-up title="Move up">↑</button><button class="ib" data-sdel title="Remove stop">✕</button></div>
                  </div>
                  <div class="s-loc">
                    <div class="search-pop"><input type="search" placeholder="${has ? "Change location…" : "Search for the location…"}" data-ssearch></div>
                    <button class="ib" data-pick title="Pick on the map">◎</button>
                  </div>
                  <div class="loc-line ${has ? "" : "missing"}">${has ? `📍 ${esc(x.area || `${x.lat.toFixed(3)}, ${x.lng.toFixed(3)}`)}` : "No location yet. Search above or pick it on the map."}</div>
                  <input type="text" data-sk="note" value="${esc(x.note)}" placeholder="Note (optional)">
                  <div class="opts">
                    ${seg("kind", STOP_KINDS, k, "Did you")}
                    ${seg("travel", HOW, howChip(x), "Got there by")}
                    ${(t.groups || []).length ? seg("group", [["", "Everyone"], ...t.groups.map((g) => [g.id, g.name || "Group"])], x.group || "", "Who") : ""}
                  </div>
                </div>`;
              }).join("")}
              </div>
              <button class="btn sm" data-addstop>+ Add stop</button>
            </div>`;
          }).join("")}
          ${days.length ? `<button class="btn" id="add-day">+ Add a day</button>` : ""}
          <p class="hint" style="margin-top:14px">States and countries are worked out from your stops and the roads you drove when you save.</p>
          <div class="next-row"><button class="btn dark" id="next-2">${t._new ? "Save and add photos →" : "Next: Photos →"}</button></div>
        </div>
        <div class="mapbox" id="mapbox"><div id="emap"></div><div class="pickbar"><span id="pick-msg">Tap the map to place this stop</span><button class="btn sm" style="color:var(--paper);border-color:rgba(239,234,224,0.4);background:transparent" id="pick-cancel">Cancel</button></div></div>
      </div>`;
    const P = $("pane");
    const dayOfEl = (el) => Number(el.closest("[data-day]").dataset.day);
    const stopOfEl = (el) => t.stops.find((x) => x.id === el.closest("[data-stop]").dataset.stop);
    const keepScroll = (fn) => { const y = scrollY; fn(); scrollTo(0, y); };
    P.querySelectorAll("[data-dk]").forEach((el) => el.oninput = () => { const d = t.days.find((x) => x.n === dayOfEl(el)); d[el.dataset.dk] = el.value; markDirty(); });
    P.querySelectorAll("[data-sk]").forEach((el) => el.oninput = () => {
      const x = stopOfEl(el);
      x[el.dataset.sk] = el.value;
      if (el.dataset.sk === "name") autoKind(t, x, true);
      markDirty();
    });
    P.querySelectorAll("[data-sk=name]").forEach((el) => el.onchange = () => keepScroll(renderItinerary));
    P.querySelectorAll(".chips button").forEach((b) => b.onclick = () => {
      const x = stopOfEl(b);
      const key = b.closest("[data-opt]").dataset.opt;
      const v = b.dataset.v;
      if (key === "kind") x.kind = v === "stay" ? "stay" : x.kind === "stay" ? (/\bairport\b/i.test(x.name) ? "airport" : "visit") : x.kind;
      else if (key === "travel") { x.travel = v; delete x.route; }
      else if (key === "group") x.group = v || null;
      markDirty();
      keepScroll(renderItinerary);
    });
    P.querySelectorAll("[data-addstop]").forEach((b) => b.onclick = () => { t.stops.push(newStop(dayOfEl(b))); reorderStops(); keepScroll(renderItinerary); });
    P.querySelectorAll("[data-sdel]").forEach((b) => b.onclick = () => {
      const x = stopOfEl(b);
      if (!blankStop(x) && !confirm(`Remove “${x.name || "this stop"}”?`)) return;
      t.stops = t.stops.filter((y) => y !== x);
      markDirty(); keepScroll(renderItinerary);
    });
    P.querySelectorAll("[data-up]").forEach((b) => b.onclick = () => {
      const x = stopOfEl(b);
      const same = t.stops.filter((y) => y.day === x.day);
      const i = same.indexOf(x);
      if (i <= 0) return;
      const a = t.stops.indexOf(same[i - 1]), c = t.stops.indexOf(x);
      [t.stops[a], t.stops[c]] = [t.stops[c], t.stops[a]];
      markDirty(); keepScroll(renderItinerary);
    });
    if ($("add-day")) $("add-day").onclick = () => {
      t.endDate = A.ymd(new Date(A.parseDate(t.endDate).getTime() + 864e5 + 3600e3));
      t.endDate = A.ymd(A.parseDate(t.endDate));
      markDirty(); keepScroll(renderItinerary);
    };
    $("next-2").onclick = async () => {
      if (cur._new || dirty()) { if (!(await doSave())) return; }
      tab = "photos"; render(); scrollTo(0, 0);
    };
    P.querySelectorAll("[data-ssearch]").forEach((el) => wireSearch(el, (r) => {
      const x = stopOfEl(el);
      x.lat = r.lat; x.lng = r.lng; x.area = r.area;
      if (!x.name) x.name = r.name;
      autoKind(t, x, false);
      markDirty(); keepScroll(renderItinerary);
    }));
    P.querySelectorAll("[data-pick]").forEach((b) => b.onclick = () => { picking = stopOfEl(b); $("mapbox").classList.add("picking"); $("pick-msg").textContent = `Tap the map to place “${picking.name || "this stop"}”`; $("mapbox").scrollIntoView({ behavior: "smooth", block: "center" }); });
    $("pick-cancel").onclick = () => { picking = null; $("mapbox").classList.remove("picking"); };
    mountEditorMap();
    markDirty();
  }

  // Small guesses so the options are usually right without touching them: a stop named
  // "… Airport" is an airport, and going from one airport to another is a flight.
  function autoKind(t, x, typing) {
    if (/\bairport\b|international\b/i.test(x.name) && x.kind !== "airport") {
      x.kind = "airport";
      const i = t.stops.indexOf(x);
      const prev = t.stops.slice(0, i).reverse().find((y) => A.hasXY(y) && y !== x);
      if (prev && prev.kind === "airport" && travelOf(x) === "drive") x.travel = "fly";
      if (typing) { /* re-rendered on change */ }
    }
  }

  function reorderStops() {
    const t = cur;
    t.stops = t.stops.map((s, i) => [s, i]).sort((a, b) => a[0].day - b[0].day || a[1] - b[1]).map((x) => x[0]);
  }

  function mountEditorMap() {
    const host = $("emap");
    if (emap) { emap.remove(); emap = null; }
    emap = new maplibregl.Map({ container: host, style: A.mapStyle({ relief: true }), center: [-88, 30], zoom: 4, attributionControl: { compact: true } });
    emap.addControl(new maplibregl.NavigationControl({ showCompass: false }), "bottom-right");
    emap.on("load", () => {
      emap._ready = true;
      emap.addSource("r", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
      emap.addLayer({ id: "r", type: "line", source: "r", layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": ["get", "color"], "line-width": 3, "line-opacity": 0.85 } });
      drawEditorMarkers(true);
    });
    emap.on("click", (e) => {
      if (!picking) return;
      picking.lat = +e.lngLat.lat.toFixed(5);
      picking.lng = +e.lngLat.lng.toFixed(5);
      picking = null;
      $("mapbox").classList.remove("picking");
      markDirty();
      const y = scrollY;
      renderItinerary();
      scrollTo(0, y);
    });
  }

  function drawEditorMarkers(fitIt) {
    if (!emap || !emap._ready) return;
    const t = cur;
    emarkers.forEach((m) => m.remove());
    emarkers = [];
    const pl = A.places(t);
    for (const p of pl.list) {
      const el = document.createElement("div");
      el.className = `mk ${p.kind}`;
      el.textContent = p.kind === "home" ? "⌂" : p.kind === "airport" ? "✈" : p.num;
      el.title = p.name;
      const m = new maplibregl.Marker({ element: el, draggable: true }).setLngLat([p.lng, p.lat]).addTo(emap);
      m.on("dragend", () => {
        const ll = m.getLngLat();
        const targets = p.stops.length ? p.stops : [];
        targets.forEach((s) => { s.lat = +ll.lat.toFixed(5); s.lng = +ll.lng.toFixed(5); });
        if (p.kind === "home" && !p.stops.length && t.origin) { t.origin.lat = +ll.lat.toFixed(5); t.origin.lng = +ll.lng.toFixed(5); }
        markDirty();
        const y = scrollY; renderItinerary(); scrollTo(0, y);
      });
      emarkers.push(m);
    }
    const segs = (t.route && t.route.segments) || [];
    emap.getSource("r").setData({ type: "FeatureCollection", features: segs.map((s) => ({ type: "Feature", properties: { color: s.groups && s.groups.length === 1 ? ((t.groups.find((g) => g.id === s.groups[0]) || {}).color || t.color) : t.color }, geometry: { type: "LineString", coordinates: s.coords } })) });
    const b = A.bounds([...pl.list.map((p) => [p.lng, p.lat])]);
    if (b && fitIt !== false) emap.fitBounds(b, { padding: 40, duration: 0, maxZoom: 11 });
  }

  // Place search (server proxies Photon / OpenStreetMap)
  function wireSearch(input, onPick) {
    if (!input) return;
    let h, box;
    const close = () => { if (box) { box.remove(); box = null; } };
    input.addEventListener("input", () => {
      clearTimeout(h);
      const q = input.value.trim();
      if (q.length < 3) return close();
      h = setTimeout(async () => {
        try {
          const c = emap ? emap.getCenter() : null;
          const j = await A.api("geocode", { query: { q, ...(c ? { lat: c.lat.toFixed(3), lng: c.lng.toFixed(3) } : {}) } });
          close();
          box = document.createElement("div");
          box.className = "results";
          box.innerHTML = j.results.length ? j.results.map((r, i) => `<button data-i="${i}">${esc(r.name)}<small>${esc(r.area)}</small></button>`).join("") : `<button disabled>No matches</button>`;
          input.parentElement.appendChild(box);
          box.querySelectorAll("[data-i]").forEach((b) => b.onclick = () => { const r = j.results[b.dataset.i]; close(); input.value = ""; onPick(r); });
        } catch (e) { toast(e.message); }
      }, 350);
    });
    input.addEventListener("blur", () => setTimeout(close, 200));
  }

  // ─── Save ──────────────────────────────────────────────────────────────────
  $("save").onclick = () => doSave();
  async function doSave() {
    const t = cur;
    $("save").disabled = true;
    $("save-msg").textContent = "Saving and tracing the roads…";
    $("savebar").classList.add("on");
    try {
      const j = await A.api("saveTrip", { method: "POST", body: { trip: strip(t) } });
      cur = clone(j.trip);
      saved = JSON.stringify(strip(cur));
      const i = trips.findIndex((x) => x.id === cur.id);
      if (i >= 0) trips[i] = clone(j.trip); else trips.push(clone(j.trip));
      renderNav();
      render();
      toast(j.trip.route && j.trip.route.incomplete ? "Saved. Some roads couldn't be traced yet; they'll retry on the next load." : "Saved. Routes updated.");
      return true;
    } catch (e) {
      $("save-msg").textContent = e.message;
      return false;
    } finally {
      $("save").disabled = false;
      markDirty();
    }
  }
  $("discard").onclick = () => { if (cur._new) { cur = null; load(); return; } select(cur.id); };
  $("new-trip").onclick = () => { if (dirty() && !confirm("Discard unsaved changes?")) return; newTrip(); };
  addEventListener("beforeunload", (e) => { if (dirty()) { e.preventDefault(); e.returnValue = ""; } });

  // ─── Photos tab ────────────────────────────────────────────────────────────
  function stopLabel(t, s) {
    const d = t.days.find((x) => x.n === s.day);
    return `Day ${s.day} · ${s.name}${s.group ? ` (${(t.groups.find((g) => g.id === s.group) || {}).name || ""})` : ""}`;
  }

  // Photos, grouped the way the trip happened: each day, each stop, with its own Add button.
  // A big batch can still be dropped at the top and is sorted onto stops automatically.
  let photoTarget = null;   // where the next picked files go: { stopId, day } or null for "sort them"
  function renderPhotos() {
    const t = cur;
    if (t._new) { $("pane").innerHTML = `<div class="empty">Save the journey first (step 2), then add photos to it.</div>`; return; }
    const all = t.photos || [];
    const byStop = new Map(), byDay = new Map(), loose = [];
    for (const ph of all) {
      const st = ph.stopId && t.stops.find((x) => x.id === ph.stopId);
      if (st) { if (!byStop.has(st.id)) byStop.set(st.id, []); byStop.get(st.id).push(ph); }
      else if (ph.day) { if (!byDay.has(ph.day)) byDay.set(ph.day, []); byDay.get(ph.day).push(ph); }
      else loose.push(ph);
    }
    const thumbs = (list) => list.length ? `<div class="thumbs">${list.map((ph) => `
      <div class="th ${selected.has(ph.id) ? "sel" : ""} ${ph.hidden ? "hid" : ""}" data-p="${esc(ph.id)}">
        <img src="${A.photoUrl(ph, "t")}" alt="" loading="lazy">
        ${ph.featured ? `<span class="star">★</span>` : ""}${t.coverPhotoId === ph.id ? `<span class="cov">Cover</span>` : ""}
        <button class="ck" data-ck aria-label="Select">${selected.has(ph.id) ? "✓" : ""}</button>
      </div>`).join("")}</div>` : "";
    const add = (stopId, day) => `<button class="btn sm add-ph" data-add-stop="${esc(stopId || "")}" data-add-day="${day || ""}">+ Add photos</button>`;
    const days = [...t.days].sort((a, b) => a.n - b.n);
    $("pane").innerHTML = `
      <div class="drop" id="drop"><b>Drop a batch of photos</b><p>Or tap to choose. They're sorted onto stops by their location, file name or date.<br>To add photos to one stop, use its own “Add photos” button below.</p></div>
      <div id="queue-slot"></div>
      <div class="bulk ${selected.size ? "on" : ""}" id="bulk">
        <b style="font:500 18px var(--font-display)">${selected.size} selected</b>
        <select id="bulk-stop"><option value="">Move to…</option>${days.map((d) => `<optgroup label="Day ${d.n} · ${esc(A.dayLabel(d))}">${t.stops.filter((x) => x.day === d.n && x.name).map((x) => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("")}<option value="day:${d.n}">Day ${d.n}, no particular stop</option></optgroup>`).join("")}</select>
        <button class="btn" id="bulk-hide">Hide</button>
        <button class="btn" id="bulk-del">Delete</button>
        <button class="btn" id="bulk-clear">Done</button>
      </div>
      ${loose.length ? `<div class="pday needs"><div class="pday-h"><b>Needs a place</b><span>${loose.length} photo${loose.length === 1 ? "" : "s"}. Select them, then “Move to…” a stop.</span></div>${thumbs(loose)}</div>` : ""}
      ${days.map((d) => {
        const stops = t.stops.filter((x) => x.day === d.n && (x.name || A.hasXY(x)));
        const extra = byDay.get(d.n) || [];
        return `<div class="pday">
          <div class="pday-h"><b>Day ${d.n}${d.title ? ` · ${esc(d.title)}` : ""}</b><span>${esc(A.dayLong(d))}</span></div>
          ${stops.map((x) => `<div class="pstop">
            <div class="pstop-h"><div><b>${esc(x.name || "Unnamed stop")}</b>${x.area ? `<span>${esc(x.area)}</span>` : ""}</div>${add(x.id, d.n)}</div>
            ${thumbs(byStop.get(x.id) || [])}
          </div>`).join("")}
          <div class="pstop other">
            <div class="pstop-h"><div><b>Other photos from this day</b></div>${add("", d.n)}</div>
            ${thumbs(extra)}
          </div>
        </div>`;
      }).join("")}`;

    $("queue-slot").replaceWith(queueEl);
    const P = $("pane");
    const drop = $("drop");
    drop.onclick = () => { photoTarget = null; $("file").click(); };
    ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
    ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
    drop.addEventListener("drop", (e) => queueFiles([...e.dataTransfer.files], null));
    P.querySelectorAll("[data-add-day]").forEach((b) => b.onclick = () => {
      photoTarget = { stopId: b.dataset.addStop || null, day: Number(b.dataset.addDay) || null };
      $("file").click();
    });
    // a stop's section also accepts photos dragged onto it (desktop)
    P.querySelectorAll(".pstop").forEach((box) => {
      const b = box.querySelector("[data-add-day]");
      ["dragenter", "dragover"].forEach((ev) => box.addEventListener(ev, (e) => { e.preventDefault(); e.stopPropagation(); box.classList.add("over"); }));
      ["dragleave", "drop"].forEach((ev) => box.addEventListener(ev, (e) => { e.preventDefault(); e.stopPropagation(); box.classList.remove("over"); }));
      box.addEventListener("drop", (e) => queueFiles([...e.dataTransfer.files], { stopId: b.dataset.addStop || null, day: Number(b.dataset.addDay) || null }));
    });
    const photoOf = (el) => t.photos.find((ph) => ph.id === el.closest("[data-p]").dataset.p);
    P.querySelectorAll("[data-ck]").forEach((b) => b.onclick = (e) => { e.stopPropagation(); const ph = photoOf(b); selected.has(ph.id) ? selected.delete(ph.id) : selected.add(ph.id); keepY(renderPhotos); });
    P.querySelectorAll(".th").forEach((el) => el.onclick = () => { if (selected.size) { const ph = photoOf(el); selected.has(ph.id) ? selected.delete(ph.id) : selected.add(ph.id); keepY(renderPhotos); } else openPhoto(photoOf(el)); });
    if (selected.size) {
      $("bulk-stop").onchange = () => {
        const v = $("bulk-stop").value;
        if (!v) return;
        const st = v.startsWith("day:") ? null : t.stops.find((x) => x.id === v);
        const day = st ? st.day : Number(v.slice(4));
        const patches = [...selected].map((id) => ({ id, stopId: st ? st.id : null, day, placed: "manual" }));
        patches.forEach((pt) => Object.assign(t.photos.find((ph) => ph.id === pt.id), pt));
        selected.clear();
        savePhotos(patches, true);
      };
      $("bulk-hide").onclick = () => { const patches = [...selected].map((id) => ({ id, hidden: true })); patches.forEach((pt) => Object.assign(t.photos.find((ph) => ph.id === pt.id), pt)); selected.clear(); savePhotos(patches, true); };
      $("bulk-del").onclick = async () => {
        if (!confirm(`Delete ${selected.size} photos for good?`)) return;
        const ids = [...selected];
        await A.api("deletePhotos", { method: "POST", body: { tripId: t.id, ids } });
        t.photos = t.photos.filter((ph) => !ids.includes(ph.id));
        selected.clear();
        keepY(renderPhotos); renderNav();
      };
      $("bulk-clear").onclick = () => { selected.clear(); keepY(renderPhotos); };
    }
  }
  const keepY = (fn) => { const y = scrollY; fn(); scrollTo(0, y); };

  // One photo: where it goes, its title and caption, and the star / cover / hide / delete actions.
  function openPhoto(ph) {
    const t = cur;
    const days = [...t.days].sort((a, b) => a.n - b.n);
    const where = ph.stopId ? ph.stopId : ph.day ? `day:${ph.day}` : "";
    const box = document.createElement("div");
    box.className = "pmodal";
    box.innerHTML = `<div class="pm-card">
      <button class="ib pm-x" aria-label="Close">✕</button>
      <div class="pm-img"><img src="${A.photoUrl(ph, "t")}" alt=""></div>
      <div class="pm-body">
        <label class="f"><span>Where</span><select data-pm="where"><option value="">Needs a place</option>${days.map((d) => `<optgroup label="Day ${d.n} · ${esc(A.dayLabel(d))}">${t.stops.filter((x) => x.day === d.n && x.name).map((x) => `<option value="${esc(x.id)}" ${where === x.id ? "selected" : ""}>${esc(x.name)}</option>`).join("")}<option value="day:${d.n}" ${where === `day:${d.n}` ? "selected" : ""}>Day ${d.n}, no particular stop</option></optgroup>`).join("")}</select></label>
        <label class="f"><span>Title</span><input type="text" data-pm="title" value="${esc(ph.title)}" placeholder="Defaults to the place"></label>
        <label class="f"><span>What was happening</span><textarea data-pm="caption" rows="3">${esc(ph.caption)}</textarea></label>
        <div class="pm-acts">
          <button class="btn sm ${ph.featured ? "dark" : ""}" data-pa="feat">★ ${ph.featured ? "Featured" : "Feature"}</button>
          <button class="btn sm ${t.coverPhotoId === ph.id ? "dark" : ""}" data-pa="cover">${t.coverPhotoId === ph.id ? "Journey cover" : "Use as cover"}</button>
          <button class="btn sm ${ph.hidden ? "dark" : ""}" data-pa="hide">${ph.hidden ? "Hidden" : "Hide"}</button>
          <button class="btn sm danger" data-pa="del">Delete</button>
        </div>
        <div class="fn">${esc(ph.fileName || "")}${ph.takenAt ? ` · ${esc(ph.takenAt.slice(0, 10))}` : ""}</div>
      </div></div>`;
    document.body.appendChild(box);
    const close = () => { box.remove(); keepY(renderPhotos); };
    box.querySelector(".pm-x").onclick = close;
    box.onclick = (e) => { if (e.target === box) close(); };
    box.querySelector('[data-pm="where"]').onchange = (e) => {
      const v = e.target.value;
      const st = v && !v.startsWith("day:") ? t.stops.find((x) => x.id === v) : null;
      const patch = { id: ph.id, stopId: st ? st.id : null, day: st ? st.day : v ? Number(v.slice(4)) : null, placed: "manual" };
      Object.assign(ph, patch); savePhotos([patch], false);
    };
    ["title", "caption"].forEach((k) => { box.querySelector(`[data-pm="${k}"]`).oninput = debounce((e) => { ph[k] = e.target.value; savePhotos([{ id: ph.id, [k]: ph[k] }], false); }, 600); });
    box.querySelectorAll("[data-pa]").forEach((b) => b.onclick = async () => {
      const a = b.dataset.pa;
      if (a === "feat") { ph.featured = !ph.featured; await savePhotos([{ id: ph.id, featured: ph.featured }], false); }
      if (a === "hide") { ph.hidden = !ph.hidden; await savePhotos([{ id: ph.id, hidden: ph.hidden }], false); }
      if (a === "cover") {
        t.coverPhotoId = t.coverPhotoId === ph.id ? null : ph.id;
        await A.api("saveTrip", { method: "POST", body: { trip: strip(t) } });
        saved = JSON.stringify(strip(t));
      }
      if (a === "del") {
        if (!confirm("Delete this photo for good?")) return;
        await A.api("deletePhotos", { method: "POST", body: { tripId: t.id, ids: [ph.id] } });
        t.photos = t.photos.filter((x) => x !== ph);
        renderNav();
        return close();
      }
      box.remove(); openPhoto(ph);
    });
  }
  function debounce(fn, ms) { let h; return (...a) => { clearTimeout(h); h = setTimeout(() => fn(...a), ms); }; }
  async function savePhotos(patches, rerender) {
    try {
      await A.api("updatePhotos", { method: "POST", body: { tripId: cur.id, photos: patches } });
      const ti = trips.find((x) => x.id === cur.id);
      if (ti) ti.photos = clone(cur.photos);
      if (rerender) { const y = scrollY; renderPhotos(); scrollTo(0, y); }
    } catch (e) { toast(e.message); }
  }

  // ─── Upload pipeline ───────────────────────────────────────────────────────
  $("file").onchange = () => { queueFiles([...$("file").files], photoTarget); $("file").value = ""; photoTarget = null; };
  const queue = [];
  let active = 0;
  const queueEl = document.createElement("div");
  queueEl.className = "queue";
  function queueFiles(files, target = null) {
    const t = cur;
    if (!queue.length && !active) queueEl.innerHTML = "";
    files = files.filter((f) => /^image\//.test(f.type) || /\.(heic|heif|jpe?g|png|webp)$/i.test(f.name));
    if (!files.length) return;
    for (const f of files) {
      const row = document.createElement("div");
      row.className = "qrow";
      row.innerHTML = `<span>${esc(f.name)}</span><div class="bar"><i></i></div><span class="st">Waiting</span>`;
      queueEl.appendChild(row);
      queue.push({ f, row, trip: t, target });
    }
    pump();
  }
  function pump() {
    while (active < 2 && queue.length) {
      const job = queue.shift();
      active++;
      processOne(job).finally(() => {
        active--;
        if (!queue.length && !active) { renderNav(); if (cur && cur.id === job.trip.id && tab === "photos") renderPhotos(); }
        pump();
      });
    }
  }
  const setRow = (row, pct, st, err) => { row.querySelector("i").style.width = `${pct}%`; row.querySelector(".st").textContent = st; row.classList.toggle("err", !!err); };

  async function processOne({ f, row, trip, target }) {
    try {
      setRow(row, 10, "Reading");
      let meta = {};
      try {
        const ex = await exifr.parse(f, { gps: true, exif: true, tiff: true, ifd1: false, xmp: false, icc: false, iptc: false });
        if (ex) {
          const dt = ex.DateTimeOriginal || ex.CreateDate;
          if (dt instanceof Date && !isNaN(dt)) meta.takenAt = `${A.ymd(dt)}T${String(dt.getHours()).padStart(2, "0")}:${String(dt.getMinutes()).padStart(2, "0")}`;
          if (Number.isFinite(ex.latitude) && Number.isFinite(ex.longitude)) { meta.lat = +ex.latitude.toFixed(6); meta.lng = +ex.longitude.toFixed(6); }
        }
      } catch {}
      setRow(row, 30, "Resizing");
      const bmp = await decode(f);
      const full = await toJpeg(bmp, 2048, 0.84);
      const thumb = await toJpeg(bmp, 800, 0.8);
      if (bmp.close) bmp.close();
      // photos added to a particular stop (or day) go there; a dropped batch is sorted automatically
      const placement = target && (target.stopId || target.day)
        ? { stopId: target.stopId || null, day: target.day || null, placed: "manual", ...(autoPlace(trip, meta, f.name).caption ? { caption: autoPlace(trip, meta, f.name).caption } : {}) }
        : autoPlace(trip, meta, f.name);
      setRow(row, 60, "Uploading");
      const body = {
        tripId: trip.id,
        photo: { fileName: f.name, width: full.w, height: full.h, ...meta, ...placement },
        full: full.b64,
        thumb: thumb.b64,
      };
      const j = await A.api("upload", { method: "POST", body });
      trip.photos = trip.photos || [];
      trip.photos.push(j.photo);
      const ti = trips.find((x) => x.id === trip.id);
      if (ti && ti !== trip) ti.photos = clone(trip.photos);
      const lbl = placement.stopId ? (trip.stops.find((s) => s.id === placement.stopId) || {}).name : placement.day ? `Day ${placement.day}` : "Needs a place";
      setRow(row, 100, `Done · ${lbl}`);
    } catch (e) {
      console.error(e);
      setRow(row, 100, /heic|heif/i.test(f.name) ? "This browser can't read HEIC. Upload from an iPhone or iPad, or export as JPEG" : `Failed · ${e.message}`, true);
    }
  }

  async function decode(f) {
    try { return await createImageBitmap(f, { imageOrientation: "from-image" }); } catch {}
    const url = URL.createObjectURL(f);
    try {
      const img = new Image();
      img.decoding = "async";
      img.src = url;
      await img.decode();
      return img;
    } finally { setTimeout(() => URL.revokeObjectURL(url), 5000); }
  }
  async function toJpeg(src, max, q) {
    const w0 = src.width || src.naturalWidth, h0 = src.height || src.naturalHeight;
    const k = Math.min(1, max / Math.max(w0, h0));
    const w = Math.round(w0 * k), h = Math.round(h0 * k);
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const g = c.getContext("2d");
    g.imageSmoothingQuality = "high";
    g.drawImage(src, 0, 0, w, h);
    const blob = await new Promise((ok) => c.toBlob(ok, "image/jpeg", q));
    const buf = new Uint8Array(await blob.arrayBuffer());
    let s = "";
    for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
    return { b64: btoa(s), w, h };
  }

  // Placement, best evidence first: GPS → nearest stop; file name → a stop it names;
  // capture date → that day. Anything left is flagged "Needs a place".
  const STOPWORDS = new Set(["the", "and", "of", "at", "in", "on", "a", "to", "with", "for", "fl", "al", "tx", "beach", "park", "state", "key", "island", "img", "image", "photo", "copy", "edited", "jpg", "jpeg", "heic", "png",
    "dinner", "lunch", "breakfast", "brunch", "sunset", "sunrise", "morning", "afternoon", "evening", "night", "day", "drive", "trip", "family", "fun", "hotel", "condo", "house", "suites", "dessert", "food"]);
  const words = (s) => String(s || "").toLowerCase().replace(/\.[a-z0-9]+$/, "").replace(/[^a-z0-9]+/g, " ").split(" ").filter((w) => w && !STOPWORDS.has(w) && !/^\d+$/.test(w));
  function autoPlace(trip, meta, fileName) {
    const out = { placed: "none" };
    const dateStr = meta.takenAt ? meta.takenAt.slice(0, 10) : null;
    const dayByDate = dateStr ? trip.days.find((d) => dateStr >= d.date && dateStr <= (d.dateEnd || d.date)) : null;
    const located = trip.stops.filter((s) => A.hasXY(s));
    if (Number.isFinite(meta.lat)) {
      let best = null, bd = Infinity;
      for (const s of located) {
        const d = A.haversine([meta.lng, meta.lat], [s.lng, s.lat]);
        const sameDay = dayByDate && s.day === dayByDate.n ? 0.6 : 1; // prefer that day's stop when two are close
        if (d * sameDay < bd) { bd = d * sameDay; best = s; }
      }
      out.placed = "gps";
      if (best && bd < 25000) { out.stopId = best.id; out.day = dayByDate ? dayByDate.n : best.day; }
      else if (dayByDate) out.day = dayByDate.n;
    }
    // A descriptive file name ("Siesta Key sunset.jpg") also becomes the caption.
    const isCamera = /^(img|dsc|dscn|pxl|mvimg|photo|image|screenshot)[-_ ]?\d+/i.test(fileName) || /^[0-9a-f-]{20,}/i.test(fileName);
    if (!isCamera) {
      const fw = words(fileName);
      if (fw.length) {
        const caption = fileName.replace(/\.[a-z0-9]+$/i, "").replace(/[_]+/g, " ").replace(/\s+/g, " ").trim();
        out.caption = caption;
        if (!out.stopId) {
          // weight rare words higher than common ones ("siesta" beats "sand")
          const freq = {};
          trip.stops.forEach((s) => new Set(words(`${s.name} ${s.area}`)).forEach((w) => freq[w] = (freq[w] || 0) + 1));
          let best = null, bs = 0;
          for (const s of trip.stops) {
            const sw = new Set(words(`${s.name} ${s.area}`));
            let score = 0;
            fw.forEach((w) => { if (sw.has(w)) score += 1 / freq[w]; });
            if (dayByDate && s.day === dayByDate.n) score *= 1.5;
            if (score > bs) { bs = score; best = s; }
          }
          if (best && bs >= 0.5) { out.stopId = best.id; out.day = best.day; out.placed = out.placed === "gps" ? "gps" : "filename"; }
        }
      }
    }
    if (!out.day && dayByDate) { out.day = dayByDate.n; if (out.placed === "none") out.placed = "date"; }
    return out;
  }

  // ─── You ───────────────────────────────────────────────────────────────────
  function renderMe() {
    const me = A.people.me;
    const b = $("me-btn");
    if (!me) return;
    b.hidden = false;
    b.innerHTML = me.family ? `${A.familyBadge(30)}<span>Family</span>` : `${A.avatar(A.people.byId.get(me.id) || me, 30)}<span>${esc(me.name)}</span>`;
    b.onclick = renderProfile;
  }
  $("profile-btn").onclick = () => { if (dirty() && !confirm("Discard unsaved changes?")) return; renderProfile(); };

  function renderProfile() {
    onProfile = true;
    const me = A.people.me;
    document.body.classList.remove("read-only");
    $("savebar").classList.remove("on");
    if (!me || me.family) {
      $("main").innerHTML = `<div class="card"><h3>Your profile</h3><p class="hint">You're signed in with the shared family password. Once you open your invite link and choose a password, you'll sign in with your email instead and can add your photo here.</p><button class="btn" id="signout">Sign out</button></div>`;
      $("signout").onclick = signOut;
      return;
    }
    const p = A.people.byId.get(me.id) || me;
    $("main").innerHTML = `
      <div class="card"><h3>Your profile</h3>
        <div class="profile-top">
          <button class="profile-photo" id="ph-pick" title="Change photo">${A.avatar(p, 96)}<span>Change photo</span></button>
          <div class="fields" style="flex:1">
            <label class="f s12"><span>Name</span><input type="text" id="pf-name" value="${esc(p.name)}"></label>
            <div class="f s12"><span>Email</span><div style="padding:9px 0;color:var(--ink-soft)">${esc(p.email)}</div></div>
          </div>
        </div>
        <button class="btn dark" id="pf-save">Save name</button>
      </div>
      <div class="card"><h3>Password</h3>
        <div class="fields">
          <label class="f s6"><span>Current password</span><input type="password" id="pf-cur" autocomplete="current-password"></label>
          <label class="f s6"><span>New password (8+ characters)</span><input type="password" id="pf-new" autocomplete="new-password"></label>
        </div>
        <button class="btn" id="pf-pw" style="margin-top:12px">Change password</button>
      </div>
      <div class="card"><h3>Family</h3>
        <div class="people-list">${A.people.list.map((x) => `<div class="pl">${A.avatar(x, 34)}<div><b>${esc(x.name)}</b><span>${x.active ? esc(x.email) : x.email ? "Invited, not set up yet" : "No account yet"}${x.admin ? " · admin" : ""}</span></div></div>`).join("")}</div>
        <p class="hint" style="margin-top:12px">To add someone, ask Claude to invite them by email. They'll get a link to choose their own password.</p>
      </div>
      <button class="btn ghost" id="signout">Sign out</button>
      <input type="file" id="ph-file" accept="image/*" hidden>`;
    $("pf-save").onclick = async () => {
      const j = await A.api("updateProfile", { method: "POST", body: { name: $("pf-name").value } });
      Object.assign(p, j.me); Object.assign(me, { name: j.me.name }); renderMe(); toast("Saved");
    };
    $("pf-pw").onclick = async () => {
      try {
        await A.api("updateProfile", { method: "POST", body: { currentPassword: $("pf-cur").value, newPassword: $("pf-new").value } });
        $("pf-cur").value = $("pf-new").value = ""; toast("Password changed");
      } catch (e) { toast(e.message); }
    };
    $("ph-pick").onclick = () => $("ph-file").click();
    $("ph-file").onchange = async () => {
      const f = $("ph-file").files[0];
      if (!f) return;
      try {
        const bmp = await decode(f);
        // square crop from the center, 400px
        const w0 = bmp.width || bmp.naturalWidth, h0 = bmp.height || bmp.naturalHeight, side = Math.min(w0, h0);
        const c = document.createElement("canvas"); c.width = c.height = 400;
        c.getContext("2d").drawImage(bmp, (w0 - side) / 2, (h0 - side) / 3, side, side, 0, 0, 400, 400);
        const blob = await new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.86));
        const buf = new Uint8Array(await blob.arrayBuffer());
        let bin = ""; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
        const j = await A.api("updateProfile", { method: "POST", body: { avatar: btoa(bin) } });
        Object.assign(p, j.me); renderMe(); renderProfile(); renderNav(); toast("Photo updated");
      } catch (e) { toast(e.message || "Couldn't read that photo"); }
    };
    $("signout").onclick = signOut;
  }
  async function signOut() {
    await A.api("logout", { method: "POST" }).catch(() => {});
    location.href = A.home;
  }

  // ─── Boot ──────────────────────────────────────────────────────────────────
  $("fam").textContent = A.BRAND.family;
  $("view-link").href = A.home;
  A.ensureSession().then(() => load()).catch((e) => { $("main").innerHTML = `<div class="empty">${esc(e.message)}</div>`; });
})();
</script>
</body>
</html>
