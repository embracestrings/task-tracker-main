<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Rey Family Travel Map</title>
<meta name="theme-color" content="#EFEAE0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Travel Map">
<link rel="manifest" href="/trips/manifest.webmanifest">
<link rel="icon" href="/trips/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/trips/icon-180.png">
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/trips/vendor/maplibre-gl-5.24.1.css">
<link rel="stylesheet" href="/trips/atlas.css">
<style>
  html, body { overflow: hidden; overscroll-behavior: none; touch-action: manipulation; }
  body { user-select: none; -webkit-user-select: none; }

  #map {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 50% 45%, #F6F2E9 0%, #ECE5D6 55%, #E2D9C6 100%);
  }
  /* Paper grain + soft vignette, so the map reads like a printed page rather than a web map */
  .paper-overlay {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background:
      radial-gradient(ellipse at center, transparent 58%, rgba(22,35,61,0.13) 100%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0 0.22  0 0 0 0.5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    opacity: 0.55; mix-blend-mode: multiply;
  }
  .maplibregl-ctrl-attrib { font: 10px var(--font-body); background: rgba(239,234,224,0.7) !important; }
  .maplibregl-ctrl-attrib a { color: var(--ink-soft); }
  .maplibregl-ctrl-bottom-right { z-index: 3; }

  .glass {
    background: var(--glass);
    -webkit-backdrop-filter: blur(18px) saturate(1.15);
    backdrop-filter: blur(18px) saturate(1.15);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    border-radius: 22px;
  }
  .ui { position: fixed; z-index: 10; transition: opacity 0.6s var(--ease), transform 0.6s var(--ease-out); }
  .ui.off { opacity: 0; pointer-events: none; }
  body.ambient .ui:not(.amb) { opacity: 0; pointer-events: none; }

  :root { --pad: max(22px, env(safe-area-inset-left)); --top: max(22px, env(safe-area-inset-top)); }

  /* ── Top-right controls ───────────────────────────────────────────────── */
  .controls { top: var(--top); right: var(--pad); display: flex; gap: 10px; }
  .pill {
    display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 20px 0 16px;
    border-radius: 999px; cursor: pointer; border: 1px solid var(--line);
    background: var(--glass); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    box-shadow: var(--shadow);
    font: 500 11px var(--font-mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink);
  }
  .pill svg { width: 16px; height: 16px; }
  .pill:active { transform: scale(0.97); }
  .pill[hidden] { display: none; }
  a.pill { text-decoration: none; }
  /* Add/Edit stay icon-only until there is room for words */
  @media (max-width: 1199px) { .pill.compact { width: 46px; padding: 0; justify-content: center; } .pill.compact .lbl { display: none; } }
  .pill.dark { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  /* ── Home panel ──────────────────────────────────────────────────────── */
  .home-panel {
    top: var(--top); left: var(--pad); width: min(400px, 38vw); max-height: calc(100vh - 44px);
    padding: 34px 30px 18px; display: flex; flex-direction: column;
  }
  .home-panel.off { transform: translateX(-30px); }
  .masthead { font-family: var(--font-display); font-weight: 500; font-size: clamp(44px, 6vw, 76px); line-height: 0.92; margin: 6px 0 0; letter-spacing: -0.015em; }
  .masthead em { font-style: italic; font-weight: 400; color: var(--gold-deep); }
  .rule { height: 1px; background: linear-gradient(90deg, var(--gold), rgba(185,154,108,0)); margin: 22px 0; }
  .totals { display: grid; grid-template-columns: repeat(4, auto); gap: 4px 20px; margin-top: 22px; justify-content: start; }
  .totals b { display: block; font: 500 29px/1 var(--font-display); }
  .totals span { font: 500 9.5px var(--font-mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); }
  .trip-list { overflow-y: auto; margin: 0 -8px; padding: 0 8px; flex: 1; -webkit-overflow-scrolling: touch; }
  /* Postcard: a photo (or the route drawn on paper), then the title and date. */
  .trip-card {
    display: block; width: 100%; padding: 0; margin: 0 0 18px; text-align: left; cursor: pointer;
    background: none; border: 0;
  }
  .tc-media {
    position: relative; height: clamp(92px, 16vh, 128px); border-radius: 14px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 40%, #F4EFE4, #E3DACA);
    box-shadow: 0 14px 30px -18px rgba(22,35,61,0.45);
  }
  .tc-media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; transition: transform 0.8s var(--ease-out); }
  .tc-media svg { position: absolute; inset: 14px 28px; width: calc(100% - 56px); height: calc(100% - 28px); }
  .trip-card:active .tc-media img { transform: scale(1.04); }
  .trip-card:active .tc-media { box-shadow: 0 8px 20px -14px rgba(22,35,61,0.5); }
  .tc-pill {
    position: absolute; left: 10px; top: 10px; display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px 5px 8px; border-radius: 999px; background: rgba(250,247,240,0.92);
    font: 500 9px var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase; color: #9A4E3E;
  }
  .tc-pill i { width: 6px; height: 6px; border-radius: 50%; background: #C0654A; animation: ping 2s infinite; }
  .tc-text { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 2px 0; }
  .tc-text h3 { font: 500 21px/1.1 var(--font-display); margin: 0; }
  .tc-meta { flex: 0 0 auto; font: 500 9.5px var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); text-align: right; }
  .live { display: inline-flex; align-items: center; gap: 6px; color: #9A4E3E; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: #C0654A; box-shadow: 0 0 0 0 rgba(192,101,74,0.6); animation: ping 2s infinite; }
  @keyframes ping { 70% { box-shadow: 0 0 0 9px rgba(192,101,74,0); } 100% { box-shadow: 0 0 0 0 rgba(192,101,74,0); } }
  .home-foot { font: 400 12px var(--font-body); color: var(--ink-faint); padding-top: 10px; display: flex; justify-content: space-between; }
  .home-foot a { color: var(--ink-soft); text-decoration: none; font: 500 10px var(--font-mono); letter-spacing: 0.16em; text-transform: uppercase; }

  /* ── Trip header ─────────────────────────────────────────────────────── */
  .trip-head { top: var(--top); left: var(--pad); max-width: min(520px, 46vw); padding: 20px 26px 20px; }
  .trip-head.off { transform: translateY(-16px); }
  .back { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; background: none; border: 0; padding: 4px 0; }
  .back svg { width: 14px; height: 14px; }
  .trip-head h1 { font: 500 clamp(34px, 4.2vw, 50px)/1 var(--font-display); margin: 8px 0 6px; letter-spacing: -0.01em; }
  .trip-head .sub { font-size: 14px; color: var(--ink-soft); line-height: 1.45; }
  .stats { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 14px; }
  .stats span { font: 500 10px var(--font-mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft); }
  .stats b { font: 500 19px var(--font-display); letter-spacing: 0; color: var(--ink); margin-right: 5px; text-transform: none; }
  body.sheet-open .trip-head .sub, body.sheet-open .trip-head .stats, body.sheet-open .trip-head .legend { display: none; }
  body.sheet-open .trip-head h1 { font-size: 30px; margin-bottom: 0; }
  body.sheet-open .trip-head { padding: 14px 22px 16px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line-soft); }
  .legend span { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-soft); }
  .legend i { width: 18px; height: 3px; border-radius: 3px; background: var(--c); }

  /* ── Day rail ────────────────────────────────────────────────────────── */
  .rail {
    left: var(--pad); right: var(--pad); bottom: max(22px, env(safe-area-inset-bottom));
    padding: 10px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
    -webkit-overflow-scrolling: touch; scroll-behavior: smooth;
  }
  .rail::-webkit-scrollbar { display: none; }
  .rail.off { transform: translateY(20px); }
  body.sheet-open .rail { right: calc(var(--pad) + var(--sheet-w) + 14px); }
  .chip {
    flex: 0 0 auto; min-width: 116px; max-width: 190px; padding: 11px 16px 12px; border-radius: 15px; cursor: pointer;
    text-align: left; border: 1px solid transparent; background: transparent; position: relative;
    transition: background 0.25s, color 0.25s, border-color 0.25s;
  }
  .chip .d { font: 500 9.5px var(--font-mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold-deep); display: flex; gap: 8px; align-items: center; }
  .chip .t { font: 500 18px/1.15 var(--font-display); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip:hover { background: rgba(255,255,255,0.5); }
  .chip.on { background: var(--ink); color: var(--paper); }
  .chip.on .d { color: var(--gold-light); }
  .chip.today { border-color: rgba(192,101,74,0.45); }
  .chip .tdot { width: 6px; height: 6px; border-radius: 50%; background: #C0654A; }
  .chip.past .t { opacity: 1; }
  .chip.future:not(.on) .t { color: var(--ink-soft); }

  /* ── Side sheet ──────────────────────────────────────────────────────── */
  :root { --sheet-w: min(410px, 36vw); }
  .sheet {
    top: calc(var(--top) + 60px); right: var(--pad); bottom: max(22px, env(safe-area-inset-bottom)); width: var(--sheet-w);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .sheet.off { transform: translateX(40px); }
  .sheet-scroll { overflow-y: auto; flex: 1; padding: 26px 26px 30px; -webkit-overflow-scrolling: touch; }
  .sheet-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
    border: 1px solid var(--line); background: rgba(255,255,255,0.5); flex: 0 0 auto;
  }
  .icon-btn svg { width: 15px; height: 15px; }
  .icon-btn:disabled { opacity: 0.3; }
  .sheet h2 { font: 500 38px/1.02 var(--font-display); margin: 12px 0 10px; letter-spacing: -0.01em; }
  .sheet .lede { font-size: 15px; line-height: 1.55; color: var(--ink-2); margin: 0; }
  .badge-today { display: inline-flex; gap: 7px; align-items: center; margin-top: 14px; padding: 6px 12px 6px 10px; border-radius: 999px; background: rgba(192,101,74,0.1); color: #9A4E3E; font: 500 10px var(--font-mono); letter-spacing: 0.16em; text-transform: uppercase; }
  .badge-today i { width: 7px; height: 7px; border-radius: 50%; background: #C0654A; animation: ping 2s infinite; }
  .section-label { font: 500 10px var(--font-mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); margin: 26px 0 10px; display: flex; align-items: center; gap: 8px; }
  .section-label i { width: 14px; height: 3px; border-radius: 2px; background: var(--c, var(--ink)); }
  .timeline { list-style: none; margin: 0; padding: 0; position: relative; }
  .timeline::before { content: ""; position: absolute; left: 15px; top: 16px; bottom: 16px; width: 1px; background: var(--line); }
  .timeline li { display: grid; grid-template-columns: 32px 1fr; gap: 14px; padding: 8px 0; cursor: pointer; position: relative; }
  .timeline li.nopin { cursor: default; }
  .num {
    width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
    font: 600 15px var(--font-display); background: var(--surface); border: 1.5px solid var(--ink); color: var(--ink); position: relative; z-index: 1;
  }
  .num.stay { background: var(--ink); color: var(--paper); }
  .num.home { background: var(--gold); border-color: var(--gold); color: var(--paper); }
  .num.airport { border-color: var(--ink-soft); }
  .num.none { border-style: dashed; border-color: var(--ink-faint); color: var(--ink-faint); }
  .num svg { width: 14px; height: 14px; }
  .timeline .nm { font: 500 20px/1.15 var(--font-display); }
  .timeline .ar { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .timeline .nt { font-size: 13.5px; color: var(--ink-2); margin-top: 4px; line-height: 1.45; }
  .timeline .tm { font: 500 9.5px var(--font-mono); letter-spacing: 0.14em; color: var(--gold-deep); text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .grid.two { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .grid button { padding: 0; border: 0; border-radius: 10px; overflow: hidden; aspect-ratio: 1; cursor: pointer; background: #E3DACA; }
  .grid.two button { aspect-ratio: 4/5; }
  .grid img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.6s var(--ease-out); }
  .grid button:active img { transform: scale(1.04); }
  .empty { padding: 22px 18px; border: 1px dashed var(--line); border-radius: 14px; font-size: 13.5px; color: var(--ink-soft); line-height: 1.5; text-align: center; }
  .visits { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .visits button { border: 1px solid var(--line); background: rgba(255,255,255,0.5); padding: 6px 12px; border-radius: 999px; font: 500 10px var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; }

  /* ── Map pins ────────────────────────────────────────────────────────── */
  .pin { cursor: pointer; transition: opacity 0.4s var(--ease), filter 0.4s; }
  .pin .dot {
    width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    background: var(--surface); border: 1.5px solid var(--ink); color: var(--ink);
    font: 600 15px var(--font-display); box-shadow: 0 6px 16px -6px rgba(22,35,61,0.55);
    transition: transform 0.35s var(--ease-out);
  }
  .pin.stay .dot { background: var(--ink); color: var(--paper); }
  .pin.home .dot { background: var(--gold); border-color: #fff; color: #fff; }
  .pin.home .dot svg { width: 14px; height: 14px; }
  .pin.airport .dot { width: 26px; height: 26px; background: var(--surface); border-color: var(--ink-soft); color: var(--ink); }
  .pin.airport .dot svg { width: 13px; height: 13px; }
  .pin.photo .dot {
    width: 50px; height: 50px; border: 2.5px solid #fff; padding: 0; overflow: hidden; background: #E3DACA;
    box-shadow: 0 0 0 1.5px var(--ink), 0 10px 22px -8px rgba(22,35,61,0.65);
  }
  .pin.photo .dot img { width: 100%; height: 100%; object-fit: cover; }
  .pin .n {
    position: absolute; top: -5px; right: -7px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px;
    background: var(--ink); color: var(--paper); font: 600 12px/20px var(--font-display); text-align: center; display: none;
  }
  .pin.photo .n { display: block; }
  .pin .more {
    position: absolute; bottom: -6px; right: -9px; height: 18px; padding: 0 6px; border-radius: 9px;
    background: var(--gold); color: #fff; font: 500 10px/18px var(--font-mono); display: none;
  }
  .pin.has-more .more { display: block; }
  .pin .lbl {
    position: absolute; left: calc(100% + 8px); top: 50%; transform: translateY(-50%);
    white-space: nowrap; font: italic 500 17px var(--font-display); color: var(--ink);
    text-shadow: 0 0 3px var(--paper), 0 0 3px var(--paper), 0 0 6px var(--paper), 0 0 10px var(--paper);
    opacity: 0; transition: opacity 0.4s; pointer-events: none;
  }
  .pin.labeled .lbl, .pin.sel .lbl { opacity: 1; }
  .pin.sel .dot { transform: scale(1.18); }
  .pin.dim { opacity: 0.38; }
  body.ambient .pin.dim { opacity: 0; pointer-events: none; }
  .pin.merged { opacity: 0 !important; pointer-events: none; }
  .pin.hidden { display: none; }
  .here { pointer-events: none; }
  .here i { position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%; background: #C0654A; border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
  .here b { position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%; background: rgba(192,101,74,0.45); animation: halo 2.4s var(--ease) infinite; }
  .here span { position: absolute; left: 16px; top: -12px; white-space: nowrap; font: 500 9.5px var(--font-mono); letter-spacing: 0.16em; text-transform: uppercase; color: #9A4E3E; background: rgba(250,247,240,0.9); padding: 4px 8px; border-radius: 6px; }
  @keyframes halo { 0% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(4.2); opacity: 0; } }
  .trip-tag {
    cursor: pointer; padding: 8px 14px 9px; border-radius: 12px; background: var(--glass); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: var(--shadow); white-space: nowrap;
  }
  .trip-tag .k { font: 500 9px var(--font-mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold-deep); }
  .trip-tag .t { font: 500 19px var(--font-display); display: flex; align-items: center; gap: 8px; }
  .trip-tag .t i { width: 14px; height: 3px; border-radius: 2px; background: var(--c); }
  .comet { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid var(--c, var(--ink)); box-shadow: 0 0 0 6px rgba(255,255,255,0.35), 0 4px 10px rgba(0,0,0,0.25); }

  /* ── Lightbox ────────────────────────────────────────────────────────── */
  .lightbox {
    position: fixed; inset: 0; z-index: 60; display: grid; grid-template-columns: 1fr min(360px, 32vw);
    background: #0F1828; color: var(--paper); opacity: 0; pointer-events: none; transition: opacity 0.45s var(--ease);
  }
  .lightbox.on { opacity: 1; pointer-events: auto; }
  .lb-stage { position: relative; overflow: hidden; }
  .lb-stage .bg { position: absolute; inset: -60px; background-size: cover; background-position: center; filter: blur(50px) saturate(1.1) brightness(0.55); transform: scale(1.1); transition: background-image 0.5s; }
  .lb-stage img.ph { position: absolute; inset: 28px; width: calc(100% - 56px); height: calc(100% - 56px); object-fit: contain; transition: opacity 0.35s var(--ease); filter: drop-shadow(0 30px 40px rgba(0,0,0,0.45)); }
  .lb-stage img.ph.fade { opacity: 0; }
  .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 54px; height: 54px; border-radius: 50%; border: 1px solid rgba(239,234,224,0.25); background: rgba(15,24,40,0.45); color: var(--paper); display: grid; place-items: center; cursor: pointer; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .lb-nav.prev { left: 22px; } .lb-nav.next { right: 22px; }
  .lb-nav svg { width: 18px; height: 18px; }
  .lb-side { padding: max(28px, env(safe-area-inset-top)) 28px 28px; display: flex; flex-direction: column; gap: 14px; border-left: 1px solid rgba(239,234,224,0.12); overflow-y: auto; }
  .lb-side .kicker { color: var(--gold-light); }
  .lb-side h2 { font: 500 40px/1.02 var(--font-display); margin: 0; }
  .lb-side .ar { font-size: 13.5px; color: rgba(239,234,224,0.65); margin-top: -6px; }
  .lb-side .cap { font: italic 400 21px/1.4 var(--font-display); color: rgba(239,234,224,0.92); }
  .lb-mini { position: relative; height: 230px; border-radius: 16px; overflow: hidden; flex: 0 0 auto; border: 1px solid rgba(239,234,224,0.15); }
  .lb-mini > div { position: absolute; inset: 0; }
  .lb-close { position: absolute; top: max(22px, env(safe-area-inset-top)); left: 22px; z-index: 3; }
  .lb-btns { display: flex; gap: 8px; margin-top: auto; }
  .lb-btns button { flex: 1; height: 44px; border-radius: 999px; border: 1px solid rgba(239,234,224,0.25); background: transparent; color: var(--paper); font: 500 10.5px var(--font-mono); letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer; }
  .lb-count { font: 500 10px var(--font-mono); letter-spacing: 0.16em; color: rgba(239,234,224,0.5); }

  /* ── Ambient ─────────────────────────────────────────────────────────── */
  .amb-layer { position: fixed; inset: 0; z-index: 30; pointer-events: none; opacity: 0; transition: opacity 1.4s var(--ease); }
  .amb-layer.on { opacity: 1; pointer-events: auto; }
  .amb-catcher { position: fixed; inset: 0; z-index: 25; display: none; }
  body.ambient .amb-catcher { display: block; }

  .amb-caption { left: calc(var(--pad) + 10px); bottom: calc(max(22px, env(safe-area-inset-bottom)) + 18px); max-width: min(720px, 64vw); z-index: 40; pointer-events: none; }
  .amb-caption .kicker { font-size: 11.5px; }
  .amb-caption h2 { font: 500 clamp(44px, 6vw, 76px)/0.98 var(--font-display); margin: 12px 0 12px; letter-spacing: -0.015em; text-shadow: 0 0 30px rgba(239,234,224,0.9), 0 0 12px rgba(239,234,224,0.9); }
  .amb-caption p { font: italic 400 22px/1.4 var(--font-display); margin: 0; color: var(--ink-2); text-shadow: 0 0 16px rgba(239,234,224,1), 0 0 8px rgba(239,234,224,1); }
  .amb-caption .line { width: 60px; height: 1px; background: var(--gold); margin-top: 18px; }
  .amb-caption > * { transition: opacity 0.9s var(--ease), transform 0.9s var(--ease-out); }
  .amb-caption.out > * { opacity: 0; transform: translateY(10px); }
  .amb-caption.out p { transition-delay: 0s; }
  .amb-caption:not(.out) h2 { transition-delay: 0.12s; }
  .amb-caption:not(.out) p { transition-delay: 0.3s; }
  .amb-caption.light h2 { color: var(--paper); text-shadow: 0 2px 30px rgba(0,0,0,0.45); }
  .amb-caption.light p { color: rgba(239,234,224,0.92); text-shadow: 0 2px 16px rgba(0,0,0,0.6); }
  .amb-caption.light .kicker { color: var(--gold-light); }
  .amb-caption.card { padding: 26px 30px 28px; border-radius: 22px; background: var(--glass); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .amb-caption.card h2, .amb-caption.card p { text-shadow: none; }
  .amb-thumbs { display: flex; gap: 8px; margin-top: 16px; }
  .amb-thumbs img { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; border: 2px solid #fff; box-shadow: 0 8px 16px -8px rgba(0,0,0,0.5); }

  .amb-brand { top: var(--top); left: calc(var(--pad) + 6px); z-index: 40; pointer-events: none; }
  .amb-brand .kicker { font-size: 10px; letter-spacing: 0.3em; }
  .amb-brand div:last-child { font: 500 30px/1 var(--font-display); margin-top: 4px; }
  .amb-clock { top: var(--top); right: calc(var(--pad) + 6px); z-index: 40; pointer-events: none; text-align: right; }
  .amb-clock .tm { font: 400 44px/1 var(--font-display); }
  .amb-clock .kicker { margin-top: 6px; }
  .amb-brand, .amb-clock, .amb-caption { opacity: 0; }
  body.ambient .amb-brand, body.ambient .amb-clock { opacity: 1; }
  body.ambient .amb-caption { opacity: 1; }
  body.ambient.dark-scene .amb-brand, body.ambient.dark-scene .amb-clock { color: var(--paper); }
  body.ambient.dark-scene .amb-brand .kicker, body.ambient.dark-scene .amb-clock .kicker { color: var(--gold-light); }
  .amb-hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: 14px; z-index: 41; font: 500 9.5px var(--font-mono); letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-faint); pointer-events: none; opacity: 0; transition: opacity 1s; }
  body.ambient .amb-hint { opacity: 1; }
  body.ambient.dark-scene .amb-hint { color: rgba(239,234,224,0.45); }

  /* Collage */
  .collage { background: radial-gradient(ellipse at 50% 50%, #F7F3EA 0%, #EFEAE0 60%, #E6DECE 100%); overflow: hidden; }
  .collage svg.trace { position: absolute; inset: 8% 10%; width: 80%; height: 84%; opacity: 0.5; }
  .collage .ghost { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; font: italic 400 clamp(80px, 12vw, 170px)/0.9 var(--font-display); color: rgba(22,35,61,0.07); white-space: nowrap; pointer-events: none; }
  .float {
    position: absolute; left: 0; top: 0; will-change: transform; cursor: pointer; border-radius: 6px; overflow: visible;
  }
  .float img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 6px; box-shadow: 0 28px 50px -22px rgba(22,35,61,0.55), 0 4px 12px -6px rgba(22,35,61,0.25); background: #E3DACA; }
  .float .fc { position: absolute; left: 2px; top: calc(100% + 9px); white-space: nowrap; font: 500 9.5px var(--font-mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft); }
  .float.l0 { filter: saturate(0.75) brightness(1.03); opacity: 0.6; }
  .float.l0 .fc, .float.l1 .fc { display: none; }

  /* Spotlight */
  .spot { background: #0F1828; overflow: hidden; }
  .spot .bg { position: absolute; inset: -80px; background-size: cover; background-position: center; filter: blur(60px) saturate(1.1) brightness(0.5); }
  .spot img.hero { position: absolute; left: 50%; top: 50%; max-width: 92vw; max-height: 88vh; transform: translate(-50%, -50%) scale(1); transform-origin: center; box-shadow: 0 40px 90px -30px rgba(0,0,0,0.75); border-radius: 4px; }
  .spot img.hero.cover { left: 0; top: 0; transform: none; max-width: none; max-height: none; width: 100vw; height: 100vh; object-fit: cover; border-radius: 0; box-shadow: none; }
  .spot .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,16,28,0.35) 0%, transparent 22%, transparent 55%, rgba(10,16,28,0.72) 100%); }
  .fly-photo { position: fixed; z-index: 45; pointer-events: none; overflow: hidden; background-size: cover; background-position: center; will-change: transform, border-radius; }

  /* ── Phones (portrait): map on top, content in a bottom sheet ─────────── */
  @media (max-width: 760px) {
    :root { --pad: 12px; --top: max(12px, env(safe-area-inset-top)); --sheet-w: 100vw; }
    .pill { width: 44px; height: 44px; padding: 0; justify-content: center; }
    .pill .lbl { display: none; }
    .controls { gap: 8px; }

    .home-panel {
      top: 40vh; top: 40dvh; left: 0; right: 0; bottom: 0; width: auto; max-height: none;
      border-radius: 24px 24px 0 0; border-bottom: 0; padding: 22px 20px calc(14px + env(safe-area-inset-bottom));
      overflow-y: auto; display: block; -webkit-overflow-scrolling: touch;
    }
    .home-panel.off { transform: translateY(30px); }
    .home-panel .masthead { font-size: 44px; }
    .totals { margin-top: 14px; gap: 2px 14px; }
    .totals b { font-size: 23px; }
    .totals span { font-size: 8.5px; letter-spacing: 0.14em; }
    .rule { margin: 16px 0 14px; }
    .trip-list { overflow: visible; margin: 0; padding: 0; }
    .tc-media { height: 150px; }
    .trip-tag { display: none; }

    .trip-head { right: calc(var(--pad) + 152px); max-width: none; padding: 10px 14px 11px; border-radius: 16px; }
    .trip-head h1 { font-size: 21px; margin: 2px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .trip-head .back { font-size: 9px; padding: 0; }
    .trip-head .sub, .trip-head .stats, .trip-head .legend { display: none; }
    body.sheet-open .trip-head h1 { font-size: 21px; }
    body.sheet-open .trip-head { padding: 10px 14px 11px; }

    .rail { left: 0; right: 0; bottom: 0; border-radius: 20px 20px 0 0; border-bottom: 0; padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); }
    .chip { min-width: 96px; padding: 9px 12px 10px; }
    .chip .t { font-size: 16px; }
    body.sheet-open .rail { display: none; }

    .sheet { top: 50vh; top: 50dvh; left: 0; right: 0; bottom: 0; width: auto; border-radius: 24px 24px 0 0; border-bottom: 0; }
    .sheet.off { transform: translateY(40px); }
    .sheet-scroll { padding: 20px 20px calc(24px + env(safe-area-inset-bottom)); }
    .sheet h2 { font-size: 30px; }

    .lightbox { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    .lb-stage img.ph { inset: 12px; width: calc(100% - 24px); height: calc(100% - 24px); }
    .lb-nav { width: 42px; height: 42px; }
    .lb-nav.prev { left: 10px; } .lb-nav.next { right: 10px; }
    .lb-side { padding: 16px 20px calc(16px + env(safe-area-inset-bottom)); gap: 8px; border-left: 0; border-top: 1px solid rgba(239,234,224,0.12); max-height: 42vh; }
    .lb-side h2 { font-size: 28px; }
    .lb-side .cap { font-size: 18px; }
    .lb-mini { display: none; }

    .amb-caption { max-width: calc(100vw - 2 * var(--pad) - 20px); }
    .amb-caption h2 { font-size: 38px; }
    .amb-caption p { font-size: 18px; }
    .amb-clock .tm { font-size: 30px; }
  }
  /* ── Short landscape screens (phones on their side) ───────────────────── */
  @media (max-height: 520px) and (min-width: 761px) {
    .home-panel { padding: 18px 22px 12px; }
    .home-panel .masthead { font-size: 38px; }
    .totals { margin-top: 10px; } .totals b { font-size: 22px; }
    .rule { margin: 12px 0; }
    .tc-media { height: 96px; }
    .trip-head { padding: 12px 18px; }
    .trip-head h1 { font-size: 26px; margin: 4px 0 0; }
    .trip-head .sub, .trip-head .stats, .trip-head .legend { display: none; }
    .chip { padding: 8px 12px; } .chip .t { font-size: 16px; }
    .amb-caption h2 { font-size: 40px; }
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="paper-overlay"></div>

<!-- Top-right controls -->
<div class="ui controls" id="controls">
  <a class="pill compact" id="btn-add" href="#" aria-label="Add a journey">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 2.5v11M2.5 8h11"/></svg>
    <span class="lbl">Add journey</span>
  </a>
  <a class="pill compact" id="btn-edit" href="#" hidden aria-label="Edit this journey">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M10.6 2.6l2.8 2.8-8 8H2.6v-2.8z"/><path d="M9 4.2l2.8 2.8"/></svg>
    <span class="lbl">Edit</span>
  </a>
  <button class="pill" id="btn-home" hidden aria-label="All journeys">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6.2"/><path d="M1.8 8h12.4M8 1.8c2 2 2 10.4 0 12.4M8 1.8c-2 2-2 10.4 0 12.4"/></svg>
    <span class="lbl">All journeys</span>
  </button>
  <button class="pill dark" id="btn-play" aria-label="Slideshow">
    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M4.5 2.8v10.4L13 8z"/></svg>
    <span class="lbl">Slideshow</span>
  </button>
</div>

<!-- Home -->
<section class="ui glass home-panel off" id="home-panel"></section>

<!-- Trip -->
<section class="ui glass trip-head off" id="trip-head"></section>
<nav class="ui glass rail off" id="rail"></nav>
<aside class="ui glass sheet off" id="sheet"><div class="sheet-scroll" id="sheet-body"></div></aside>

<!-- Ambient -->
<div class="amb-catcher" id="amb-catcher"></div>
<div class="amb-layer collage" id="collage"></div>
<div class="amb-layer spot" id="spot"></div>
<div class="ui amb amb-brand"><div class="kicker" id="amb-family"></div><div id="amb-name"></div></div>
<div class="ui amb amb-clock"><div class="tm" id="clock-time"></div><div class="kicker" id="clock-date"></div></div>
<div class="ui amb amb-caption out" id="amb-caption"></div>
<div class="amb-hint">Tap anywhere to explore</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <div class="lb-stage" id="lb-stage">
    <div class="bg" id="lb-bg"></div>
    <img class="ph" id="lb-img" alt="">
    <button class="icon-btn lb-close" id="lb-close" aria-label="Close" style="background:rgba(15,24,40,0.5);border-color:rgba(239,234,224,0.25);color:var(--paper)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l10 10M13 3L3 13"/></svg>
    </button>
    <button class="lb-nav prev" id="lb-prev" aria-label="Previous"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 2.5L4.5 8l5.5 5.5"/></svg></button>
    <button class="lb-nav next" id="lb-next" aria-label="Next"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 2.5L11.5 8 6 13.5"/></svg></button>
  </div>
  <div class="lb-side" id="lb-side"></div>
</div>

<script src="/trips/vendor/maplibre-gl-5.24.1.js"></script>
<script src="/trips/atlas.js"></script>
<script>
(() => {
  const A = window.Atlas;
  const { esc } = A;
  const params = new URLSearchParams(location.search);
  const IDLE_MS = (Number(params.get("idle")) || 180) * 1000; // slideshow starts after 3 quiet minutes
  const REFRESH_MS = 10 * 60 * 1000;

  const S = {
    trips: [],
    view: "home",     // "home" | "trip"
    trip: null,       // current trip object
    day: null,        // selected day number (null = whole trip)
    place: null,      // selected place
    ambient: false,
  };
  let map, mini;
  let markers = [];
  let tagMarkers = [];
  let hereMarkers = [];
  const placeCache = new WeakMap();

  // ─── Utilities ─────────────────────────────────────────────────────────────
  const $ = (id) => document.getElementById(id);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const ICON = {
    home: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.6 1.5 7.2h1.9V14h3.7V9.8h1.8V14h3.7V7.2h1.9z"/></svg>',
    plane: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M15 9.2V7.9L9.3 4.6V1.9C9.3 1.2 8.7.6 8 .6s-1.3.6-1.3 1.3v2.7L1 7.9v1.3l5.7-1.6v3.1L5.1 11.9V13L8 12.2l2.9.8v-1.1l-1.6-1.2V7.6z"/></svg>',
    back: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 2.5L4.5 8l5.5 5.5"/></svg>',
    fwd: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 2.5L11.5 8 6 13.5"/></svg>',
    close: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l10 10M13 3L3 13"/></svg>',
  };
  const visiblePhotos = (trip) => (trip.photos || []).filter((p) => !p.hidden);
  const fmtNum = (n) => n.toLocaleString("en-US");
  function placesOf(trip) {
    if (!placeCache.has(trip)) placeCache.set(trip, A.places(trip));
    return placeCache.get(trip);
  }
  const dayOf = (trip, n) => trip.days.find((d) => d.n === n);
  const groupOf = (trip, id) => (trip.groups || []).find((g) => g.id === id);

  // Where a photo lives on the map: its own GPS, else its stop, else that day's lodging.
  function photoPlace(trip, p) {
    const pl = placesOf(trip);
    const stop = p.stopId && trip.stops.find((s) => s.id === p.stopId);
    const place = stop ? pl.byStop.get(stop.id) : null;
    const day = p.day || (stop && stop.day) || null;
    let lngLat = A.hasXY(p) ? [p.lng, p.lat] : place ? [place.lng, place.lat] : null;
    let fallbackPlace = place;
    if (!lngLat && day) {
      const ds = trip.stops.filter((s) => s.day === day && A.hasXY(s));
      const pick = ds.find((s) => s.kind !== "stay") || ds[0];
      if (pick) {
        lngLat = [pick.lng, pick.lat];
        fallbackPlace = pl.byStop.get(pick.id);
      }
    }
    if (!fallbackPlace && lngLat) {
      let best = null, bd = 4000;
      for (const q of pl.list) {
        const d = A.haversine(lngLat, [q.lng, q.lat]);
        if (d < bd) { bd = d; best = q; }
      }
      fallbackPlace = best;
    }
    return { place: fallbackPlace, stop, day, lngLat };
  }
  function photosForPlace(trip, place) {
    return visiblePhotos(trip).filter((p) => photoPlace(trip, p).place === place);
  }
  function photosForDay(trip, n) {
    return visiblePhotos(trip).filter((p) => photoPlace(trip, p).day === n);
  }
  function routeColor(trip, seg) {
    if (seg.groups && seg.groups.length === 1) return (groupOf(trip, seg.groups[0]) || {}).color || trip.color;
    return trip.color;
  }

  // ─── Data ──────────────────────────────────────────────────────────────────
  let dataSig = "";
  async function loadData() {
    const j = await A.api("data");
    const sig = JSON.stringify(j.trips.map((t) => [t.id, t.updatedAt, (t.photos || []).length, (t.photos || []).map((p) => p.caption + p.stopId + p.hidden).join(""), t.route && t.route.builtAt]));
    if (sig === dataSig) return false;
    dataSig = sig;
    S.trips = j.trips.filter((t) => !t.hidden).sort((a, b) => (b.startDate || "").localeCompare(a.startDate || ""));
    S.trips.forEach((t, i) => { if (!t.color) t.color = A.ROUTE_COLORS[i % A.ROUTE_COLORS.length]; });
    if (S.trip) S.trip = S.trips.find((t) => t.id === S.trip.id) || null;
    return true;
  }

  // ─── Map ───────────────────────────────────────────────────────────────────
  function initMap() {
    const style = A.mapStyle();
    style.projection = { type: "globe" };
    style.sky = { "atmosphere-blend": ["interpolate", ["linear"], ["zoom"], 0, 0.9, 4, 0.5, 6, 0] , "sky-color": "#EFEAE0", "horizon-color": "#F3EEE4", "fog-color": "#EFEAE0" };
    map = new maplibregl.Map({
      container: "map",
      style,
      center: [-92, 31],
      zoom: 3.4,
      minZoom: 1.6,
      maxZoom: 16,
      attributionControl: { compact: true, customAttribution: "© OpenStreetMap contributors · OpenFreeMap · Natural Earth" },
      dragRotate: false,
      pitchWithRotate: false,
      fadeDuration: 250,
    });
    map.touchZoomRotate.disableRotation();
    map.on("load", () => { const at = map.getContainer().querySelector(".maplibregl-ctrl-attrib"); if (at) at.classList.remove("maplibregl-compact-show"); });
    return new Promise((ok) => map.on("load", ok));
  }

  function routeFeatures() {
    const feats = [];
    for (const t of S.trips) {
      for (const seg of (t.route && t.route.segments) || []) {
        feats.push({
          type: "Feature",
          properties: { trip: t.id, day: seg.day, key: seg.key, color: routeColor(t, seg), straight: !!seg.straight, flight: seg.mode === "fly", groups: (seg.groups || []).join(",") },
          geometry: { type: "LineString", coordinates: seg.coords },
        });
      }
    }
    return { type: "FeatureCollection", features: feats };
  }

  function addRouteLayers() {
    map.addSource("routes", { type: "geojson", data: routeFeatures(), lineMetrics: true });
    map.addLayer({
      id: "routes-halo", type: "line", source: "routes", filter: ["!", ["get", "flight"]],
      layout: { "line-join": "round", "line-cap": "round" },
      paint: { "line-color": "#FBF8F1", "line-width": ["interpolate", ["linear"], ["zoom"], 3, 5, 8, 8, 13, 11], "line-opacity": 0.85, "line-blur": 0.5 },
    });
    map.addLayer({
      id: "routes-line", type: "line", source: "routes", filter: ["all", ["!", ["get", "straight"]], ["!", ["get", "flight"]]],
      layout: { "line-join": "round", "line-cap": "round" },
      paint: { "line-color": ["get", "color"], "line-width": ["interpolate", ["linear"], ["zoom"], 3, 2, 8, 3.4, 13, 5] },
    });
    map.addLayer({
      id: "routes-straight", type: "line", source: "routes", filter: ["all", ["get", "straight"], ["!", ["get", "flight"]]],
      layout: { "line-join": "round", "line-cap": "round" },
      paint: { "line-color": ["get", "color"], "line-width": ["interpolate", ["linear"], ["zoom"], 3, 2, 8, 3, 13, 4], "line-dasharray": [1, 2.2] },
    });
    // Flights: a fine dashed arc, so they read as "flew" rather than "drove"
    map.addLayer({
      id: "routes-flight", type: "line", source: "routes", filter: ["get", "flight"],
      layout: { "line-cap": "round" },
      paint: { "line-color": ["get", "color"], "line-width": ["interpolate", ["linear"], ["zoom"], 1, 1.2, 6, 1.8], "line-dasharray": [0.2, 2.4] },
    });
    // Wide invisible line so a fingertip can hit a route on the overview map
    map.addLayer({ id: "routes-hit", type: "line", source: "routes", paint: { "line-color": "#000", "line-opacity": 0.001, "line-width": 26 } });
    map.on("click", "routes-hit", (e) => {
      if (S.view !== "home" || S.ambient) return;
      const id = e.features[0] && e.features[0].properties.trip;
      const t = S.trips.find((x) => x.id === id);
      if (t) openTrip(t);
    });
    map.on("mouseenter", "routes-hit", () => { if (S.view === "home") map.getCanvas().style.cursor = "pointer"; });
    map.on("mouseleave", "routes-hit", () => { map.getCanvas().style.cursor = ""; });
  }

  // Emphasis: selected trip/day full strength; everything else recedes.
  function styleRoutes() {
    const t = S.trip ? S.trip.id : null;
    const d = S.day;
    let op;
    if (!t) op = 1;
    else if (d == null) op = ["case", ["==", ["get", "trip"], t], 1, 0.12];
    else op = ["case", ["all", ["==", ["get", "trip"], t], ["==", ["get", "day"], d]], 1, ["==", ["get", "trip"], t], 0.22, 0.08];
    for (const id of ["routes-line", "routes-straight", "routes-flight"]) map.setPaintProperty(id, "line-opacity", op);
    map.setPaintProperty("routes-halo", "line-opacity", typeof op === "number" ? 0.85 : ["*", 0.85, op]);
    const w = d == null ? ["interpolate", ["linear"], ["zoom"], 3, 2, 8, 3.4, 13, 5]
      : ["interpolate", ["linear"], ["zoom"], 3, ["case", ["==", ["get", "day"], d], 3, 2], 8, ["case", ["==", ["get", "day"], d], 4.6, 3], 13, ["case", ["==", ["get", "day"], d], 6.5, 4.5]];
    map.setPaintProperty("routes-line", "line-width", w);
  }

  function padding() {
    const w = innerWidth, h = innerHeight;
    const narrow = w < 760;
    // home: extra headroom so trip labels can sit above their routes
    if (S.view === "home") return narrow ? { top: 70, bottom: h * 0.6 + 20, left: 24, right: 24 } : { top: Math.min(150, h * 0.24), bottom: 60, left: Math.min(400, w * 0.38) + 70, right: 90 };
    const head = $("trip-head").getBoundingClientRect();
    const sheetOpen = document.body.classList.contains("sheet-open");
    if (narrow) return { top: head.bottom + 24, bottom: sheetOpen ? h * 0.5 + 24 : 110, left: 28, right: 28 };
    return {
      top: sheetOpen ? head.bottom + 40 : Math.max(90, head.bottom * 0.55 + 30),
      bottom: 140,
      left: sheetOpen ? 70 : Math.min(head.right * 0.4 + 60, 260),
      right: sheetOpen ? Math.min(410, w * 0.36) + 80 : 90,
    };
  }

  function tripBounds(trip, dayN) {
    return A.bounds(A.focusPoints(trip, dayN == null ? null : dayN));
  }
  function allBounds() {
    const pts = [];
    for (const t of S.trips) for (const seg of (t.route && t.route.segments) || []) pts.push(...seg.coords);
    return A.bounds(pts);
  }

  function fit(b, opts = {}) {
    if (!b) return;
    const p = padding();
    const single = Math.abs(b[0][0] - b[1][0]) < 0.02 && Math.abs(b[0][1] - b[1][1]) < 0.02;
    if (single) return map.flyTo({ center: b[0], zoom: opts.maxZoom || 11, padding: p, duration: opts.duration ?? 1600, essential: true, curve: 1.3 });
    map.fitBounds(b, { padding: p, duration: opts.duration ?? 1600, maxZoom: opts.maxZoom || 11.5, essential: true, linear: false, ...(opts.extra || {}) });
  }
  const moveEnd = (ms = 4000) => new Promise((ok) => { let done = false; const f = () => { if (!done) { done = true; ok(); } }; map.once("moveend", f); setTimeout(f, ms); });

  // ─── Pins ──────────────────────────────────────────────────────────────────
  function clearMarkers() { markers.forEach((m) => m.marker.remove()); markers = []; }
  function clearTags() { tagMarkers.forEach((m) => m.remove()); tagMarkers = []; }

  function buildPins(trip) {
    clearMarkers();
    const pl = placesOf(trip);
    for (const place of pl.list) {
      const photos = photosForPlace(trip, place);
      const el = document.createElement("div");
      const cls = ["pin", place.kind === "home" ? "home" : place.kind === "airport" ? "airport" : place.kind === "stay" ? "stay" : "visit"];
      if (photos.length) cls.push("photo");
      el.className = cls.join(" ");
      const cover = photos.find((p) => p.featured) || photos[0];
      el.innerHTML = `<div class="dot">${cover ? `<img src="${A.photoUrl(cover, "t")}" alt="" loading="lazy">` : place.kind === "home" ? ICON.home : place.kind === "airport" ? ICON.plane : place.num}</div>
        <span class="n">${place.kind === "home" ? "⌂" : place.kind === "airport" ? "✈" : place.num}</span><span class="more"></span><span class="lbl">${esc(place.name)}</span>`;
      const root = document.createElement("div");
      root.appendChild(el);
      const marker = new maplibregl.Marker({ element: root, anchor: "center" }).setLngLat([place.lng, place.lat]).addTo(map);
      const m = { marker, el, place, photos, members: [place] };
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        if (S.ambient) return;
        poke();
        if (m.members.length > 1) {
          const b = A.bounds(m.members.map((p) => [p.lng, p.lat]));
          fit(b, { maxZoom: 15 });
        } else openPlace(place);
      });
      markers.push(m);
    }
    updatePins();
  }

  function updatePins() {
    if (!markers.length || !S.trip) return;
    const sel = S.place;
    const d = S.day;
    const tw = today(S.trip);
    for (const m of markers) {
      const inDay = d == null || m.place.days.includes(d) || (m.place.kind === "home" && (d === 1 || d === Math.max(...S.trip.days.map((x) => x.n))));
      m.el.classList.toggle("dim", !inDay);
      m.el.classList.toggle("sel", m.place === sel);
      m.el.classList.toggle("labeled", d != null && inDay);
      m.inDay = inDay;
    }
    declutter();
  }

  // Greedy screen-space merge so nearby pins (a condo and the beach next door) don't overlap.
  let declutterQueued = false;
  function declutter() {
    if (declutterQueued) return;
    declutterQueued = true;
    requestAnimationFrame(() => {
      declutterQueued = false;
      const items = markers.map((m) => ({ m, p: map.project([m.place.lng, m.place.lat]) }));
      const prio = (m) => (m.place === S.place ? 100 : 0) + (m.inDay ? 50 : 0) + (m.photos.length ? 20 : 0) + (m.place.kind === "stay" ? 8 : 0) + (m.place.kind === "home" ? 6 : 0);
      items.sort((a, b) => prio(b.m) - prio(a.m));
      const leaders = [];
      for (const it of items) {
        const r = it.m.photos.length ? 40 : 30;
        const lead = leaders.find((L) => Math.hypot(L.p.x - it.p.x, L.p.y - it.p.y) < r);
        if (lead) { lead.m.members.push(it.m.place); it.m.members = [it.m.place]; it.m.el.classList.add("merged"); }
        else { it.m.members = [it.m.place]; it.m.el.classList.remove("merged"); leaders.push(it); }
      }
      for (const L of leaders) {
        const extra = L.m.members.length - 1;
        L.m.el.classList.toggle("has-more", extra > 0);
        L.m.el.querySelector(".more").textContent = extra > 0 ? `+${extra}` : "";
        if (extra > 0) L.m.el.classList.remove("labeled");
      }
    });
  }

  function buildTripTags() {
    clearTags();
    for (const t of S.trips) {
      const segs = (t.route && t.route.segments) || [];
      if (!segs.length) continue;
      // anchor the label at the trip's farthest point from home, where the story peaks
      const origin = A.hasXY(t.origin) ? [t.origin.lng, t.origin.lat] : segs[0].coords[0];
      let best = segs[0].coords[0], bd = 0;
      for (const s of segs) for (const c of s.coords) { const d = A.haversine(origin, c); if (d > bd) { bd = d; best = c; } }
      const el = document.createElement("div");
      el.className = "trip-tag";
      el.style.setProperty("--c", t.color);
      el.innerHTML = `<div class="k">${esc(A.fmt(t.startDate, { month: "short", year: "numeric" }))}</div><div class="t"><i></i>${esc(t.title)}</div>`;
      el.addEventListener("click", (e) => { e.stopPropagation(); if (!S.ambient) openTrip(t); });
      tagMarkers.push(new maplibregl.Marker({ element: el, anchor: "bottom", offset: [0, -18] }).setLngLat(best).addTo(map));
    }
    layoutTags();
  }

  // Trips in the same region would stack their labels; nudge each one up until it is clear.
  function layoutTags() {
    if (!tagMarkers.length) return;
    const items = tagMarkers.map((m) => {
      const p = map.project(m.getLngLat());
      const el = m.getElement();
      return { m, x: p.x, y: p.y, w: el.offsetWidth || 220, h: el.offsetHeight || 52 };
    }).sort((a, b) => b.y - a.y);
    const placed = [];
    // offsetLeft/Width ignore the panel's slide-in transform, so this is its resting edge
    const hp = $("home-panel");
    const panel = hp.classList.contains("off") ? 0 : hp.offsetLeft + hp.offsetWidth + 12;
    const top = $("controls").getBoundingClientRect().bottom + 8;
    const bottom = innerHeight - 16;
    const clear = (b) => b.t >= top && b.b <= bottom && !placed.some((q) => b.l < q.r + 6 && b.r > q.l - 6 && b.t < q.b + 6 && b.b > q.t - 6);
    for (const it of items) {
      // prefer the left of the point unless the home panel covers that side
      const leftOk = it.x - 14 - it.w >= panel;
      const sides = leftOk ? [-1, 1] : [1];
      const boxAt = (side, dy) => {
        const dx = side * (14 + it.w / 2);
        return { dx, dy, l: it.x + dx - it.w / 2, r: it.x + dx + it.w / 2, t: it.y + dy - it.h, b: it.y + dy };
      };
      // nearest spot first: just above (either side), a bit higher, just below, a bit lower …
      const tries = [];
      for (let k = 0; k < 8; k++) for (const sd of sides) { tries.push(boxAt(sd, -18 - k * (it.h + 8))); tries.push(boxAt(sd, it.h + 18 + k * (it.h + 8))); }
      tries.sort((a, b) => Math.abs(a.dy) - Math.abs(b.dy));
      const pick = tries.find(clear) || boxAt(sides[0], -18);
      it.m.setOffset([pick.dx, pick.dy]);
      placed.push(pick);
    }
  }


  function today(trip) { return A.today(trip); }

  function buildHere() {
    hereMarkers.forEach((m) => m.remove());
    hereMarkers = [];
    const trips = S.view === "trip" && S.trip ? [S.trip] : S.trips;
    for (const t of trips) {
      const td = today(t);
      if (!td) continue;
      for (const s of td.where) {
        const el = document.createElement("div");
        el.className = "here";
        const g = s.group ? groupOf(t, s.group) : null;
        el.innerHTML = `<b></b><i></i>${S.view === "trip" ? `<span>Today${g ? " · " + esc(g.name.split(/[ ,&]/)[0]) : ""}</span>` : ""}`;
        hereMarkers.push(new maplibregl.Marker({ element: el, anchor: "center" }).setLngLat([s.lng, s.lat]).addTo(map));
      }
    }
  }

  // ─── Views ─────────────────────────────────────────────────────────────────
  function setSheet(open) {
    $("sheet").classList.toggle("off", !open);
    document.body.classList.toggle("sheet-open", open);
  }

  // Totals across every journey; miles include flights.
  function totals(trips) {
    return trips.reduce((a, t) => {
      const s = A.tripStats(t);
      a.miles += s.miles + s.flown;
      a.nights += s.nights;
      (t.states || []).forEach((x) => a.states.add(x));
      (t.countries || []).forEach((x) => a.countries.add(x));
      if ((t.states || []).length) a.countries.add("United States");
      return a;
    }, { miles: 0, nights: 0, states: new Set(), countries: new Set() });
  }

  function renderHome() {
    const trips = S.trips;
    const tot = totals(trips);
    $("home-panel").innerHTML = `
      <div class="kicker">${esc(A.BRAND.family)}</div>
      <h1 class="masthead">${esc(A.BRAND.name)}</h1>
      <div class="totals">
        <div><b>${trips.length}</b><span>${trips.length === 1 ? "Journey" : "Journeys"}</span></div>
        <div><b>${fmtNum(tot.miles)}</b><span>Miles</span></div>
        <div><b>${tot.countries.size}</b><span>${tot.countries.size === 1 ? "Country" : "Countries"}</span></div>
        <div><b>${tot.states.size}</b><span>States</span></div>
      </div>
      <div class="rule"></div>
      <div class="trip-list">${trips.map(tripCard).join("") || `<div class="empty">No journeys yet. Add one from the admin page.</div>`}</div>
      <div class="home-foot"><span>Tap a journey to open it</span><a href="${A.adminHome}">Admin</a></div>`;
    $("home-panel").querySelectorAll("[data-trip]").forEach((b) => b.addEventListener("click", () => openTrip(S.trips.find((t) => t.id === b.dataset.trip))));
  }

  function routeSvg(trip, stroke = "rgba(22,35,61,0.55)", w = 1.6) {
    const segLen = (c) => { let L = 0; for (let i = 1; i < c.length; i++) L += A.haversine(c[i - 1], c[i]); return L; };
    const segs = ((trip.route && trip.route.segments) || []).filter((s) => s.mode !== "fly" && segLen(s.coords) > 15000);
    const b = A.bounds(A.focusPoints(trip));
    if (!b) return "";
    const lat0 = ((b[0][1] + b[1][1]) / 2) * Math.PI / 180;
    const sx = Math.cos(lat0);
    const W = (b[1][0] - b[0][0]) * sx || 1, H = b[1][1] - b[0][1] || 1;
    const k = 100 / Math.max(W, H);
    const pts = (c) => c.map(([x, y]) => `${((x - b[0][0]) * sx * k).toFixed(2)},${((b[1][1] - y) * k).toFixed(2)}`).join(" ");
    return `<svg viewBox="-4 -4 ${(W * k + 8).toFixed(1)} ${(H * k + 8).toFixed(1)}" preserveAspectRatio="xMidYMid meet">${segs.map((s) => `<polyline points="${pts(s.coords)}" fill="none" stroke="${s.groups && s.groups.length === 1 ? routeColor(trip, s) : stroke}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`).join("")}</svg>`;
  }

  function tripCard(t) {
    const s = A.tripStats(t);
    const td = today(t);
    const ph = visiblePhotos(t);
    const cover = ph.find((p) => p.id === t.coverPhotoId) || ph.find((p) => p.featured) || ph[0];
    const when = A.fmt(t.startDate, { month: "short", year: "numeric" });
    return `<button class="trip-card" data-trip="${esc(t.id)}">
      <div class="tc-media">${cover ? `<img src="${A.photoUrl(cover, "t")}" alt="" loading="lazy">` : routeSvg(t, t.color, 1.8)}
        ${td ? `<span class="tc-pill"><i></i>Day ${td.dayIndex} of ${td.totalDays}</span>` : ""}</div>
      <div class="tc-text"><h3>${esc(t.title)}</h3><div class="tc-meta">${esc(when)}<br>${s.nights} nights</div></div>
    </button>`;
  }

  // Add/Edit jump to the admin page, pointed at whatever is on screen.
  function syncButtons() {
    const t = S.view === "trip" && S.trip;
    $("btn-add").hidden = !!t;
    $("btn-edit").hidden = !t;
    $("btn-add").href = `${A.adminHome}?new=1`;
    if (t) $("btn-edit").href = `${A.adminHome}?trip=${encodeURIComponent(t.id)}&tab=itinerary${S.day != null ? `&day=${S.day}` : ""}`;
  }

  function goHome({ duration = 2000 } = {}) {
    S.view = "home"; S.trip = null; S.day = null; S.place = null;
    $("btn-home").hidden = true;
    S.view = "home";
    syncButtons();
    $("trip-head").classList.add("off");
    $("rail").classList.add("off");
    setSheet(false);
    clearMarkers();
    renderHome();
    $("home-panel").classList.remove("off");
    styleRoutes();
    buildTripTags();
    buildHere();
    const b = allBounds();
    if (b) fit(b, { duration, maxZoom: 5.6 });
    else map.flyTo({ center: [-92, 33], zoom: 3.4, duration });
  }

  function openTrip(t, { day = null, place = null, duration = 1800 } = {}) {
    poke();
    S.view = "trip"; S.trip = t; S.day = day; S.place = null;
    $("btn-home").hidden = false;
    $("home-panel").classList.add("off");
    clearTags();
    renderTripHead();
    renderRail();
    $("trip-head").classList.remove("off");
    $("rail").classList.remove("off");
    buildPins(t);
    buildHere();
    styleRoutes();
    if (place) return openPlace(place, { duration });
    if (day != null) return selectDay(day, { duration });
    setSheet(false);
    requestAnimationFrame(() => fit(tripBounds(t), { duration }));
  }

  function renderTripHead() {
    const t = S.trip;
    const s = A.tripStats(t);
    const multi = (t.groups || []).length && t.route && t.route.segments.some((x) => x.groups);
    $("trip-head").innerHTML = `
      <button class="back kicker" id="hd-back">${ICON.back}All journeys</button>
      <h1>${esc(t.title)}</h1>
      <div class="sub">${esc(A.dateRange(t.startDate, t.endDate))}${t.subtitle ? ` · ${esc(t.subtitle)}` : ""}</div>
      <div class="stats">
        <span><b>${fmtNum(s.miles)}</b>miles driven</span>${s.flown ? `<span><b>${fmtNum(s.flown)}</b>flown</span>` : ""}<span><b>${s.nights}</b>nights</span><span><b>${s.stops}</b>stops</span>${s.countries > 1 ? `<span><b>${s.countries}</b>countries</span>` : s.states ? `<span><b>${s.states}</b>states</span>` : ""}${s.photos ? `<span><b>${s.photos}</b>photos</span>` : ""}
      </div>
      ${multi ? `<div class="legend"><span style="--c:${t.color}"><i></i>Everyone</span>${t.groups.map((g) => `<span style="--c:${g.color}"><i></i>${esc(g.name)}</span>`).join("")}</div>` : ""}`;
    $("hd-back").addEventListener("click", () => goHome());
  }

  function renderRail() {
    const t = S.trip;
    syncButtons();
    const td = today(t);
    const tStr = A.ymd(new Date());
    $("rail").innerHTML = `<button class="chip ${S.day == null ? "on" : ""}" data-day=""><div class="d">${t.days.length} days</div><div class="t">The whole trip</div></button>` +
      t.days.map((d) => {
        const isToday = td && td.day && td.day.n === d.n;
        const when = (d.dateEnd || d.date) < tStr ? "past" : d.date > tStr ? "future" : "";
        return `<button class="chip ${S.day === d.n ? "on" : ""} ${isToday ? "today" : ""} ${when}" data-day="${d.n}">
          <div class="d">${isToday ? '<i class="tdot"></i>Today' : `Day ${d.n}`} · ${esc(A.fmt(d.date, { weekday: "short" }))} ${esc(A.fmt(d.date, { day: "numeric" }))}${d.dateEnd && d.dateEnd !== d.date ? `–${esc(A.fmt(d.dateEnd, { day: "numeric" }))}` : ""}</div>
          <div class="t">${esc(d.title || A.dayLabel(d))}</div></button>`;
      }).join("");
    $("rail").querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => {
      poke();
      const n = c.dataset.day === "" ? null : Number(c.dataset.day);
      if (n == null) { S.day = null; S.place = null; setSheet(false); renderRail(); updatePins(); styleRoutes(); fit(tripBounds(S.trip)); }
      else selectDay(n);
    }));
    const on = $("rail").querySelector(".chip.on");
    if (on) on.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
  }

  function selectDay(n, { duration = 1500 } = {}) {
    const t = S.trip;
    S.day = n; S.place = null;
    renderRail();
    renderDaySheet();
    setSheet(true);
    updatePins();
    styleRoutes();
    requestAnimationFrame(() => fit(tripBounds(t, n) || tripBounds(t), { duration, maxZoom: 11 }));
  }

  function stopRow(t, s) {
    const pl = placesOf(t);
    const place = pl.byStop.get(s.id);
    const n = place ? (place.kind === "home" ? ICON.home : place.kind === "airport" ? ICON.plane : place.num) : "·";
    const cls = !place ? "none" : place.kind === "home" ? "home" : place.kind === "airport" ? "airport" : s.kind === "stay" ? "stay" : "";
    return `<li class="${place ? "" : "nopin"}" data-stop="${esc(s.id)}">
      <div class="num ${cls}">${n}</div>
      <div>${s.time ? `<div class="tm">${esc(s.time)}</div>` : ""}<div class="nm">${esc(s.name)}</div>
      ${s.area ? `<div class="ar">${esc(s.area)}${s.kind === "stay" ? " · overnight" : ""}</div>` : s.kind === "stay" ? `<div class="ar">Overnight</div>` : ""}
      ${s.note ? `<div class="nt">${esc(s.note)}</div>` : ""}</div></li>`;
  }

  function renderDaySheet() {
    const t = S.trip;
    const d = dayOf(t, S.day);
    const td = today(t);
    const stops = t.stops.filter((s) => s.day === S.day);
    const shared = stops.filter((s) => !s.group);
    const groups = (t.groups || []).filter((g) => stops.some((s) => s.group === g.id));
    let tl;
    if (!groups.length) tl = `<ul class="timeline">${stops.map((s) => stopRow(t, s)).join("")}</ul>`;
    else {
      const firstGroupIdx = stops.findIndex((s) => s.group);
      const before = shared.filter((s) => stops.indexOf(s) < firstGroupIdx);
      const after = shared.filter((s) => stops.indexOf(s) > firstGroupIdx);
      tl = (before.length ? `<div class="section-label" style="--c:${t.color}"><i></i>Everyone</div><ul class="timeline">${before.map((s) => stopRow(t, s)).join("")}</ul>` : "") +
        groups.map((g) => `<div class="section-label" style="--c:${g.color}"><i></i>${esc(g.name)}</div><ul class="timeline">${stops.filter((s) => s.group === g.id).map((s) => stopRow(t, s)).join("")}</ul>`).join("") +
        (after.length ? `<div class="section-label" style="--c:${t.color}"><i></i>Together again</div><ul class="timeline">${after.map((s) => stopRow(t, s)).join("")}</ul>` : "");
    }
    const ph = photosForDay(t, S.day);
    const idx = t.days.findIndex((x) => x.n === S.day);
    $("sheet-body").innerHTML = `
      <div class="sheet-top">
        <div class="kicker">Day ${d.n} · ${esc(A.dayLong(d))}</div>
        <div style="display:flex;gap:6px">
          <button class="icon-btn" id="sh-prev" ${idx <= 0 ? "disabled" : ""} aria-label="Previous day">${ICON.back}</button>
          <button class="icon-btn" id="sh-next" ${idx >= t.days.length - 1 ? "disabled" : ""} aria-label="Next day">${ICON.fwd}</button>
          <button class="icon-btn" id="sh-close" aria-label="Close">${ICON.close}</button>
        </div>
      </div>
      <h2>${esc(d.title || A.dayLabel(d))}</h2>
      ${d.summary ? `<p class="lede">${esc(d.summary)}</p>` : ""}
      ${td && td.day && td.day.n === d.n ? `<div class="badge-today"><i></i>Today</div>` : ""}
      ${stops.length && !groups.length ? `<div class="section-label">The day</div>` : ""}
      ${tl}
      <div class="section-label">Photos${ph.length ? ` · ${ph.length}` : ""}</div>
      ${ph.length ? `<div class="grid">${ph.map((p, i) => `<button data-i="${i}"><img src="${A.photoUrl(p, "t")}" alt="" loading="lazy"></button>`).join("")}</div>` : `<div class="empty">No photos from this day yet.</div>`}`;
    $("sheet-body").scrollTop = 0;
    $("sh-prev").onclick = () => selectDay(t.days[idx - 1].n);
    $("sh-next").onclick = () => selectDay(t.days[idx + 1].n);
    $("sh-close").onclick = () => { S.day = null; S.place = null; setSheet(false); renderRail(); updatePins(); styleRoutes(); fit(tripBounds(t)); };
    $("sheet-body").querySelectorAll("[data-stop]").forEach((li) => li.addEventListener("click", () => {
      const place = placesOf(t).byStop.get(li.dataset.stop);
      if (place) openPlace(place);
    }));
    $("sheet-body").querySelectorAll(".grid [data-i]").forEach((b) => b.addEventListener("click", () => openLightbox(ph, Number(b.dataset.i))));
  }

  function openPlace(place, { duration = 1400 } = {}) {
    poke();
    const t = S.trip;
    S.place = place;
    if (S.day != null && !place.days.includes(S.day)) S.day = null;
    renderRail();
    const ph = photosForPlace(t, place);
    $("sheet-body").innerHTML = `
      <div class="sheet-top">

  // ─── Lightbox ──────────────────────────────────────────────────────────────

  // ─── Ambient engine ────────────────────────────────────────────────────────
  // A loop of scenes: the trip draws itself day by day, photos drift past, and single

  let run = 0;          // incremented to cancel the running loop

  async function startAmbient() {

  // Slideshow map margins were tuned on an iPad (1180×820); scale them to the screen.

  // Fly into a few days in order, drawing each day's drive as we arrive.
  async function sceneDays(t, count, me) {
    const days = t.days.filter((d) => t.stops.some((s) => s.day === d.n && A.hasXY(s)));

  // Route drawing: one temporary layer per segment with an animated line-gradient.
  let drawLayers = [];
  function clearDraw() {
    for (const id of drawLayers) { if (map.getLayer(id)) map.removeLayer(id); }
    drawLayers = [];
    if (map.getSource("draw")) map.removeSource("draw");

  }
  // Hide the static route for a trip (or for one of its days) while it is being drawn.
  function setRouteVisibility(tripId, visible, exceptDay = null) {
    let op;
    if (visible && exceptDay == null) { styleRoutes(); return; }
    if (!visible) op = ["case", ["==", ["get", "trip"], tripId], 0, 0.12];
    else op = ["case", ["all", ["==", ["get", "trip"], tripId], ["==", ["get", "day"], exceptDay]], 0, ["==", ["get", "trip"], tripId], 0.22, 0.08];

  let cometMarker = null;
  async function drawRoute(t, dayN, ms, me) {
    clearDraw();
    const segs = ((t.route && t.route.segments) || []).filter((s) => dayN == null || s.day === dayN);
    if (!segs.length) return;
    // cumulative length so long legs take proportionally longer
    const lens = segs.map((s) => { let L = 0; for (let i = 1; i < s.coords.length; i++) L += A.haversine(s.coords[i - 1], s.coords[i]); return L || 1; });

    let acc = 0;
    const dayStart = {};

    });
    const total = acc;
    map.addSource("draw", { type: "geojson", lineMetrics: true, data: { type: "FeatureCollection", features: segs.map((s, i) => ({ type: "Feature", properties: { i }, geometry: { type: "LineString", coordinates: s.coords } })) } });

      const id = `draw-${i}`;
      map.addLayer({ id, type: "line", source: "draw", filter: ["==", ["get", "i"], i], layout: { "line-cap": "round", "line-join": "round" },

    });

    el.className = "comet";
    el.style.setProperty("--c", t.color);
    cometMarker = new maplibregl.Marker({ element: el }).setLngLat(segs[0].coords[0]).addTo(map);
    const t0 = performance.now();
    await new Promise((ok) => {
      const frame = (now) => {
        if (me !== run) return ok();
        const k = Math.min(1, (now - t0) / ms);
        const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
        const D = e * total;
        let head = null;
        segs.forEach((s, i) => {
          const p = Math.max(0, Math.min(1, (D - starts[i]) / lens[i]));
          if (map.getLayer(`draw-${i}`)) map.setPaintProperty(`draw-${i}`, "line-gradient", p <= 0 ? ["step", ["line-progress"], "rgba(0,0,0,0)", 0, "rgba(0,0,0,0)"] : p >= 1 ? ["step", ["line-progress"], routeColor(t, s), 1, routeColor(t, s)] : ["step", ["line-progress"], routeColor(t, s), p, "rgba(0,0,0,0)"]);

  function pointAt(coords, dist) {
    let acc = 0;

  // Photos drifting across the page in three depths, over a faint trace of the route.
  let collageRAF = null;
  function stopCollage() { cancelAnimationFrame(collageRAF); collageRAF = null; }
  async function sceneCollage(t, me, ms = 26000) {
    AMB.ctx = { trip: t };
    const photos = visiblePhotos(t);
    const el = $("collage");
    el.innerHTML = `${routeSvg(t, "rgba(22,35,61,0.16)", 1.4).replace("<svg", '<svg class="trace"')}<div class="ghost">${esc(t.title)}</div>`;
    await caption("");
    const W = innerWidth, H = innerHeight;
    // Fewer, larger cards when there are only a handful of photos, so repeats aren't obvious.
    const scale = Math.min(W, H) / 820;
    const density = Math.min(1, photos.length / 14);
    const lanes = [
      { l: 0, s: [170, 220], speed: 12, n: Math.round(2 + 4 * density) },
      { l: 1, s: [240, 290], speed: 20, n: Math.round(2 + 3 * density) },
      { l: 2, s: [320, 380], speed: 30, n: Math.round(1 + 3 * density) },
    ];
    // never show more cards than about 1.5x the photos available
    let budget = Math.max(4, Math.ceil(photos.length * 1.5));
    for (const lane of [...lanes].reverse()) { lane.n = Math.max(1, Math.min(lane.n, budget - 1)); budget -= lane.n; }
    const pool = [...photos].sort(() => Math.random() - 0.5);
    let k = 0;
    const onScreen = () => new Set(cards.map((c) => c.p));
    const next = () => {
      const busy = onScreen();
      for (let i = 0; i < pool.length; i++) { const p = pool[(k + i) % pool.length]; if (!busy.has(p)) { k += i + 1; return p; } }
      return pool[k++ % pool.length];
    };
    const cards = [];
    const bandH = H / 3;
    const make = (lane, x) => {
      const p = next();
      const ar = p.width && p.height ? p.width / p.height : 1.33;
      const base = (lane.s[0] + Math.random() * (lane.s[1] - lane.s[0])) * scale;
      const w = base * Math.sqrt(ar);
      const h = base / Math.sqrt(ar);
      const c = document.createElement("div");
      c.className = `float l${lane.l}`;
      c.style.width = `${w}px`; c.style.height = `${h}px`; c.style.zIndex = String(10 + lane.l * 10);
      const where = photoPlace(t, p);
      const d = where.day ? dayOf(t, where.day) : null;
      c.innerHTML = `<img src="${A.photoUrl(p, "t")}" alt=""><div class="fc">${d ? `Day ${d.n} · ` : ""}${esc((where.place && where.place.name) || "")}</div>`;
      c.addEventListener("click", (e) => { e.stopPropagation(); const list = visiblePhotos(t); openPhotoFromAmbient(t, list, list.indexOf(p)); });
      el.appendChild(c);
      // spread cards over three horizontal bands so they don't bunch up
      const band = (cards.length + lane.l) % 3;
      const cy = bandH * band + bandH / 2 + (Math.random() - 0.5) * bandH * 0.5;
      const y = Math.max(110, Math.min(H - h - 60, cy - h / 2));
      const card = { c, p, lane, w, h, x, y, r: (Math.random() - 0.5) * 5, bob: Math.random() * 6.28 };
      cards.push(card);
      return card;
    };
    for (const lane of lanes) for (let i = 0; i < lane.n; i++) make(lane, -lane.s[1] * scale + ((i + Math.random() * 0.5) / lane.n) * (W + lane.s[1] * scale));
    el.classList.add("on");
    let last = performance.now();
    const tick = (now) => {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      for (let i = cards.length - 1; i >= 0; i--) {
        const cd = cards[i];
        cd.x += cd.lane.speed * dt;
        cd.bob += dt * 0.5;
        cd.c.style.transform = `translate3d(${cd.x.toFixed(1)}px, ${(cd.y + Math.sin(cd.bob) * 6).toFixed(1)}px, 0) rotate(${cd.r}deg)`;
        if (cd.x > W + 20) { cd.c.remove(); cards.splice(i, 1); make(cd.lane, -cd.w - 40 - Math.random() * 120); }
      }
      collageRAF = requestAnimationFrame(tick);
    };
    collageRAF = requestAnimationFrame(tick);
    await wait(ms, me);
    el.classList.remove("on");
    await wait(1400, me);
    stopCollage();
    el.innerHTML = "";
  }

  function openPhotoFromAmbient(t, list, i) {
    run++; // pause the loop; closing the photo resumes the slideshow
    S.ambient = false;
    document.body.classList.remove("ambient", "dark-scene");
    $("collage").classList.remove("on");
    $("spot").classList.remove("on");
    stopCollage();
    clearDraw();
    caption("");
    openLightbox(list, Math.max(0, i), { trip: t, resumeAmbient: true });
  }

  // One photo fills the room, then shrinks back to the exact spot on the map.
  async function sceneSpotlights(t, count, me) {
    const all = visiblePhotos(t);
    const ordered = [...all.filter((p) => p.featured), ...all.filter((p) => !p.featured)];
    for (let k = 0; k < count; k++) {
      guard(me);
      const ptr = AMB.photoPtr[t.id] || 0;
      const p = ordered[ptr % ordered.length];
      AMB.photoPtr[t.id] = ptr + 1;
      const where = photoPlace(t, p);
      const d = where.day ? dayOf(t, where.day) : null;
      AMB.ctx = { trip: t, day: where.day, place: where.place };
      // stage the map underneath while the photo is up
      S.trip = t; S.day = where.day || null; S.place = where.place || null;
      if (!markers.length || markers[0].place !== placesOf(t).list[0]) buildPins(t);
      updatePins(); styleRoutes();
      if (where.lngLat) map.jumpTo({ center: where.lngLat, zoom: 10.5, pitch: 30, bearing: 0, padding: { top: 0, bottom: 200, left: 0, right: 0 } });

      const src = A.photoUrl(p, "f");
      await new Promise((ok) => { const im = new Image(); im.onload = im.onerror = ok; im.src = src; });
      guard(me);
      const sp = $("spot");
      const ar = p.width && p.height ? p.width / p.height : 1.5;
      const landscape = ar >= innerWidth / innerHeight * 0.82;
      sp.innerHTML = `<div class="bg" style="background-image:url('${A.photoUrl(p, "t")}')"></div><img class="hero ${landscape ? "cover" : ""}" src="${src}" alt=""><div class="shade"></div>`;
      const hero = sp.querySelector(".hero");
      hero.addEventListener("click", (e) => { e.stopPropagation(); openPhotoFromAmbient(t, all, all.indexOf(p)); });
      sp.classList.add("on");
      document.body.classList.add("dark-scene");
      hero.animate([{ transform: `${landscape ? "" : "translate(-50%,-50%) "}scale(1.0)` }, { transform: `${landscape ? "" : "translate(-50%,-50%) "}scale(1.07)` }], { duration: 9000, easing: "linear", fill: "forwards" });
      await caption(`<div class="kicker">${d ? `Day ${d.n} · ${esc(A.dayLong(d))}` : esc(t.title)}</div><h2>${esc(p.title || (where.place && where.place.name) || (d && d.title) || t.title)}</h2>${p.caption ? `<p>${esc(p.caption)}</p>` : where.place && where.place.area ? `<p>${esc(where.place.area)}</p>` : ""}`, { light: true });
      await wait(7600, me);

      if (!where.lngLat) {
        sp.classList.remove("on"); document.body.classList.remove("dark-scene");
        await wait(1200, me);
        continue;
      }
      // shrink the photo down onto its pin
      await caption("");
      const r = hero.getBoundingClientRect();
      const target = map.project(where.lngLat);
      const fly = document.createElement("div");
      fly.className = "fly-photo";
      Object.assign(fly.style, { left: `${r.left}px`, top: `${r.top}px`, width: `${r.width}px`, height: `${r.height}px`, backgroundImage: `url('${src}')`, borderRadius: "4px" });
      document.body.appendChild(fly);
      sp.classList.remove("on");
      document.body.classList.remove("dark-scene");
      const size = 60;
      const anim = fly.animate([
        { transform: "translate(0,0) scale(1,1)", borderRadius: "4px", opacity: 1 },
        { transform: `translate(${target.x - size / 2 - r.left}px, ${target.y - size / 2 - r.top}px) scale(${size / r.width}, ${size / r.height})`, borderRadius: "50%", opacity: 0.0 },
      ], { duration: 1500, easing: "cubic-bezier(0.65,0,0.35,1)", fill: "forwards" });
      await anim.finished.catch(() => {});
      fly.remove();
      guard(me);
      // context: the trail of that day, the place, and when
      const others = photosForPlace(t, where.place).filter((x) => x !== p).slice(0, 4);
      await caption(`<div class="kicker">${d ? `Day ${d.n} · ${esc(A.dayLong(d))}` : ""}</div><h2>${esc((where.place && where.place.name) || "")}</h2><p>${esc((where.place && where.place.area) || "")}${d && d.title ? ` · ${esc(d.title)}` : ""}</p>${others.length ? `<div class="amb-thumbs">${others.map((x) => `<img src="${A.photoUrl(x, "t")}" alt="">`).join("")}</div>` : ""}`, { card: true });
      const db = where.day ? tripBounds(t, where.day) : null;
      if (db) map.fitBounds(db, { padding: ambPad(140, 320, 180), maxZoom: 11, pitch: 35, duration: 4200, essential: true });
      await wait(7500, me);
    }
    await caption("");
  }

  // ─── Boot ──────────────────────────────────────────────────────────────────
  async function boot() {
    await A.ensureSession();
    await Promise.all([loadData(), initMap()]);
    addRouteLayers();
    map.on("move", () => { if (markers.length) declutter(); });
    map.on("moveend", () => { if (tagMarkers.length) layoutTags(); });
    goHome({ duration: 0 });
    poke();
    if (params.get("trip")) { const t = S.trips.find((x) => x.id === params.get("trip")); if (t) openTrip(t, { day: params.get("day") ? Number(params.get("day")) : null, duration: 0 }); }
    if (params.get("play")) setTimeout(startAmbient, 800);
    setInterval(async () => {
      if (S.ambient || $("lightbox").classList.contains("on")) return; // ambient refreshes itself between loops
      try { if (await loadData()) refreshView(); } catch {}
    }, REFRESH_MS);
    document.addEventListener("visibilitychange", async () => {
      if (document.visibilityState !== "visible") return;
      keepAwake();
      try { if (await loadData() && !S.ambient) refreshView(); } catch {}
    });
  }

  function refreshView() {
    map.getSource("routes").setData(routeFeatures());
    if (S.view === "home") goHome({ duration: 800 });
    else if (S.trip) { renderTripHead(); renderRail(); buildPins(S.trip); buildHere(); if (S.day != null && !S.place) renderDaySheet(); }
  }

  boot().catch((e) => {
    console.error(e);
    document.body.insertAdjacentHTML("beforeend", `<div class="signin"><div class="signin-card"><div class="signin-kicker">Something went wrong</div><p style="color:var(--ink-soft)">${esc(e.message)}</p><button onclick="location.reload()">Try again</button></div></div>`);
  });
})();
</script>
